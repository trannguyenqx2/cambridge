<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge — Science & Maths</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         background:#f8fafc; color:#0f172a; min-height:100vh; }
  .col { max-width:480px; margin:0 auto; padding:16px 14px 40px; display:flex; flex-direction:column; gap:14px; }
  header.top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  h1 { font-size:24px; font-weight:900; letter-spacing:-.02em; line-height:1.15; }
  .sub { color:#94a3b8; font-size:13px; font-weight:600; margin-top:2px; }
  .langbar { display:flex; gap:4px; background:#e2e8f0; border-radius:999px; padding:3px; flex:none; }
  .langbar button { border:0; background:transparent; font:inherit; font-size:12px; font-weight:800; color:#64748b;
                    padding:5px 10px; border-radius:999px; cursor:pointer; }
  .langbar button.on { background:#0f172a; color:#fff; }
  .subjects { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .subj { border:0; font:inherit; text-align:left; color:#fff; padding:18px; border-radius:18px; cursor:pointer;
          transition:transform .08s; }
  .subj:active { transform:scale(.98); }
  .subj .ic { display:block; font-size:34px; margin-bottom:6px; }
  .subj .nm { display:block; font-size:19px; font-weight:900; }
  .subj .ds { display:block; margin-top:2px; font-size:12.5px; font-weight:600; opacity:.85; }
  .subj.sci { background:#0d9488; box-shadow:0 10px 20px rgba(13,148,136,.30); }
  .subj.math { background:#4f46e5; box-shadow:0 10px 20px rgba(79,70,229,.30); }
  .subj.dim { filter:saturate(.25); opacity:.55; box-shadow:none; }
  .stars { border-radius:18px; padding:16px 18px; color:#fff; display:flex; align-items:center; justify-content:space-between;
           background:linear-gradient(90deg,#f59e0b,#f97316); box-shadow:0 10px 20px rgba(245,158,11,.25); }
  .stars .lb { font-size:12px; font-weight:700; opacity:.92; }
  .stars .vl { font-size:32px; font-weight:900; line-height:1.05; }
  .stars .br { font-size:11.5px; font-weight:600; opacity:.9; margin-top:2px; }
  .stars .big { font-size:34px; }
  .goal { background:#fff; border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:14px;
          box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .ring { position:relative; width:64px; height:64px; flex:none; }
  .ring svg { transform:rotate(-90deg); }
  .ring .pc { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }
  .goal .gt { font-weight:900; font-size:15.5px; }
  .goal .gd { color:#64748b; font-size:12.5px; font-weight:600; margin-top:2px; }
  .books { display:flex; gap:7px; flex-wrap:wrap; }
  .books button { border:2px solid #e2e8f0; background:#fff; font:inherit; font-size:13.5px; font-weight:800; color:#475569;
                  padding:7px 13px; border-radius:999px; cursor:pointer; }
  .books button.on.sci { background:#0d9488; border-color:#0d9488; color:#fff; box-shadow:0 6px 14px rgba(13,148,136,.35); }
  .books button.on.math { background:#4f46e5; border-color:#4f46e5; color:#fff; box-shadow:0 6px 14px rgba(79,70,229,.35); }
  .map { border-radius:22px; padding:8px 10px 22px; }
  .map.sci { background:#ecfdf5; } .map.math { background:#f5f3ff; }
  .ribbon { display:flex; align-items:center; gap:8px; background:#4f46e5; color:#fff; font-weight:900; font-size:14.5px;
            border-radius:12px; padding:9px 14px; margin:16px 6px 4px; box-shadow:0 6px 14px rgba(79,70,229,.30); }
  .ribbon .tr { margin-left:auto; font-size:15px; }
  .path { position:relative; margin:0 4px; }
  .path svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; transform:translate(-50%,0); width:78px; display:flex; flex-direction:column; align-items:center; gap:3px;
          background:none; border:0; font:inherit; cursor:pointer; }
  .bubble { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:19px; font-weight:900; color:#fff; border:3px solid #fff; transition:transform .08s; }
  .node:active .bubble { transform:scale(.94); }
  .st-done .bubble { background:linear-gradient(180deg,#fbbf24,#f59e0b); box-shadow:0 6px 0 #b45309, 0 12px 18px rgba(245,158,11,.35); }
  .st-open .bubble { background:linear-gradient(180deg,#4ade80,#22c55e); box-shadow:0 6px 0 #15803d, 0 12px 18px rgba(34,197,94,.35); animation:pulse 1.6s infinite; }
  .st-prog .bubble { background:linear-gradient(180deg,#60a5fa,#3b82f6); box-shadow:0 6px 0 #1d4ed8, 0 12px 18px rgba(59,130,246,.35); }
  .st-lock .bubble { background:#cbd5e1; color:#94a3b8; box-shadow:0 6px 0 #94a3b8; }
  .st-soon .bubble { background:#fff; color:#cbd5e1; border:3px dashed #cbd5e1; box-shadow:none; }
  @keyframes pulse { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.18);} }
  .node .lb2 { font-size:11px; font-weight:800; color:#334155; text-align:center; line-height:1.15; max-width:78px; }
  .node .st3 { font-size:11px; letter-spacing:1px; color:#f59e0b; height:14px; }
  .node .st3 .off { color:#cbd5e1; }
  .shake { animation:shk .4s; } @keyframes shk { 0%,100%{transform:translate(-50%,0);} 25%{transform:translate(calc(-50% - 6px),0);} 75%{transform:translate(calc(-50% + 6px),0);} }
  .bossnode .bubble { width:68px; height:68px; font-size:30px; }
  .boss-ready .bubble { background:linear-gradient(180deg,#f87171,#dc2626); box-shadow:0 7px 0 #991b1b, 0 14px 22px rgba(220,38,38,.4); animation:pulse 1.6s infinite; }
  .boss-won .bubble { background:linear-gradient(180deg,#fbbf24,#f59e0b); box-shadow:0 7px 0 #b45309, 0 14px 22px rgba(245,158,11,.4); }
  .boss-lock .bubble { background:#cbd5e1; box-shadow:0 7px 0 #94a3b8; }
  .deco { position:absolute; font-size:17px; opacity:.7; pointer-events:none; }
  .soonbox { text-align:center; padding:36px 16px; color:#64748b; font-weight:700; font-size:15px; }
  .soonbox .e { font-size:42px; display:block; margin-bottom:8px; }
  footer { text-align:center; color:#94a3b8; font-size:12px; font-weight:600; line-height:1.5; padding:0 8px; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#0f172a; color:#fff; font-weight:700;
           font-size:14px; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:14px; }
  .modal.open { display:flex; }
  .mbox { background:#fff; border-radius:20px; max-width:440px; width:100%; padding:20px; max-height:92vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .mbox h2 { font-size:20px; font-weight:900; }
  .bprog { color:#64748b; font-weight:700; font-size:13px; margin:6px 0 2px; }
  .hearts { font-size:17px; letter-spacing:2px; }
  .bq { font-size:17.5px; font-weight:800; line-height:1.4; margin:10px 0 12px; }
  .bopt { display:block; width:100%; text-align:left; font:inherit; font-size:15.5px; font-weight:700; padding:12px 14px; margin:8px 0;
          border-radius:14px; border:2px solid #e2e8f0; background:#f8fafc; cursor:pointer; }
  .bopt.right { border-color:#22c55e; background:#f0fdf4; }
  .bopt.wrong { border-color:#ef4444; background:#fef2f2; }
  .bopt:disabled { cursor:default; }
  .breveal { font-weight:700; font-size:14.5px; background:#fff7ed; border:2px solid #fed7aa; border-radius:12px; padding:10px 12px; margin-top:10px; display:none; }
  .bbtn { font:inherit; font-weight:900; font-size:15.5px; border:0; border-radius:14px; padding:12px 18px; cursor:pointer; margin-top:14px; }
  .bbtn.go { background:#dc2626; color:#fff; box-shadow:0 6px 14px rgba(220,38,38,.35); }
  .bbtn.ghost { background:#f1f5f9; color:#334155; }
  .bres { text-align:center; padding:8px 0 2px; }
  .bres .e { font-size:46px; }
  .bres .t { font-size:20px; font-weight:900; margin:6px 0; }
  .bres .d { color:#64748b; font-weight:600; font-size:14px; }
</style>
<style id="skin2">

  .band .sub { color:rgba(255,255,255,.85); }

  @keyframes candyBounce { 0%,100%{ transform:translateY(0) rotate(-8deg);} 50%{ transform:translateY(-7px) rotate(8deg);} }

  .st-done.gold .bubble { background:linear-gradient(180deg,#fef9c3,#fcd34d); border-color:#fbbf24; color:#92400e; }
  .st-done .bubble, .st-prog .bubble { background:linear-gradient(180deg,#fce7f3,#f9a8d4); border-color:#f472b6; color:#be185d; animation:none; }
  .st-open .bubble { background:#fff; color:#db2777; border-color:#f472b6; animation:none; }
  .st-lock .bubble { background:#e2e8f0; border-color:#cbd5e1; color:#94a3b8; }
  .node .st3 { color:#f59e0b; font-size:12.5px; height:auto; margin-top:2px; }
  .node .st3 .off { color:#fbbf24; opacity:.6; }
  .node .lb2 { background:rgba(255,255,255,.78); border-radius:999px; padding:3px 10px; box-shadow:none;
          font-size:10.5px; color:rgba(131,24,67,.78); max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bossnode .bubble { width:80px; height:80px; }
  #toast { bottom:102px; }
  #botbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(480px,100%); z-index:40;
          background:linear-gradient(92deg,#ec4899,#fb7185); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
          display:flex; gap:10px; box-shadow:0 -6px 20px rgba(190,24,93,.25); }
  #botbar button { flex:1; border:0; font:inherit; font-weight:900; font-size:15px; color:#fff; cursor:pointer;
          background:rgba(255,255,255,.22); border-radius:14px; padding:12px 6px; }

</style>

<body>
<div class="col">
  <header class="band">
    <div><h1 id="ttl"></h1><div class="sub" id="tsub"></div><div class="brk" id="starBr"></div></div>
    <div class="right">
      <div class="spill" id="starVl">⭐ 0</div>
      <div class="langbar" id="langbar">

  <div class="map sci" id="map"></div>

</div>

</div>
<div id="toast"></div>

</div></div>

const $ = id => document.getElementById(id);
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2400); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const DECOS = ["🍬","🍭","🌸","🍀","⭐","🦋"];
function render(){
  document.querySelectorAll("#langbar button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("ttl").textContent = S("title"); $("tsub").textContent = S("tsub");
  $("sciDs").textContent = S("sciDs"); $("mathDs").textContent = S("mathDs");
  $("subjSci").classList.toggle("dim", view.tab !== "science");
  $("subjMath").classList.toggle("dim", view.tab !== "math");
  $("goalT").textContent = S("goalT"); $("foot").textContent = S("foot");
  $("bbPK").textContent = S("pk"); $("bbBot").textContent = S("botB"); $("bbOpt").textContent = S("optB");
  /* books */
  const bk = $("books"); bk.innerHTML = "";
  for (let n=1;n<=9;n++){ const b = document.createElement("button"); b.textContent = S("book")(n);
    if (n === view.book) b.className = "on " + (view.tab === "science" ? "sci" : "math");
    b.onclick = () => { view.book = n; saveView(); render(); }; bk.appendChild(b); }
  /* totals across produced lessons */
  const wallet = loadWallet();
  let lessonStars = 0, prodTotal = 0, prodDone = 0;
  Object.values(DATA).forEach(books => Object.values(books).forEach(units => units.forEach(u => u.items.forEach(it => {
    if (it.file){ const p = getProgress(it); lessonStars += starsOf(p); }
  }))));
  $("starVl").textContent = (isBypass() ? "🔓 " : "") + "⭐ " + (lessonStars + wallet.stars);
  $("starBr").textContent = S("starBr")(lessonStars, wallet.stars);
  /* map */
  const map = $("map"); map.className = "map " + (view.tab === "science" ? "sci" : "math"); map.innerHTML = "";
  const units = (DATA[view.tab] || {})[view.book];
  if (!units){ map.innerHTML = '<div class="soonbox"><span class="e">🚀</span>' + S("soon") + "</div>";
    $("ringPc").textContent = "0%"; $("ringFg").style.strokeDashoffset = 169.6; $("goalD").textContent = S("goalD")(0,0); return; }
  /* sequential unlock over produced lessons in book order */
  const flat = []; units.forEach(u => u.items.forEach(it => flat.push(it)));
  const produced = flat.filter(it => it.file);
  produced.forEach(it => { const p = getProgress(it); if (p){ prodTotal++; if (complete(p)) prodDone++; } else prodTotal++; });
  const pct = produced.length ? Math.round(100 * produced.filter(it => complete(getProgress(it))).length / produced.length) : 0;
  $("ringPc").textContent = pct + "%"; $("ringFg").style.strokeDashoffset = (169.6 * (1 - pct/100)).toFixed(1);
  $("ringFg").style.stroke = view.tab === "science" ? "#0d9488" : "#4f46e5";
  $("goalD").textContent = S("goalD")(produced.filter(it => complete(getProgress(it))).length, produced.length);
  let prevComplete = true, firstProduced = true;
  const openMap = {};
  produced.forEach(it => { const p = getProgress(it); openMap[it.code] = firstProduced || prevComplete || !!p; firstProduced = false; prevComplete = complete(p); });
  if (isBypass()) produced.forEach(it => { openMap[it.code] = true; });
  const curItem = produced.find(it => openMap[it.code] && !complete(getProgress(it)));
  const currentCode = curItem ? curItem.code : null;
  window.__cur = curItem ? curItem.file : null;
  units.forEach(u => {
    const sec = document.createElement("div");
    const bossKey = (view.tab === "science" ? "sci" : "math") + view.book + "-u" + u.u;
    const unitProduced = u.items.filter(it => it.file);
    const unitAllDone = isBypass() || (unitProduced.length === u.items.length && unitProduced.length > 0 && unitProduced.every(it => complete(getProgress(it))));
    const bossWon = !!wallet.bossWins[bossKey];
    const rib = document.createElement("div"); rib.className = "ribbon";
    const UIC = {1:"🌱",2:"🔊",3:"🧱",4:"🌍",5:"🧒",6:"🚀"};
    const uEarned = unitProduced.reduce((a, it) => a + starsOf(getProgress(it)), 0);
    rib.innerHTML = '<div class="chip">' + (UIC[u.u] || "📘") + '</div><div><div class="rnm">Unit ' + u.u + " · " +
      (LANG === "vi" ? u.vi : (LANG === "en" ? u.en : u.en + " · " + u.vi)) + '</div><div class="rsub">' +
      S("unitSub")(u.items.length, uEarned, unitProduced.length * 3) + "</div></div>" + (bossWon ? '<span class="tr">🏆</span>' : "");
    sec.appendChild(rib);
    const rows = u.items.length + ((unitProduced.length === u.items.length && BANKS[bossKey]) ? 1 : 0);
    const H = rows * 148 + 8;
    const path = document.createElement("div"); path.className = "path"; path.style.height = H + "px";
    path.innerHTML = "<svg></svg>";
    const xs = [50, 16, 50, 84];
    let pts = [];
    const posOf = i => ({ x: xs[i % 4], y: 74 + i * 148 });
    u.items.forEach((it, i) => pts.push(posOf(i)));
    if (rows > u.items.length) pts.push({ x:50, y: 74 + u.items.length * 148 });
    pts.forEach((p, i) => { if (i % 2 === 1) { const d = document.createElement("div"); d.className = "deco"; d.textContent = DECOS[(u.u + i) % DECOS.length];
      d.style.left = ((p.x + 26) % 92) + "%"; d.style.top = (p.y + 8) + "px"; path.appendChild(d); } });
    u.items.forEach((it, i) => {
      const p = posOf(i), prog = getProgress(it);
      const node = document.createElement("button");
      let st, face;
      const st3 = it.file ? starsOf(prog) : 0;
      if (!it.file){ st = "st-soon"; face = "…"; }
      else if (complete(prog)){ st = st3 >= 3 ? "st-done gold" : "st-done"; face = "✓"; }
      else if (it.code === currentCode){ st = "st-cur"; face = it.code; }
      else if (prog){ st = "st-prog"; face = it.code; }
      else if (openMap[it.code]){ st = "st-open"; face = it.code; }
      else { st = "st-lock"; face = "🔒"; }
      node.className = "node " + st; node.style.left = p.x + "%"; node.style.top = (p.y - 34) + "px";
      node.innerHTML = (st === "st-cur" ? '<div class="candypin">🍭</div>' : "") + '<div class="bubble">' + face + '</div>' +
        (st3 > 0 ? '<div class="st3">' + "★".repeat(st3) + '<span class="off">' + "☆".repeat(3 - st3) + "</span></div>" : "") +
        '<div class="lb2">' + it.code + " " + (LANG === "vi" ? it.vi : it.en) + "</div>";
      node.onclick = () => {
        if (!it.file){ toast(S("soon")); return; }
        if (st === "st-lock"){ node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); toast(S("locked")); return; }
        location.href = it.file;
      };
      path.appendChild(node);
    });
    if (rows > u.items.length){
      const p = pts[pts.length - 1];
      const bn = document.createElement("button");
      const bst = bossWon ? "boss-won" : (unitAllDone ? "boss-ready" : "boss-lock");
      bn.className = "node bossnode " + bst; bn.style.left = p.x + "%"; bn.style.top = (p.y - 40) + "px";
      bn.innerHTML = '<div class="bubble">' + (bossWon ? "🏆" : "👹") + '</div><div class="lb2">' + S("boss") + "</div>";
      bn.onclick = () => { if (!unitAllDone && !bossWon){ bn.classList.remove("shake"); void bn.offsetWidth; bn.classList.add("shake"); toast(S("bossLocked")); return; } openBoss(bossKey, u.u); };
      path.appendChild(bn);
    }
    sec.appendChild(path); map.appendChild(sec);
  });
  requestAnimationFrame(drawRoads);
}
/* Smooth saga road, drawn exactly like toan.b-media.vn: measure the real node
   centres after layout, join them with vertical-tangent cubic curves,
   white 34px at 55% + pink dotted centre line. */
function drawRoads(){
  document.querySelectorAll(".path").forEach(path => {
    const svg = path.querySelector("svg"); if (!svg) return;
    const circles = path.querySelectorAll(".bubble"); if (circles.length < 2) { svg.innerHTML = ""; return; }
    const rr = path.getBoundingClientRect();
    const pts = [...circles].map(c => { const r = c.getBoundingClientRect();
      return [r.left - rr.left + r.width / 2, r.top - rr.top + r.height / 2]; });
    svg.setAttribute("viewBox", "0 0 " + rr.width + " " + rr.height);
    let d = "M " + pts[0][0] + " " + pts[0][1];
    for (let i = 1; i < pts.length; i++){
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1];
      const my = (y0 + y1) / 2;
      d += " C " + x0 + " " + my + ", " + x1 + " " + my + ", " + x1 + " " + y1;
    }
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.55"/>' +
      '<path d="' + d + '" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.9"/>';
  });
}
function saveView(){ try { localStorage.setItem("camb:hub-view", JSON.stringify(view)); } catch(e){} }
$("subjSci").onclick = () => { view.tab = "science"; saveView(); render(); };
$("subjMath").onclick = () => { view.tab = "math"; saveView(); render(); };
document.querySelectorAll("#langbar button").forEach(b => b.onclick = () => { LANG = b.dataset.l; localStorage.setItem("camb:hub-lang", LANG); render(); });
/* ============ boss fight ============ */
let boss = null;
function openBoss(key, unitNo){
  boss = { key, unitNo, qs: shuffle(BANKS[key]).slice(0, 8), idx: 0, me: 0, bo: 0, hearts: 3, phase: "intro", order: null };
  $("bossModal").classList.add("open"); renderBoss();
}
function closeBoss(){ $("bossModal").classList.remove("open"); boss = null; render(); }
function heartsStr(){ return "❤️".repeat(boss.hearts) + "🖤".repeat(3 - boss.hearts); }
function renderBoss(){
  const box = $("bossBox");
  if (boss.phase === "intro"){
    box.innerHTML = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bq" style="font-weight:700;font-size:15.5px">' + S("bossIntro") +
      '</div><button class="bbtn go" id="bStart">' + S("start") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bStart").onclick = () => { boss.phase = "q"; boss.order = shuffle(boss.qs[0].o.map((_, i) => i)); renderBoss(); };
    $("bClose").onclick = closeBoss; return;
  }
  if (boss.phase === "end"){
    const won = boss.result === "win"; const w = loadWallet(); const again = won && !boss.firstWin;
    box.innerHTML = '<div class="bres"><div class="e">' + (won ? "🏆" : "👹") + '</div><div class="t">' + (won ? S("win") : S("lose")) +
      '</div><div class="d">' + (won ? S("winD")(again) : S("loseD")) + "<br>" + S("qOf")(boss.qs.length, boss.qs.length, boss.me, boss.bo, heartsStr()) +
      '</div></div><button class="bbtn go" id="bAgain">' + S("again") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bAgain").onclick = () => openBoss(boss.key, boss.unitNo);
    $("bClose").onclick = closeBoss; return;
  }
  const q = boss.qs[boss.idx];
  let html = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bprog">' + S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr()) + "</div>";
  html += '<div class="bq">' + txt(q.q) + "</div>";
  boss.order.forEach(oi => { html += '<button class="bopt" data-oi="' + oi + '">' + txt(q.o[oi]) + "</button>"; });
  html += '<div class="breveal" id="bRev"></div><div id="bNext"></div>';
  box.innerHTML = html;
  box.querySelectorAll(".bopt").forEach(btn => btn.onclick = () => answerBoss(parseInt(btn.dataset.oi, 10)));
}
function answerBoss(oi){
  const q = boss.qs[boss.idx]; const right = oi === q.a;
  if (right) boss.me++; else boss.hearts--;
  const bossRight = Math.random() < 0.75;
  let bossPick = q.a;
  if (!bossRight){ const wrongs = q.o.map((_, i) => i).filter(i => i !== q.a); bossPick = wrongs[Math.floor(Math.random() * wrongs.length)]; }
  if (bossRight) boss.bo++;
  const box = $("bossBox");
  box.querySelectorAll(".bopt").forEach(btn => { const b = parseInt(btn.dataset.oi, 10); btn.disabled = true;
    if (b === q.a) btn.classList.add("right"); else if (b === oi) btn.classList.add("wrong"); });
  const rev = $("bRev"); rev.style.display = "block";
  rev.innerHTML = (right ? S("right") : S("wrong")) + "<br>" + (bossRight ? S("bossRight")(txt(q.o[bossPick])) : S("bossWrong")(txt(q.o[bossPick])));
  const prog = box.querySelector(".bprog"); if (prog) prog.textContent = S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr());
  if (boss.hearts <= 0){ boss.phase = "end"; boss.result = "lose"; setTimeout(renderBoss, 900); return; }
  $("bNext").innerHTML = '<button class="bbtn go" id="bNx">' + S("next") + "</button>";
  $("bNx").onclick = () => { boss.idx++;
    if (boss.idx >= boss.qs.length){ boss.phase = "end";
      if (boss.me > boss.bo){ boss.result = "win"; const w = loadWallet();
        if (!w.bossWins[boss.key]){ w.bossWins[boss.key] = true; w.stars += 3; saveWallet(w); boss.firstWin = true; } }
      else boss.result = "lose";
      renderBoss(); return; }
    boss.order = shuffle(boss.qs[boss.idx].o.map((_, i) => i)); renderBoss(); };
}
$("bossModal").addEventListener("click", e => { if (e.target === $("bossModal")) closeBoss(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && boss) closeBoss(); });
$("starVl").style.cursor = "pointer";
$("starVl").onclick = () => {
  if (isBypass()){ try { localStorage.removeItem("camb:test-bypass"); } catch(e){} toast(S("bypassOff")); render(); return; }
  $("acctT").textContent = S("acctT"); $("acctHint").textContent = S("acctHint");
  $("acctGo").textContent = S("acctGo"); $("acctClose").textContent = S("close");
  $("acctIn").value = ""; $("acctModal").classList.add("open");
  setTimeout(() => { try { $("acctIn").focus(); } catch(e){} }, 60);
};
function tryAcct(){
  const v = $("acctIn").value.trim().toLowerCase();
  if (v === "congtuth"){ try { localStorage.setItem("camb:test-bypass", "1"); } catch(e){}
    $("acctModal").classList.remove("open"); toast(S("bypassOn")); render(); }
  else toast(S("acctWrong"));
}
$("acctGo").onclick = tryAcct;
$("acctIn").addEventListener("keydown", e => { if (e.key === "Enter") tryAcct(); });
$("acctClose").onclick = () => $("acctModal").classList.remove("open");
$("acctModal").addEventListener("click", e => { if (e.target === $("acctModal")) $("acctModal").classList.remove("open"); });
$("bbPK").onclick = () => toast(S("pkSoon"));
$("bbBot").onclick = () => { if (window.__cur) location.href = window.__cur; else toast(S("botNone")); };
$("bbOpt").onclick = () => { LANG = LANG === "en" ? "mix" : (LANG === "mix" ? "vi" : "en"); localStorage.setItem("camb:hub-lang", LANG); render(); };
render();
</script>
<!-- CAMB-BRIDGE v1 --><script>
/* CAMB-BRIDGE v1 — Cambridge <-> toan.b-media.vn: login sync + progress/stars sync.
 *
 * Inlined into the hub and every lesson by bridge/inject_bridge.py (marked block).
 * Dependency-free, defensive: it NEVER throws into the page. If the platform API
 * is unreachable (e.g. the standalone GitHub Pages origin, where /api/* does not
 * exist), the bridge stays dormant and the pages behave exactly as before
 * (localStorage-only progress). One console note maximum.
 *
 * How the token arrives (localStorage is per-origin):
 *   (a) same origin — Cambridge served from the platform server's
 *       public/cambridge/: the platform app already stored the session in
 *       localStorage key "toanlop4_auth_v1"; the bridge just reads it.
 *   (b) fragment handoff — the platform links to Cambridge with #token=<token>
 *       (the pattern its own OAuth flow uses): the bridge stores it under the
 *       same key, in the platform's own storage shape, and strips the fragment.
 *   (c) no token — guest/local mode.
 *
 * API base: relative "/api/..." by default, so it works on ANY origin that is
 * served by / tunnelled to the platform server (toan.b-media.vn/cambridge/,
 * or cambridge.b-media.vn once the tunnel points it at the same server).
 * Set window.CAMB_API_BASE before this script only for exotic setups.
 *
 * Sync model (no lesson rewrites): the bridge OBSERVES the lessons' existing
 * localStorage records — summaries "camb:sum:..." and the battle wallet
 * "camb:wallet" — and reports changes to the platform:
 *   summary change -> POST /api/saga/progress {module, lessonId, pct, q, maxOpen}
 *       pct = combined steps+exercises completion % of the summary;
 *       q   = best quiz fraction (summary q / qt);
 *       maxOpen = the lesson's 1-based position in its book (Science 1 map
 *       embedded below; server only ever raises it).
 *   lesson opened  -> POST /api/saga/theory (once per lesson)
 *   new wallet.botWins[code]  -> POST /api/solo-result, mode "bot"
 *   new wallet.bossWins[key]  -> POST /api/solo-result, mode "boss"
 * The wallet records only THAT a duel/boss was won, never the score, so battle
 * reports encode the win minimally: bot = the duel's 4 questions completed,
 * botId "easy", playerScore 1 / botScore 0 (the win flag); boss = 5/8 correct,
 * bossTier "easy" (5/8 is the smallest score the server's own 60% easy
 * threshold accepts as the win the wallet recorded). The server stays the
 * authority: it recomputes stars and applies its daily caps regardless.
 * Failed posts go to a retry queue in localStorage ("camb:bridge-queue-v1"),
 * flushed on `online`, on load and on visibility return — the same approach
 * (and the same accepted duplicate risk for solo-result) as the platform's
 * own offline queue.
 */
(function () {
  "use strict";
  var AUTH_KEY = "toanlop4_auth_v1";
  var QUEUE_KEY = "camb:bridge-queue-v1";
  var SENT_KEY = "camb:bridge-sent-v1";
  var API_BASE = (typeof window !== "undefined" && window.CAMB_API_BASE) || "";
  var noted = false;
  function note(msg) { if (!noted) { noted = true; try { console.info("[camb-bridge] " + msg); } catch (e) {} } }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function parseJson(s) { try { return JSON.parse(s); } catch (e) { return null; } }

  /* ---------- token intake ---------- */
  function storeToken(token) {
    var cur = parseJson(lsGet(AUTH_KEY) || "null") || {};
    cur.token = token;
    if (!("user" in cur)) cur.user = null;
    cur.savedAt = Date.now();
    lsSet(AUTH_KEY, JSON.stringify(cur));
  }
  (function intakeFragment() {
    try {
      var h = window.location.hash || "";
      var m = h.match(/token=([^&]+)/);
      if (m) {
        storeToken(decodeURIComponent(m[1]));
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      }
    } catch (e) {}
  })();
  function getToken() {
    var raw = lsGet(AUTH_KEY);
    if (!raw) return null;
    if (raw.charAt(0) === "{") { var o = parseJson(raw); return (o && o.token) || null; }
    return raw; // tolerate a bare token string
  }

  /* ---------- small state ---------- */
  var token = getToken();
  var user = null;          // window.CAMB_USER once profile loads
  var apiDown = false;      // network-level failure seen (standalone origin etc.)
  function loadSent() { return parseJson(lsGet(SENT_KEY) || "null") || { sums: {}, bot: {}, boss: {}, theory: {} }; }
  function saveSent(s) { lsSet(SENT_KEY, JSON.stringify(s)); }
  function loadQueue() { var q = parseJson(lsGet(QUEUE_KEY) || "null"); return Array.isArray(q) ? q : []; }
  function saveQueue(q) { lsSet(QUEUE_KEY, JSON.stringify(q.slice(-80))); }
  function queuePost(url, body, meta) {
    var q = loadQueue();
    var sig = url + "|" + JSON.stringify(body);
    for (var i = 0; i < q.length; i++) if (q[i].url + "|" + JSON.stringify(q[i].body) === sig) return;
    q.push({ url: url, body: body, at: Date.now(), meta: meta || null });
    saveQueue(q);
  }

  /* ---------- API ---------- */
  function api(path, method, body, keepalive) {
    return new Promise(function (resolve, reject) {
      var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 8000) : null;
      var headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = "Bearer " + token;
      fetch(API_BASE + path, {
        method: method || "GET",
        headers: headers,
        body: body ? JSON.stringify(body) : undefined,
        signal: ctl ? ctl.signal : undefined,
        keepalive: !!keepalive
      }).then(function (res) {
        if (timer) clearTimeout(timer);
        return res.text().then(function (txt) {
          var data = parseJson(txt || "null");
          if (!res.ok) { var err = new Error("HTTP " + res.status); err.status = res.status; err.data = data; throw err; }
          resolve(data);
        });
      }).catch(function (e) {
        if (timer) clearTimeout(timer);
        reject(e);
      });
    });
  }
  // POST that queues on network failure; resolves true when the server took it.
  function post(path, body, meta, keepalive) {
    return api(path, "POST", body, keepalive).then(function (data) {
      if (data && typeof data.stars === "number" && user) { user.stars = data.stars; renderHubAccount(); }
      return true;
    }).catch(function (e) {
      if (e && e.status === 401) { onUnauthorized(); return false; }
      if (!e || !e.status) { apiDown = true; note("platform API unreachable — staying in local mode, will retry."); }
      queuePost(path, body, meta);
      return false;
    });
  }
  function onUnauthorized() {
    token = null; user = null; window.CAMB_USER = null;
    lsDel(AUTH_KEY);
    note("session expired or invalid — signed out locally.");
    renderHubAccount();
  }

  /* ---------- hub account chip (hub only: lessons have no #starVl) ---------- */
  function platformOrigin() {
    if (typeof window !== "undefined" && window.CAMB_PLATFORM_ORIGIN) return window.CAMB_PLATFORM_ORIGIN;
    return window.location.hostname === "toan.b-media.vn" ? window.location.origin : "https://toan.b-media.vn";
  }
  function renderHubAccount() {
    try {
      var pill = document.getElementById("starVl");
      if (!pill || !pill.parentNode) return; // not the hub — stay invisible
      var chip = document.getElementById("cambAcct");
      if (!chip) {
        chip = document.createElement("div");
        chip.id = "cambAcct";
        chip.style.cssText = "font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.22);" +
          "border-radius:999px;padding:5px 10px;text-align:right;line-height:1.35;max-width:230px";
        pill.parentNode.insertBefore(chip, pill);
      }
      if (user) {
        chip.innerHTML = "";
        var s1 = document.createElement("span");
        s1.textContent = "👤 " + user.username + " · ⭐ " + user.stars;
        chip.appendChild(s1);
      } else if (token && !apiDown) {
        chip.textContent = "…";
      } else if (token && apiDown) {
        chip.textContent = "Chưa nối được máy chủ — tiến trình lưu trên máy này";
      } else {
        chip.innerHTML = "";
        var t = document.createElement("span");
        t.textContent = "Chưa đăng nhập — tiến trình chỉ lưu trên máy này ";
        var a = document.createElement("a");
        a.href = platformOrigin() + "/";
        a.textContent = "Đăng nhập";
        a.style.cssText = "color:#fff;text-decoration:underline;font-weight:800";
        chip.appendChild(t); chip.appendChild(a);
      }
    } catch (e) {}
  }

  /* ---------- sync: summaries -> saga/progress ---------- */
  var SCI1_ORDER = ["1-1","1-2","1-3","1-4","2-1","2-2","2-3","3-1","3-2","3-3","3-4",
    "4-1","4-2","4-3","4-4","5-1","5-2","5-3","5-4","6-1","6-2","6-3","6-4","6-5"];
  function maxOpenFor(module, lessonId) {
    if (module === "sci1") { var i = SCI1_ORDER.indexOf(lessonId); return i >= 0 ? i + 1 : 0; }
    return 0;
  }
  function currentLesson() {
    var m = (window.location.pathname || "").match(/(sci|math)(\d+)-(\d+)-(\d+)-/);
    if (!m) return null;
    return { module: m[1] + m[2], lessonId: m[3] + "-" + m[4], code: m[3] + "." + m[4] };
  }
  function syncSummaries(keepalive) {
    if (!token || !user) return Promise.resolve();
    var sent = loadSent();
    var jobs = [];
    var keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("camb:sum:") === 0) keys.push(k); } } catch (e) {}
    keys.forEach(function (key) {
      var sm = parseJson(lsGet(key) || "null");
      if (!sm) return;
      var idm = key.slice("camb:sum:".length).match(/^(sci|math)(\d+)-(\d+)-(\d+)$/);
      if (!idm) return;
      var module = idm[1] + idm[2], lessonId = idm[3] + "-" + idm[4];
      var s = +sm.s || 0, st = +sm.st || 0, e2 = +sm.e || 0, et = +sm.et || 0, q = +sm.q || 0, qt = +sm.qt || 0;
      if (s + e2 + q <= 0) return; // nothing achieved yet — don't create empty entries
      var hash = [s, st, e2, et, q, qt].join("/");
      if (sent.sums[key] === hash) return;
      var pct = (st + et) > 0 ? Math.round(100 * (s + e2) / (st + et)) : 0;
      var body = { module: module, lessonId: lessonId, pct: pct, q: qt > 0 ? q / qt : 0, maxOpen: maxOpenFor(module, lessonId) };
      jobs.push(post("/api/saga/progress", body, { sumKey: key, hash: hash }, keepalive).then(function (ok) {
        if (ok) { var s2 = loadSent(); s2.sums[key] = hash; saveSent(s2); }
      }));
    });
    return Promise.all(jobs);
  }

  /* ---------- sync: wallet -> solo-result (bot / boss) ---------- */
  function syncWallet(keepalive) {
    if (!token || !user) return Promise.resolve();
    var w = parseJson(lsGet("camb:wallet") || "null");
    if (!w) return Promise.resolve();
    var sent = loadSent();
    var jobs = [];
    var here = currentLesson();
    Object.keys(w.botWins || {}).forEach(function (code) {
      if (!w.botWins[code] || sent.bot[code]) return;
      var pm = String(code).match(/^(\d+)\.(\d+)$/);
      if (!pm) return;
      var module = here ? here.module : "sci1"; // wallet codes carry no book; only sci1 exists today
      var lessonId = pm[1] + "-" + pm[2];
      var body = { score: 4, correct: 4, total: 4, bonus: 0, subject: "science",
        moduleId: module, lessonId: lessonId, lessonTitle: code, mode: "bot",
        botId: "easy", playerScore: 1, botScore: 0, botModule: module, botLesson: lessonId };
      jobs.push(post("/api/solo-result", body, { botCode: code }, keepalive).then(function (ok) {
        if (ok) { var s2 = loadSent(); s2.bot[code] = 1; saveSent(s2); }
      }));
    });
    Object.keys(w.bossWins || {}).forEach(function (bkey) {
      if (!w.bossWins[bkey] || sent.boss[bkey]) return;
      var bm = String(bkey).match(/^(sci|math)(\d+)-u(\d+)$/);
      if (!bm) return;
      var module = bm[1] + bm[2], unitId = "u" + bm[3];
      var body = { score: 5, correct: 5, total: 8, bonus: 0, subject: "science",
        moduleId: module, lessonId: unitId, lessonTitle: "Boss Unit " + bm[3], mode: "boss",
        bossTier: "easy", bossModule: module, bossLesson: unitId };
      jobs.push(post("/api/solo-result", body, { bossKey: bkey }, keepalive).then(function (ok) {
        if (ok) { var s2 = loadSent(); s2.boss[bkey] = 1; saveSent(s2); }
      }));
    });
    return Promise.all(jobs);
  }

  /* ---------- sync: lesson opened -> saga/theory (once) ---------- */
  function syncTheory(keepalive) {
    if (!token || !user) return Promise.resolve();
    var here = currentLesson();
    if (!here) return Promise.resolve();
    var key = here.module + "/" + here.lessonId;
    var sent = loadSent();
    if (sent.theory[key]) return Promise.resolve();
    return post("/api/saga/theory", { module: here.module, lessonId: here.lessonId }, { theoryKey: key }, keepalive)
      .then(function (ok) { if (ok) { var s2 = loadSent(); s2.theory[key] = 1; saveSent(s2); } });
  }

  /* ---------- offline queue flush ---------- */
  function flushQueue() {
    if (!token || !user) return Promise.resolve();
    var q = loadQueue();
    if (!q.length) return Promise.resolve();
    saveQueue([]);
    var chain = Promise.resolve();
    q.forEach(function (item) {
      chain = chain.then(function () {
        return api(item.url, "POST", item.body).then(function (data) {
          if (data && typeof data.stars === "number" && user) { user.stars = data.stars; renderHubAccount(); }
          var meta = item.meta || {};
          var s2 = loadSent(), dirty = false;
          if (meta.sumKey && meta.hash) { s2.sums[meta.sumKey] = meta.hash; dirty = true; }
          if (meta.botCode) { s2.bot[meta.botCode] = 1; dirty = true; }
          if (meta.bossKey) { s2.boss[meta.bossKey] = 1; dirty = true; }
          if (meta.theoryKey) { s2.theory[meta.theoryKey] = 1; dirty = true; }
          if (dirty) saveSent(s2);
        }).catch(function (e) {
          if (e && e.status === 401) { onUnauthorized(); return; }
          queuePost(item.url, item.body, item.meta); // still failing — requeue
        });
      });
    });
    return chain;
  }

  function syncAll(keepalive) {
    if (!token || !user) return;
    syncTheory(keepalive)
      .then(function () { return syncSummaries(keepalive); })
      .then(function () { return syncWallet(keepalive); })
      .catch(function () {});
  }

  /* ---------- boot ---------- */
  function boot() {
    renderHubAccount();
    if (!token) { note("no platform session — guest/local mode."); return; }
    api("/api/profile", "GET").then(function (p) {
      if (!p || !p.username) { apiDown = true; renderHubAccount(); return; }
      user = { username: p.username, stars: p.stars || 0, testBypass: !!p.testBypass };
      window.CAMB_USER = user;
      if (p.testBypass || String(p.username).toLowerCase() === "congtuth") lsSet("camb:test-bypass", "1");
      else lsDel("camb:test-bypass");
      renderHubAccount();
      flushQueue().then(function () { syncAll(false); });
    }).catch(function (e) {
      if (e && e.status === 401) { onUnauthorized(); return; }
      apiDown = true; // standalone origin / server down: keep token, stay silent
      note("platform API unreachable — staying in local mode, will retry.");
      renderHubAccount();
    });
    setInterval(function () { if (user) syncAll(false); }, 5000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden && user) { flushQueue().then(function () { syncAll(false); }); } });
    window.addEventListener("beforeunload", function () { if (user) syncAll(true); });
    window.addEventListener("storage", function () { if (user) syncAll(false); });
    window.addEventListener("online", function () { if (user) flushQueue().then(function () { syncAll(false); }); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
