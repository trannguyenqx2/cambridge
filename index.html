"sci6-u5":[
 {q:["What is the difference between mass and weight?","Sự khác nhau giữa khối lượng (mass) và trọng lượng (weight) là gì?"],o:[["There is no difference","Không có sự khác nhau"],["Mass is the amount of matter in an object, measured in kilograms; weight is the pull of gravity on it, measured in newtons","Khối lượng (mass) là lượng chất trong một vật, đo bằng kilôgam; trọng lượng (weight) là lực hút của trọng lực (gravity) lên nó, đo bằng niutơn (newton)"],["Mass is measured in newtons and weight in kilograms","Khối lượng đo bằng niutơn còn trọng lượng đo bằng kilôgam"]],a:1},
 {q:["An astronaut goes to the Moon. What happens to her mass and her weight?","Một phi hành gia lên Mặt trăng. Điều gì xảy ra với khối lượng (mass) và trọng lượng (weight) của cô ấy?"],o:[["Her mass gets smaller and her weight stays the same","Khối lượng của cô ấy nhỏ đi và trọng lượng giữ nguyên"],["Both her mass and her weight get smaller","Cả khối lượng và trọng lượng của cô ấy đều nhỏ đi"],["Her mass stays the same and her weight gets smaller, because the Moon’s gravity is weaker","Khối lượng của cô ấy giữ nguyên và trọng lượng nhỏ đi, vì trọng lực (gravity) của Mặt trăng yếu hơn"]],a:2},
 {q:["On Earth, an object has a mass of 3 kg. What is its weight?","Trên Trái Đất, một vật có khối lượng (mass) 3 kg. Trọng lượng (weight) của nó là bao nhiêu?"],o:[["30 N","30 N"],["3 N","3 N"],["300 N","300 N"]],a:0},
 {q:["Why do astronauts float inside the International Space Station?","Vì sao phi hành gia trôi nổi bên trong Trạm Không gian Quốc tế?"],o:[["Because there is no air in the station","Vì trong trạm không có không khí"],["Because the station keeps falling towards Earth as it moves forward, so inside it they are not pulled in any one direction","Vì trạm liên tục rơi về phía Trái Đất trong khi bay về phía trước, nên ở bên trong họ không bị kéo về một hướng nào nhất định"],["Because their mass becomes zero in space","Vì khối lượng (mass) của họ trở thành không ngoài không gian"]],a:1},
 {q:["A ball is at rest on a table and no new force acts on it. What happens?","Một quả bóng đứng yên (at rest) trên bàn và không có lực mới nào tác dụng lên nó. Điều gì xảy ra?"],o:[["It starts rolling by itself","Nó tự lăn đi"],["It stays at rest","Nó vẫn đứng yên (at rest)"],["It changes shape","Nó thay đổi hình dạng (shape)"]],a:1},
 {q:["Zara pedals her bike harder and the bike goes faster. What is the effect of this force?","Zara đạp xe mạnh hơn và xe đi nhanh hơn. Tác dụng của lực này là gì?"],o:[["It changes the speed of the bike","Nó làm thay đổi tốc độ (speed) của xe"],["It changes the shape of the bike","Nó làm thay đổi hình dạng (shape) của xe"],["It stops the bike","Nó làm xe dừng lại"]],a:0},
 {q:["A ball rolls across a table cloth and slows down. Which force slows it?","Một quả bóng lăn trên khăn trải bàn và chậm lại. Lực nào làm nó chậm lại?"],o:[["Gravity","Lực hấp dẫn (gravity)"],["The push of the hand","Lực đẩy của tay"],["Friction","Ma sát (friction)"]],a:2},
 {q:["Which force diagram is right for a ball resting on the ground?","Sơ đồ lực (force diagram) nào đúng cho một quả bóng nằm yên trên mặt đất?"],o:[["One arrow only: gravity pulling down","Chỉ một mũi tên: lực hấp dẫn (gravity) kéo xuống"],["Gravity pulling down and the ground pushing up, with equal arrows","Lực hấp dẫn (gravity) kéo xuống và mặt đất đẩy lên, hai mũi tên bằng nhau"],["No arrows, because no forces act","Không có mũi tên nào, vì không có lực nào tác dụng"]],a:1},
 {q:["An object will float when…","Một vật sẽ nổi (float) khi…"],o:[["its mass is greater than the mass of water it displaces","khối lượng (mass) của nó lớn hơn khối lượng nước nó chiếm chỗ (displaced)"],["its mass is less than, or equal to, the mass of water it displaces","khối lượng (mass) của nó nhỏ hơn, hoặc bằng, khối lượng nước nó chiếm chỗ (displaced)"],["its mass makes no difference","khối lượng (mass) của nó không quan trọng"]],a:1},
 {q:["What is upthrust?","Lực đẩy lên (upthrust) là gì?"],o:[["The push of the water upwards on an object","Sức đẩy của nước hướng lên trên một vật"],["The pull of gravity downwards","Sức kéo của lực hấp dẫn (gravity) hướng xuống"],["The push of the wind on an object","Sức đẩy của gió lên một vật"]],a:0},
 {q:["Sofia and Zara added 5 g coins to a raft. It sank when they added the seventh coin. Why did it sink?","Sofia và Zara thêm các đồng xu 5 g lên một chiếc bè. Nó chìm khi các bạn thêm đồng xu thứ bảy. Vì sao nó chìm?"],o:[["The coins were too shiny","Các đồng xu quá sáng bóng"],["The raft got wet","Chiếc bè bị ướt"],["The total mass became greater than the mass of water the raft displaced","Tổng khối lượng (mass) trở nên lớn hơn khối lượng nước mà chiếc bè chiếm chỗ (displaced)"]],a:2},
 {q:["A foil boat with a bigger base area holds more coins before it sinks because…","Một chiếc thuyền giấy bạc có diện tích đáy lớn hơn giữ được nhiều xu hơn trước khi chìm vì…"],o:[["it is heavier","nó nặng hơn"],["it displaces more water","nó chiếm chỗ (displaced) nhiều nước hơn"],["the coins stick to it","các đồng xu dính vào nó"]],a:1},
 {q:["Why do circuit diagrams use conventional symbols?","Vì sao sơ đồ mạch điện (circuit diagram) dùng ký hiệu quy ước (conventional symbol)?"],o:[["Because drawings of real components are prettier","Vì hình vẽ linh kiện thật đẹp hơn"],["Because everyone uses the same symbols, so anyone can read the diagram quickly","Vì mọi người đều dùng cùng ký hiệu nên ai cũng đọc được sơ đồ nhanh chóng"],["Because symbols make the current stronger","Vì ký hiệu làm dòng điện mạnh hơn"]],a:1},
 {q:["How can you make a 3 V battery for a 3 V buzzer?","Làm sao tạo được pin 3 V (battery) cho một còi 3 V (buzzer)?"],o:[["Join two 1.5 V cells together","Nối hai pin đơn 1,5 V (cell) với nhau"],["Use one 1.5 V cell and a longer wire","Dùng một pin đơn 1,5 V và dây dài hơn"],["Shake one cell until it is stronger","Lắc một pin đơn tới khi nó mạnh hơn"]],a:0},
 {q:["Two lamps are connected first in series, then in parallel, on the same battery. When do they shine more brightly?","Hai đèn được mắc trước hết nối tiếp (series), rồi song song (parallel), với cùng một pin. Khi nào chúng sáng hơn?"],o:[["In series","Khi nối tiếp (series)"],["The brightness is exactly the same","Độ sáng hoàn toàn như nhau"],["In parallel","Khi song song (parallel)"]],a:2},
 {q:["One lamp is unscrewed from a series circuit with two lamps. What happens to the other lamp?","Một đèn bị tháo khỏi mạch nối tiếp (series) có hai đèn. Đèn còn lại thế nào?"],o:[["It shines more brightly","Nó sáng hơn"],["It goes out, because the only path for the current is broken","Nó tắt, vì đường đi duy nhất của dòng điện đã bị đứt"],["Nothing changes at all","Không có gì thay đổi cả"]],a:1}
],
"sci6-u6":[
 {q:["A ray arrives at a plane mirror at 35° from the normal. At what angle does the reflected ray leave?","Một tia sáng tới gương phẳng (plane mirror) ở 35° so với đường pháp tuyến (normal). Tia phản xạ (reflected ray) rời gương ở góc nào?"],o:[["55° from the normal","55° so với đường pháp tuyến (normal)"],["35° from the normal","35° so với đường pháp tuyến (normal)"],["90° from the normal","90° so với đường pháp tuyến (normal)"]],a:1},
 {q:["What do we call the reflection of your face that you see in a plane mirror?","Ảnh phản xạ của mặt con mà con thấy trong gương phẳng (plane mirror) được gọi là gì?"],o:[["A mirror image","Ảnh gương (mirror image)"],["A shadow","Một cái bóng (shadow)"],["A normal","Đường pháp tuyến (normal)"]],a:0},
 {q:["The normal is a line drawn…","Đường pháp tuyến (normal) là đường kẻ…"],o:[["Along the surface of the mirror","Dọc theo bề mặt gương"],["At 45° to the surface of the mirror","Ở 45° so với bề mặt gương"],["At right angles (90°) to the surface of the mirror","Vuông góc (90°) với bề mặt gương"]],a:2},
 {q:["In a periscope, the two plane mirrors are tilted at…","Trong kính tiềm vọng (periscope), hai gương phẳng (plane mirror) được nghiêng ở…"],o:[["90°","90°"],["45°","45°"],["10°","10°"]],a:1},
 {q:["Why does a pencil in a glass of water look bent?","Vì sao một cây bút chì trong cốc nước trông như bị cong?"],o:[["The water really bends the pencil","Nước thật sự làm cong bút chì"],["Light refracts as it passes from the water through the glass into the air, so it is an optical illusion","Ánh sáng khúc xạ (refracts) khi đi từ nước qua thủy tinh vào không khí, nên đó là ảo giác quang học (optical illusion)"],["The glass is a mirror","Thủy tinh là một chiếc gương"]],a:1},
 {q:["What happens to light rays inside a convex lens?","Điều gì xảy ra với các tia sáng bên trong một thấu kính lồi (convex lens)?"],o:[["They split into seven colours","Chúng tách thành bảy màu"],["They bounce straight back","Chúng bật thẳng trở lại"],["They bend inwards and converge at the focal point","Chúng bẻ cong vào trong và hội tụ (converge) tại tiêu điểm (focal point)"]],a:2},
 {q:["Why does a prism split white light into colours?","Vì sao một lăng kính (prism) tách ánh sáng trắng thành các màu?"],o:[["Each colour refracts at a different angle as the light passes through the prism","Mỗi màu khúc xạ (refracts) ở một góc khác nhau khi ánh sáng đi qua lăng kính (prism)"],["The prism is painted in seven colours","Lăng kính được sơn bảy màu"],["The colours were hiding behind the prism","Các màu đang trốn sau lăng kính"]],a:0},
 {q:["When can you see a rainbow?","Khi nào con nhìn thấy cầu vồng (rainbow)?"],o:[["At night, when it is dry","Vào ban đêm, khi trời khô"],["When the Sun shines behind you and rain falls in front of you — raindrops refract sunlight like tiny prisms","Khi Mặt trời chiếu ở phía sau con và mưa rơi ở phía trước con — giọt mưa khúc xạ (refracts) ánh sáng mặt trời như những lăng kính (prism) nhỏ xíu"],["Only by looking through a telescope","Chỉ khi nhìn qua kính viễn vọng"]],a:1},
 {q:["Which planet is fourth from the Sun?","Hành tinh nào đứng thứ tư tính từ Mặt Trời?"],o:[["Mercury","Sao Thủy (Mercury)"],["Mars","Sao Hỏa (Mars)"],["Jupiter","Sao Mộc (Jupiter)"]],a:1},
 {q:["How long does the Moon take to go through all of its phases?","Mặt Trăng mất bao lâu để đi qua hết các pha (phase) của nó?"],o:[["24 hours","24 giờ"],["365¼ days","365¼ ngày"],["29.5 days","29,5 ngày"]],a:2},
 {q:["In the book’s scale model, the Sun is a tennis ball. How far from the Sun do you place Neptune?","Trong mô hình tỉ lệ (scale model) của sách, Mặt Trời là một quả bóng tennis. Con đặt Sao Hải Vương (Neptune) cách Mặt Trời bao xa?"],o:[["250 m","250 m"],["25 m","25 m"],["7.5 m","7,5 m"]],a:0},
 {q:["When is the Moon waning?","Khi nào Mặt Trăng đang nhỏ dần (waning)?"],o:[["When the lit part we see grows bigger every night","Khi phần sáng ta thấy lớn hơn mỗi đêm"],["When the lit part we see gets smaller every night","Khi phần sáng ta thấy nhỏ hơn mỗi đêm"],["Only at new Moon","Chỉ vào trăng non (new Moon)"]],a:1}
],
"sci7-u1":[
 {q:["Which structure is found in plant cells but NOT in animal cells?","Cấu trúc nào có ở tế bào thực vật nhưng KHÔNG có ở tế bào động vật?"],o:[["A nucleus","Một nhân (nucleus)"],["A cell wall","Một thành tế bào (cell wall)"],["Cytoplasm","Tế bào chất (cytoplasm)"],["Mitochondria","Ti thể (mitochondria)"]],a:1},
 {q:["What does the nucleus of a cell do?","Nhân (nucleus) của tế bào làm gì?"],o:[["It controls the activities of the cell","Nó điều khiển các hoạt động của tế bào"],["It makes food for the cell","Nó tạo thức ăn cho tế bào"],["It holds the cell in shape","Nó giữ hình dạng cho tế bào"],["It releases energy from food","Nó giải phóng năng lượng từ thức ăn"]],a:0},
 {q:["Why do chloroplasts look green?","Vì sao lục lạp (chloroplast) có màu xanh?"],o:[["They are filled with cell sap","Chúng chứa đầy dịch tế bào (cell sap)"],["Their walls are made of cellulose","Thành của chúng làm bằng cellulose"],["They contain the green substance chlorophyll","Chúng chứa chất diệp lục (chlorophyll) màu xanh"]],a:2},
 {q:["Why do the cells from an onion bulb not look green?","Vì sao tế bào từ củ hành tây không có màu xanh?"],o:[["They are animal cells","Chúng là tế bào động vật"],["They grow underground in the dark and have no chloroplasts","Chúng mọc dưới đất trong bóng tối và không có lục lạp (chloroplast)"],["The microscope removes the colour","Kính hiển vi làm mất màu của chúng"]],a:1},
 {q:["Which of these can be found inside an animal cell?","Thứ nào sau đây có thể tìm thấy bên trong tế bào động vật?"],o:[["A cell wall","Một thành tế bào (cell wall)"],["A chloroplast","Một lục lạp (chloroplast)"],["A nucleus","Một nhân (nucleus)"],["A big sap vacuole","Một không bào chứa dịch (sap vacuole) lớn"]],a:2},
 {q:["Why do we add methylene blue when we look at cheek cells?","Vì sao ta thêm xanh methylene khi quan sát tế bào má?"],o:[["It stains the cells blue, so they are easier to see","Nó nhuộm tế bào thành màu xanh dương, nên chúng dễ nhìn thấy hơn"],["It feeds the cells so they stay alive","Nó nuôi tế bào để chúng sống"],["It magnifies the cells like a lens","Nó phóng đại tế bào như một thấu kính"],["It glues the cells to the slide","Nó dán tế bào vào lam kính"]],a:0},
 {q:["Zara looks through her microscope but cannot see any cells. What is a sensible thing to check?","Zara nhìn qua kính hiển vi nhưng không thấy tế bào nào. Điều gì là hợp lý để kiểm tra?"],o:[["Whether the biggest objective lens is being used","Xem vật kính lớn nhất có đang được dùng không"],["Whether the slide sits over the hole in the stage, then focus slowly","Xem lam kính có nằm trên lỗ của bàn kính (stage) không, rồi chỉnh nét từ từ"],["Whether the cells have been removed from the slide","Xem tế bào có bị lấy khỏi lam kính không"],["Whether the eyepiece is covered up","Xem thị kính (eyepiece) có bị che không"]],a:1},
 {q:["How would you change a model of a plant cell into a model of an animal cell?","Làm sao biến mô hình tế bào thực vật thành mô hình tế bào động vật?"],o:[["Add a cell wall around it","Thêm một thành tế bào (cell wall) quanh nó"],["Add lots of chloroplasts","Thêm nhiều lục lạp (chloroplast)"],["Add one very big sap vacuole","Thêm một không bào chứa dịch (sap vacuole) rất lớn"],["Take away the cell wall, the chloroplasts and the sap vacuole","Lấy đi thành tế bào, lục lạp và không bào chứa dịch"]],a:3},
 {q:["What does it mean to say a cell is specialised?","Nói một tế bào là chuyên hóa (specialised) nghĩa là gì?"],o:[["It is the biggest cell in the body","Nó là tế bào to nhất trong cơ thể"],["It has a structure that helps it carry out its own particular function really well","Nó có cấu tạo (structure) giúp nó thực hiện chức năng (function) riêng của mình thật tốt"],["It can turn into any other kind of cell","Nó có thể biến thành bất kỳ loại tế bào nào khác"]],a:1},
 {q:["Why does a red blood cell have no nucleus?","Vì sao hồng cầu (red blood cell) không có nhân (nucleus)?"],o:[["So it can move faster through the heart","Để nó đi nhanh hơn qua tim (heart)"],["So it can change shape like a jelly","Để nó thay đổi hình dạng như thạch"],["It leaves more space inside for haemoglobin, which carries oxygen","Nó để lại nhiều chỗ bên trong hơn cho haemoglobin (huyết sắc tố), chất mang khí ôxi (oxygen)"]],a:2},
 {q:["How do ciliated cells help to keep your lungs clean?","Tế bào có lông rung (ciliated cells) giúp giữ phổi (lungs) sạch thế nào?"],o:[["Their cilia sweep sticky mucus — with dust and bacteria trapped in it — up to the back of the mouth","Lông rung (cilia) của chúng quét chất nhầy (mucus) dính — với bụi và vi khuẩn bị giữ trong đó — lên phía sau miệng"],["They make oxygen for the lungs","Chúng tạo khí ôxi cho phổi"],["They grow over holes in the lung tubes","Chúng mọc phủ lên các lỗ trong ống dẫn tới phổi"]],a:0},
 {q:["Why do root hair cells NOT contain chloroplasts?","Vì sao tế bào lông hút (root hair cells) KHÔNG chứa lục lạp (chloroplasts)?"],o:[["Chloroplasts would block water from entering","Lục lạp sẽ chặn nước đi vào"],["They grow underground in dark soil, and their function is absorbing water, not making food","Chúng mọc dưới đất tối, và chức năng (function) của chúng là hấp thụ (absorb) nước, không phải tạo thức ăn"],["They are animal cells, not plant cells","Chúng là tế bào động vật, không phải tế bào thực vật"]],a:1},
 {q:["What is a tissue?","Mô (tissue) là gì?"],o:[["One single cell on its own","Một tế bào đơn lẻ"],["A group of similar cells working together","Một nhóm tế bào giống nhau cùng làm việc"],["A set of organs working together","Một tập hợp cơ quan cùng làm việc"]],a:1},
 {q:["Which of these is an organ system?","Cái nào sau đây là một hệ cơ quan (organ system)?"],o:[["The digestive system","Hệ tiêu hóa (digestive system)"],["The heart","Tim (heart)"],["Onion epidermis","Biểu bì hành (onion epidermis)"]],a:0},
 {q:["Where is the palisade layer found, and what happens there?","Lớp mô giậu (palisade layer) nằm ở đâu, và ở đó diễn ra việc gì?"],o:[["In the roots — it absorbs water","Ở rễ — nó hấp thụ nước"],["In the blood — it carries oxygen","Trong máu — nó vận chuyển oxy"],["In a leaf — its cells carry out photosynthesis","Trong lá (leaf) — tế bào của nó thực hiện quang hợp (photosynthesis)"]],a:2},
 {q:["What does ciliated epithelium do?","Biểu mô có lông rung (ciliated epithelium) làm gì?"],o:[["It makes food by photosynthesis","Nó tạo thức ăn bằng quang hợp"],["Its cilia wave together and move mucus along the tubes to the lungs","Các lông rung (cilia) của nó đung đưa cùng nhau và đẩy chất nhầy (mucus) dọc các ống dẫn tới phổi (lungs)"],["It absorbs water from the soil","Nó hấp thụ nước từ đất"]],a:1}
],
"sci7-u2":[
 {q:["Into which three states do scientists sort matter?","Các nhà khoa học phân vật chất (matter) thành ba trạng thái nào?"],o:[["Only solids and liquids","Chỉ chất rắn và chất lỏng"],["Solids, liquids and gases","Chất rắn, chất lỏng và chất khí"],["Solids and gases only","Chỉ chất rắn và chất khí"]],a:1},
 {q:["Which state of matter can be compressed (squashed) easily?","Trạng thái vật chất nào dễ bị nén (compressed) nhất?"],o:[["A gas","Chất khí (gas)"],["A solid","Chất rắn (solid)"],["A liquid","Chất lỏng (liquid)"]],a:0},
 {q:["How are the particles arranged in a solid?","Các hạt (particles) trong chất rắn được sắp xếp thế nào?"],o:[["Far apart, moving about freely","Xa nhau, chuyển động tự do"],["Touching, sliding past each other","Chạm nhau, trượt qua nhau"],["In a fixed pattern, vibrating in place","Theo trật tự cố định, rung tại chỗ (vibrate)"]],a:2},
 {q:["Why can a liquid flow and be poured?","Vì sao chất lỏng chảy (flow) và rót (pour) được?"],o:[["Its particles are a long way apart","Các hạt của nó ở rất xa nhau"],["Its particles can move past each other","Các hạt của nó trượt qua nhau được"],["Its particles never move at all","Các hạt của nó không bao giờ chuyển động"]],a:1},
 {q:["When ice is warmed and turns into liquid water, the change is called…","Khi nước đá được làm ấm và đổi thành nước lỏng, sự thay đổi đó gọi là…"],o:[["freezing","đông đặc (freezing)"],["melting","nóng chảy (melting)"],["condensing","ngưng tụ (condensing)"]],a:1},
 {q:["How do you read the volume of water in a measuring cylinder?","Ta đọc thể tích (volume) của nước trong ống đong (measuring cylinder) thế nào?"],o:[["From the top of the meniscus, looking down from above","Từ đỉnh của mặt khum (meniscus), nhìn xuống từ trên cao"],["From the side, without looking at the scale","Từ bên cạnh, không nhìn thang đo"],["From the bottom of the meniscus, with your eye level with it","Từ đáy của mặt khum (meniscus), với mắt ngang tầm với nó"]],a:2},
 {q:["Water is boiling at 100 °C and you keep heating it. What happens to its temperature?","Nước đang sôi ở 100 °C và ta cứ đun tiếp. Nhiệt độ của nó sẽ thế nào?"],o:[["It stays at 100 °C","Nó giữ nguyên ở 100 °C"],["It rises to 120 °C","Nó tăng lên 120 °C"],["It falls back to 20 °C","Nó giảm xuống 20 °C"]],a:0},
 {q:["Steam from a shower touches a cold mirror and turns into drops of water. This change is called…","Hơi nước nóng (steam) từ vòi sen chạm vào gương lạnh và đổi thành giọt nước. Sự thay đổi đó gọi là…"],o:[["evaporation","bay hơi (evaporation)"],["condensation","ngưng tụ (condensation)"],["melting","nóng chảy (melting)"]],a:1},
 {q:["Why does a solid expand when it is heated?","Vì sao một chất rắn giãn nở (expand) khi được đun nóng?"],o:[["New particles are added to the solid","Các hạt mới được thêm vào chất rắn"],["Its particles vibrate more and take up more space","Các hạt của nó rung (vibrate) nhiều hơn và chiếm nhiều không gian hơn"],["Its particles stop moving completely","Các hạt của nó ngừng chuyển động hoàn toàn"]],a:1},
 {q:["How does a liquid change into a gas when it is heated?","Một chất lỏng biến thành chất khí thế nào khi được đun nóng?"],o:[["Its particles slow down and settle into rows","Các hạt của nó chậm lại và lắng thành hàng"],["Its particles join together into one big particle","Các hạt của nó hợp lại thành một hạt lớn"],["Some particles gain enough energy to break the weak attractive forces and escape, moving freely","Một số hạt nhận đủ năng lượng để phá vỡ lực hút (attractive force) yếu và thoát ra, chuyển động tự do"]],a:2},

 {q:["Why is a car NOT alive, even though it moves, uses fuel and has sensors?","Vì sao ô tô KHÔNG sống, dù nó di chuyển, dùng nhiên liệu và có cảm biến?"],o:[["It moves too fast","Nó di chuyển quá nhanh"],["It cannot grow or reproduce","Nó không thể lớn lên (grow) hay sinh sản (reproduce)"],["It has wheels","Nó có bánh xe"]],a:1},
 {q:["What is a virus made of?","Một virus được cấu tạo từ những gì?"],o:[["One single cell","Một tế bào duy nhất"],["A protein coat with RNA threads inside","Một lớp vỏ protein (protein) với các sợi RNA (RNA) bên trong"],["Many cells joined together","Nhiều tế bào nối với nhau"],["A nucleus and cytoplasm only","Chỉ một nhân và chất tế bào"]],a:1},
 {q:["Why do you need an electron microscope to see a virus?","Vì sao con cần kính hiển vi điện tử (electron microscope) để thấy một virus?"],o:[["A virus only comes out at night","Virus chỉ xuất hiện vào ban đêm"],["A virus is alive only under that microscope","Virus chỉ sống dưới kính hiển vi đó"],["A virus is far too small for a school microscope","Virus quá nhỏ so với kính hiển vi ở trường"]],a:2},
 {q:["How does a virus replicate?","Một virus nhân lên (replicate) bằng cách nào?"],o:[["It gets inside a living cell, which is forced to copy its RNA and make many new viruses","Nó chui vào một tế bào sống, tế bào này bị buộc phải sao chép RNA (RNA) của nó và tạo ra nhiều virus mới"],["It feeds and grows bigger, then splits in two","Nó ăn và lớn lên, rồi tách làm hai"],["It respires to make energy for dividing","Nó hô hấp để tạo năng lượng cho việc phân chia"]],a:0},
 {q:["Which statement gives the best evidence-based answer to “Are viruses living?”","Câu nào đưa ra câu trả lời dựa trên bằng chứng tốt nhất cho câu hỏi “Virus có sống không?”"],o:[["Yes — because they can move and feed","Có — vì chúng có thể di chuyển và ăn"],["Many scientists say no: they are not made of cells, and they show only one characteristic of living things — replication — and only inside a living cell","Nhiều nhà khoa học nói không: chúng không được cấu tạo từ tế bào và chỉ thể hiện một đặc trưng của sự sống — nhân lên (replication) — khi ở trong một tế bào sống"],["Yes — because they are made of many cells","Có — vì chúng được cấu tạo từ nhiều tế bào"]],a:1},
 {q:["What is a species?","Loài (species) là gì?"],o:[["A group of organisms that look identical","Một nhóm sinh vật trông giống hệt nhau"],["A group of organisms that can reproduce together to produce fertile offspring","Một nhóm sinh vật có thể sinh sản với nhau để tạo ra con hữu thụ (fertile)"],["A group of organisms that live in the same zoo","Một nhóm sinh vật sống trong cùng một vườn thú"]],a:1},
 {q:["Lions and tigers can sometimes reproduce together in a zoo. Why are they still different species?","Sư tử và hổ đôi khi sinh sản được với nhau trong vườn thú. Vì sao chúng vẫn là các loài khác nhau?"],o:[["Their offspring, the liger, is infertile","Đời con của chúng, liger, vô sinh (infertile)"],["Lions and tigers never meet in a zoo","Sư tử và hổ không bao giờ gặp nhau trong vườn thú"],["Tigers have stripes and lions do not","Hổ có vằn còn sư tử thì không"]],a:0},
 {q:["Two organisms look very similar. How can a scientist be SURE they belong to the same species?","Hai sinh vật trông rất giống nhau. Làm sao nhà khoa học CHẮC CHẮN chúng thuộc cùng một loài?"],o:[["Look at them very carefully once","Quan sát chúng thật kỹ một lần"],["Measure how tall they are","Đo chiều cao của chúng"],["Find out if they can reproduce together and produce fertile offspring","Tìm hiểu xem chúng có thể sinh sản với nhau và tạo ra con hữu thụ (fertile) không"]],a:2},
 {q:["What does variation mean in a species?","Sự biến dị (variation) trong một loài nghĩa là gì?"],o:[["Every member is identical to the others","Mọi thành viên đều giống hệt (identical) nhau"],["Members share the same characteristics but are not identical","Các thành viên có cùng đặc điểm nhưng không giống hệt nhau"],["The species keeps changing into a new species","Loài liên tục biến thành một loài mới"]],a:1},
 {q:["Why is this kind of key called a dichotomous key?","Vì sao loại khóa này được gọi là khóa phân đôi (dichotomous key)?"],o:[["It is written on two pages","Nó được viết trên hai trang"],["Every question branches into two answers","Mỗi câu hỏi rẽ thành hai đáp án (branches into two)"],["It names exactly two organisms","Nó gọi tên đúng hai sinh vật"],["It only asks two questions","Nó chỉ hỏi hai câu hỏi"]],a:1},
 {q:["Using the paired-statement key, which steps do you go through to identify the earthworm?","Dùng khóa kiểu cặp phát biểu, con đi qua những bước nào để nhận biết giun đất?"],o:[["1b, then 3a","1b, rồi 3a"],["1a, then 2a","1a, rồi 2a"],["1b, then 3b","1b, rồi 3b"]],a:0},
 {q:["In the branching key, an animal answers: legs YES, more than six legs NO, four wings YES. What is it?","Trong khóa rẽ nhánh, một con vật trả lời: có chân CÓ, hơn sáu chân KHÔNG, bốn cánh CÓ. Nó là con gì?"],o:[["Housefly","Ruồi nhà (housefly)"],["Crab","Cua (crab)"],["Dragonfly","Chuồn chuồn (dragonfly)"]],a:2},
 {q:["A fish has NO stripes, and its fins have spines. Using the fish key, what is it?","Một con cá KHÔNG có sọc, và vây của nó có gai. Dùng khóa cá, nó là cá gì?"],o:[["Zebra fish","Cá ngựa vằn (zebra fish)"],["Clown fish","Cá hề (clown fish)"],["Horn shark","Cá mập sừng (horn shark)"],["Dragon fish","Cá rồng (dragon fish)"]],a:3},
 {q:["Which question is NOT good in a key?","Câu hỏi nào KHÔNG tốt trong một khóa phân loại (key)?"],o:[["Does the animal have stripes?","Con vật có sọc (stripes) không?"],["Is the animal tall?","Con vật có cao (tall) không?"],["Does the learner wear glasses?","Học viên có đeo kính (glasses) không?"]],a:1},
 {q:["What is the FIRST step in constructing a key?","Bước ĐẦU TIÊN khi xây dựng một khóa phân loại (key) là gì?"],o:[["Split the whole group into two smaller groups","Chia cả nhóm thành hai nhóm nhỏ hơn"],["Name every organism at once","Đặt tên mọi sinh vật cùng một lúc"],["Write the conclusion first","Viết kết luận trước"]],a:0},
 {q:["A key identifies four learners. What is the MOST pairs of statements it should need?","Một khóa nhận biết bốn học viên. Nó cần TỐI ĐA bao nhiêu cặp mệnh đề (pairs of statements)?"],o:[["Two pairs","Hai cặp"],["Three pairs","Ba cặp"],["Six pairs","Sáu cặp"]],a:1},
 {q:["A partner tests your key and says one step is hard to choose between. What should you do?","Một bạn thử khóa của con và nói có một bước rất khó lựa chọn. Con nên làm gì?"],o:[["Keep the key exactly the same","Giữ nguyên khóa"],["Remove that organism from the key","Bỏ sinh vật đó khỏi khóa"],["Rewrite that step more clearly, then test the key again","Viết lại bước đó rõ ràng hơn, rồi thử lại khóa"]],a:2}
],
"sci7-u5":[
 {q:["Which set of properties describes most metals?","Nhóm tính chất nào mô tả đúng hầu hết kim loại?"],o:[["Dull, brittle and poor conductors","Xỉn, giòn (brittle) và dẫn điện kém"],["Shiny, strong, and good conductors of heat and electricity","Bóng (shiny), bền, và dẫn nhiệt, dẫn điện tốt"],["Soft gases with low melting points","Chất khí mềm với nhiệt độ nóng chảy thấp"]],a:1},
 {q:["What does the word ductile mean?","Từ ductile (dễ kéo sợi) nghĩa là gì?"],o:[["It makes a ringing sound when hit","Nó phát ra tiếng kêu vang khi bị gõ"],["It is attracted to a magnet","Nó bị nam châm hút"],["It can be drawn out into wires","Nó có thể được kéo thành sợi dây"]],a:2},
 {q:["Which statement describes most non-metals?","Câu nào mô tả đúng hầu hết phi kim?"],o:[["They look dull, solid ones are brittle, and most do not conduct electricity","Chúng trông xỉn, các chất rắn thì giòn (brittle), và hầu hết không dẫn điện"],["They are shiny and ring like bells","Chúng bóng (shiny) và kêu vang như chuông"],["They can all be hammered into shape","Tất cả chúng đều có thể rèn thành hình"]],a:0},
 {q:["Why is copper used for electrical wiring?","Vì sao đồng được dùng làm dây điện?"],o:[["Because it is brittle, so it snaps into lengths","Vì nó giòn (brittle), nên bẻ gãy thành từng đoạn được"],["Because it conducts electricity well and is ductile and flexible","Vì nó dẫn điện (conduct) tốt và dễ kéo sợi (ductile), dẻo"],["Because it is magnetic","Vì nó có từ tính (magnetic)"]],a:1},
 {q:["A material is dull, brittle and does not conduct electricity. Is it a metal or a non-metal?","Một vật liệu xỉn màu, giòn (brittle) và không dẫn điện. Nó là kim loại hay phi kim?"],o:[["A metal","Kim loại"],["A non-metal","Phi kim"],["Mercury","Thủy ngân (mercury)"]],a:1},
 {q:["Mercury is a metal. What unusual property does it have?","Thủy ngân (mercury) là một kim loại. Nó có tính chất khác thường nào?"],o:[["It is a liquid at room temperature","Nó ở thể lỏng ở nhiệt độ phòng"],["It is brittle","Nó giòn (brittle)"],["It does not conduct electricity","Nó không dẫn điện"]],a:0},
 {q:["A black, dull, brittle solid conducts electricity well. Which material could it be — and what group is it in?","Một chất rắn màu đen, xỉn màu, giòn lại dẫn điện tốt. Nó có thể là chất nào — và thuộc nhóm nào?"],o:[["Copper — a metal","Đồng (copper) — một kim loại"],["Sulfur — a non-metal","Lưu huỳnh (sulfur) — một phi kim"],["Carbon (graphite) — a non-metal","Carbon (graphite) — một phi kim"]],a:2},
 {q:["Which two things can a metal do better than a non-metal?","Hai việc nào kim loại làm tốt hơn phi kim?"],o:[["Be a gas and shatter easily","Ở thể khí và dễ vỡ vụn"],["Conduct heat and conduct electricity","Dẫn nhiệt và dẫn điện"],["Be dull and be brittle","Xỉn màu và giòn"]],a:1},
 {q:["What is an alloy?","Hợp kim (alloy) là gì?"],o:[["A single pure metal, melted on its own","Một kim loại nguyên chất duy nhất, được nấu chảy riêng"],["A metal mixture — different metals (sometimes with a non-metal) melted and mixed together, their atoms mixed but not bonded","Một hỗn hợp kim loại — các kim loại khác nhau (đôi khi cùng một phi kim) được nấu chảy và trộn với nhau, các nguyên tử trộn lẫn nhưng không liên kết"],["A compound whose atoms are bonded together","Một hợp chất (compound) mà các nguyên tử liên kết với nhau"]],a:1},
 {q:["Which pair of metals is mixed to make bronze?","Cặp kim loại nào được trộn để tạo bronze?"],o:[["Copper and tin","Đồng (copper) và thiếc (tin)"],["Copper and zinc","Đồng (copper) và kẽm (zinc)"],["Iron and carbon","Sắt (iron) và cacbon (carbon)"]],a:0},
 {q:["Why is an alloy usually harder than the pure metal it is made from?","Vì sao một hợp kim (alloy) thường cứng hơn kim loại nguyên chất tạo thành nó?"],o:[["Its atoms are all the same size, so the layers slide more easily","Các nguyên tử của nó đều cùng kích thước nên các lớp trượt dễ hơn"],["It is always melted at a higher temperature","Nó luôn được nấu chảy ở nhiệt độ cao hơn"],["Atoms of a different size disrupt the regular rows, so the layers cannot slide past one another easily","Các nguyên tử khác kích thước phá vỡ (disrupt) các hàng đều đặn, nên các lớp không thể trượt qua nhau dễ dàng"]],a:2},
 {q:["The melting point of brass is given as a range (900–1000 °C), but copper has one melting point (1085 °C). Why the difference?","Nhiệt độ nóng chảy của đồng thau (brass) được cho là một khoảng (900–1000 °C), nhưng đồng (copper) có một nhiệt độ nóng chảy duy nhất (1085 °C). Vì sao khác nhau?"],o:[["Brass thermometers are less accurate","Nhiệt kế đo đồng thau kém chính xác hơn"],["There are many different brasses, made with different proportions of copper and zinc, so there is no single melting point","Có nhiều loại đồng thau khác nhau, được làm với các tỉ lệ đồng và kẽm (zinc) khác nhau, nên không có một nhiệt độ nóng chảy duy nhất"],["Copper is not really a metal","Đồng thực ra không phải kim loại"]],a:1},
 {q:["When sandy, salty water is filtered, why does the sand stay on the filter paper?","Khi nước cát và muối được lọc, vì sao cát ở lại trên giấy lọc (filter paper)?"],o:[["The sand has dissolved in the water","Cát đã hòa tan trong nước"],["Sand does not dissolve, and its grains are too big to pass through the paper","Cát không hòa tan, và hạt cát quá lớn nên không lọt qua giấy được"],["The paper attracts the sand like a magnet","Giấy hút cát như nam châm"]],a:1},
 {q:["In a condenser, how does steam change back into liquid water?","Trong ống sinh hàn (condenser), hơi nước biến lại thành nước lỏng bằng cách nào?"],o:[["Cold water flowing round the outside of the tube cools the steam, so it condenses","Nước lạnh chảy quanh bên ngoài ống làm hơi nước nguội đi, nên nó ngưng tụ (condenses)"],["The steam is filtered through filter paper","Hơi nước được lọc qua giấy lọc (filter paper)"],["The steam is stirred until it becomes liquid","Hơi nước được khuấy cho tới khi thành chất lỏng"]],a:0},
 {q:["Powdered carbon and salt are mixed. Which property lets you separate them by adding water?","Bột carbon (carbon) và muối được trộn với nhau. Tính chất nào cho phép con tách chúng bằng cách thêm nước?"],o:[["Carbon is magnetic and salt is not","Carbon có từ tính còn muối thì không"],["Salt and carbon have different colours","Muối và carbon có màu khác nhau"],["Salt dissolves in water; carbon does not dissolve","Muối hòa tan trong nước; carbon không hòa tan"]],a:2},
 {q:["After filtering sandy, salty water, how could you also collect the WATER from the clear salty liquid?","Sau khi lọc nước cát và muối, làm sao con cũng thu được NƯỚC từ chất lỏng muối trong?"],o:[["Just evaporate it in a dish — the water collects there","Chỉ cần cho nó bay hơi trong đĩa — nước sẽ tụ ở đó"],["Heat it and pass the steam through a condenser, so the steam condenses into a beaker","Đun nó và cho hơi nước đi qua ống sinh hàn (condenser), để hơi ngưng tụ vào một cốc"],["Filter it a second time through dry paper","Lọc nó lần thứ hai qua giấy khô"]],a:1},
 {q:["Lemons and limes taste sour. Which acid do they contain?","Chanh và chanh xanh có vị chua. Chúng chứa axit nào?"],o:[["Citric acid","Axit citric (citric acid)"],["Hydrochloric acid","Axit hydrochloric (hydrochloric acid)"],["Nitric acid","Axit nitric (nitric acid)"],["Sulfuric acid","Axit sulfuric (sulfuric acid)"]],a:0},
 {q:["What does CORROSIVE mean?","ĂN MÒN (CORROSIVE) có nghĩa là gì?"],o:[["It can catch fire easily","Nó có thể bắt lửa dễ dàng"],["It can poison you","Nó có thể làm con trúng độc"],["It can destroy living tissue and cause burns","Nó có thể phá hủy mô sống và gây bỏng"]],a:2},
 {q:["You spill some acid on the bench. What should you do?","Con làm đổ một ít axit lên bàn. Con nên làm gì?"],o:[["Wipe it up with your sleeve","Lau bằng tay áo của con"],["Wash the area with lots of water","Rửa khu vực đó bằng nhiều nước"],["Leave it for someone else","Để đó cho người khác"]],a:1},
 {q:["Which statement about alkalis is TRUE?","Phát biểu nào về kiềm (alkalis) là ĐÚNG?"],o:[["Alkalis are always safe to touch","Kiềm luôn an toàn khi chạm vào"],["Soap contains a strong acid","Xà phòng chứa một axit mạnh"],["Acids and alkalis are opposites that cancel each other out","Axit và kiềm là hai đối tác đối ngược, triệt tiêu lẫn nhau (cancel each other out)"],["Sodium hydroxide is a weak laboratory acid","Sodium hydroxide là một axit yếu trong phòng thí nghiệm"]],a:2},
 {q:["Red cabbage juice is added to lemon juice. What colour does it turn?","Người ta cho nước bắp cải tím vào nước chanh. Nó chuyển sang màu gì?"],o:[["Yellow","Vàng"],["Red","Đỏ"],["Blue","Xanh dương"],["Green","Xanh lá"]],a:1},
 {q:["What is the pH of a neutral solution?","Dung dịch trung tính (neutral) có pH bằng bao nhiêu?"],o:[["pH 1","pH 1"],["pH 4","pH 4"],["pH 7","pH 7"]],a:2},
 {q:["What colour does litmus turn in sodium hydroxide?","Quỳ (litmus) chuyển sang màu gì trong sodium hydroxide?"],o:[["Blue","Xanh dương"],["Red","Đỏ"],["Purple","Tím"]],a:0},
 {q:["Why is universal indicator more useful than litmus?","Vì sao chất chỉ thị vạn năng (universal indicator) hữu ích hơn quỳ (litmus)?"],o:[["It smells stronger","Nó có mùi nồng hơn"],["It shows how acidic or alkaline a substance is, as a pH","Nó cho thấy một chất có tính axit hay kiềm đến mức nào, theo pH"],["It only works in water","Nó chỉ hoạt động trong nước"]],a:1}

"sci7-u6":[
 {q:["Zara plucks a guitar string. What must happen for the guitar to make a sound?","Zara gảy một dây đàn ghi-ta. Điều gì phải xảy ra để đàn phát ra âm thanh?"],o:[["The guitar must be made of wood","Đàn phải làm bằng gỗ"],["The string must vibrate","Dây đàn phải dao động (vibrate)"],["There must be air inside the guitar","Bên trong đàn phải có không khí"],["The guitar must have metal parts","Đàn phải có các bộ phận bằng kim loại"]],a:1},
 {q:["Sofia hears the television across the room. In which direction do the air particles between the TV and Sofia vibrate?","Sofia nghe thấy ti-vi ở phía bên kia phòng. Các hạt không khí giữa ti-vi và Sofia dao động theo hướng nào?"],o:[["Round in circles","Xoay tròn thành vòng"],["Only upwards","Chỉ hướng lên trên"],["Backwards and forwards, along the direction the sound travels","Qua lại (backwards and forwards), dọc theo hướng âm thanh truyền"]],a:2},
 {q:["Which of these can sound travel through?","Âm thanh có thể truyền qua những thứ nào sau đây?"],o:[["Solids, liquids and gases","Chất rắn, chất lỏng và chất khí"],["Only gases","Chỉ chất khí"],["Only solids","Chỉ chất rắn"],["Solids, liquids, gases and vacuums","Chất rắn, chất lỏng, chất khí và chân không"]],a:0},
 {q:["An electric bell is ringing inside a glass jar. The air is pumped out to make a vacuum. What do you notice?","Một chiếc chuông điện đang kêu bên trong một bình thủy tinh. Người ta hút hết không khí ra để tạo chân không (vacuum). Con nhận thấy điều gì?"],o:[["The bell sounds louder","Chuông kêu to hơn"],["The bell stops vibrating","Chuông ngừng dao động"],["You can see the bell vibrating but hear nothing","Con nhìn thấy chuông dao động nhưng không nghe thấy gì"]],a:2},
 {q:["Which statement describes what happens to a sound to make an echo?","Câu nào mô tả điều xảy ra với một âm thanh để tạo thành tiếng vọng (echo)?"],o:[["The pitch of the sound increases","Cao độ (pitch) của âm thanh tăng lên"],["The pitch of the sound decreases","Cao độ của âm thanh giảm xuống"],["The sound gets reflected","Âm thanh bị phản xạ (reflected)"],["The sound gets louder","Âm thanh trở nên to hơn"]],a:2},
 {q:["Which one of these will give the best echo in a room? (All have the same area.)","Vật nào sau đây sẽ cho tiếng vọng tốt nhất trong một căn phòng? (Tất cả có cùng diện tích.)"],o:[["Soft curtains","Rèm mềm (soft curtains)"],["A glass window","Một cửa sổ kính (glass window)"],["A thick carpet","Một tấm thảm dày (thick carpet)"],["A wool blanket","Một tấm chăn len (wool blanket)"]],a:1},
 {q:["Zara practises her drums in an empty room. Which material on the walls would stop the echoes?","Zara tập trống trong một căn phòng trống. Vật liệu nào trên tường sẽ chặn được tiếng vọng?"],o:[["Flat wood sheets","Tấm gỗ phẳng (flat wood sheets)"],["Shiny metal sheets","Tấm kim loại bóng (shiny metal sheets)"],["Soft thick curtains","Rèm dày mềm (soft thick curtains)"],["Large flat mirrors","Gương lớn phẳng (large flat mirrors)"]],a:2},
 {q:["A bat is 3 metres from an insect. Its sound goes to the insect and back as an echo. How far does the sound travel altogether?","Một con dơi cách một con côn trùng 3 mét. Âm thanh của nó đi tới con côn trùng và quay lại thành tiếng vọng. Tổng cộng âm thanh đi bao xa?"],o:[["6 metres — the distance there and back","6 mét — quãng đường đi và về"],["3 metres — just the distance to the insect","3 mét — chỉ khoảng cách tới con côn trùng"],["1.5 metres — half the distance","1,5 mét — một nửa khoảng cách"]],a:0},
 {q:["Which part of the Earth forms the centre?","Phần nào của Trái Đất tạo thành trung tâm?"],o:[["The crust","Vỏ (crust)"],["The mantle","Lớp phủ (mantle)"],["The core","Lõi (core)"],["The magma","Magma"]],a:2},
 {q:["What is the mantle made of?","Lớp phủ (mantle) được làm từ gì?"],o:[["Molten rock that can flow","Đá nóng chảy (molten) có thể chảy"],["Solid iron and nickel","Sắt và niken rắn"],["Cold sea water","Nước biển lạnh"],["Solid rock only at the surface","Chỉ đá rắn ở bề mặt"]],a:0},
 {q:["Which of these was evidence for continental drift?","Điều nào sau đây là bằng chứng cho sự trôi dạt lục địa (continental drift)?"],o:[["The Moon moves away from the Earth","Mặt Trăng di chuyển xa Trái Đất"],["The shapes of the continents fit together","Hình dạng các lục địa khớp nhau"],["Mountains get taller every year","Núi cao lên mỗi năm"],["The oceans are getting deeper","Các đại dương ngày càng sâu"]],a:1},

 {q:["Which statement is true about tectonic plates?","Phát biểu nào đúng về các mảng kiến tạo (tectonic plates)?"],o:[["They never move","Chúng không bao giờ chuyển động"],["They move in different ways","Chúng chuyển động theo nhiều cách khác nhau"],["They always move towards each other","Chúng luôn chuyển động lại gần nhau"],["They always move away from each other","Chúng luôn chuyển động tách xa nhau"]],a:1},
 {q:["How do fold mountains form?","Núi uốn nếp (fold mountains) hình thành như thế nào?"],o:[["Lava piles up layer by layer","Dung nham (lava) chất đống lớp này lên lớp khác"],["Rocks melt and then freeze flat","Đá tan chảy rồi đông lại thành phẳng"],["Plates push together and the rocks crumple and fold upwards","Các mảng đẩy vào nhau và đá nhàu lại, uốn vồng lên"]],a:2},
 {q:["Which word is used to describe the strength of an earthquake?","Từ nào được dùng để mô tả sức mạnh của một trận động đất (earthquake)?"],o:[["Magnitude","Độ lớn (magnitude)"],["Force","Lực (force)"],["Destruction","Sự phá hủy (destruction)"]],a:0},
 {q:["Liquid rock underground is called magma. What is it called when it reaches the surface?","Đá lỏng dưới lòng đất được gọi là magma (magma). Khi nó lên tới mặt đất, nó được gọi là gì?"],o:[["Ash","Tro (ash)"],["Lava","Dung nham (lava)"],["Crust","Lớp vỏ (crust)"]],a:1},
 {q:["Which of these describes how a solar eclipse happens?","Câu nào mô tả đúng cách nhật thực (solar eclipse) xảy ra?"],o:[["The Sun comes between the Moon and the Earth","Mặt Trời (Sun) đi vào giữa Mặt Trăng (Moon) và Trái Đất (Earth)"],["The Earth comes between the Moon and the Sun","Trái Đất (Earth) đi vào giữa Mặt Trăng (Moon) và Mặt Trời (Sun)"],["The Moon comes between the Earth and the Sun","Mặt Trăng (Moon) đi vào giữa Trái Đất (Earth) và Mặt Trời (Sun)"]],a:2},
 {q:["Which of these describes how a lunar eclipse happens?","Câu nào mô tả đúng cách nguyệt thực (lunar eclipse) xảy ra?"],o:[["The Earth comes between the Moon and the Sun","Trái Đất (Earth) đi vào giữa Mặt Trăng (Moon) và Mặt Trời (Sun)"],["The Moon comes between the Earth and the Sun","Mặt Trăng (Moon) đi vào giữa Trái Đất (Earth) và Mặt Trời (Sun)"],["The Sun comes between the Moon and the Earth","Mặt Trời (Sun) đi vào giữa Mặt Trăng (Moon) và Trái Đất (Earth)"]],a:0},
 {q:["People standing in the middle of the shadow of the Moon see…","Người đứng ở giữa bóng (shadow) của Mặt Trăng nhìn thấy…"],o:[["a partial solar eclipse","nhật thực một phần (partial solar eclipse)"],["a total solar eclipse","nhật thực toàn phần (total solar eclipse)"],["a lunar eclipse","nguyệt thực (lunar eclipse)"]],a:1},
 {q:["Why do eclipses not happen every month, even though the Moon takes about 28 days to orbit the Earth?","Vì sao nhật thực / nguyệt thực không xảy ra mỗi tháng, dù Mặt Trăng chỉ mất khoảng 28 ngày để quay quanh Trái Đất?"],o:[["The Moon gives out its own light in some months","Mặt Trăng tự phát sáng trong một số tháng"],["The shadow of the Earth is too small in some months","Bóng (shadow) của Trái Đất quá nhỏ trong một số tháng"],["The orbit of the Moon is tilted, so the Sun, Earth and Moon only sometimes form a straight line","Quỹ đạo (orbit) của Mặt Trăng bị nghiêng, nên Mặt Trời, Trái Đất và Mặt Trăng chỉ thỉnh thoảng mới tạo thành một đường thẳng"]],a:2}

"sci7-u7":[
 {q:["What is a microorganism?","Vi sinh vật (microorganism) là gì?"],o:[["Any living thing that lives in water","Bất kỳ sinh vật sống nào sống trong nước"],["A living organism so small it can only be seen clearly with a microscope","Một sinh vật sống nhỏ đến mức chỉ nhìn rõ được bằng kính hiển vi (microscope)"],["A kind of jelly used in laboratories","Một loại thạch dùng trong phòng thí nghiệm"]],a:1},
 {q:["Viruses are even smaller than bacteria. Why are they not usually said to be microorganisms?","Virus còn nhỏ hơn vi khuẩn (bacteria). Vì sao chúng thường không được gọi là vi sinh vật (microorganisms)?"],o:[["They are not living organisms","Chúng không phải là sinh vật sống"],["They are too big to fit in a Petri dish","Chúng quá lớn để vừa đĩa Petri (Petri dish)"],["They only live in pond water","Chúng chỉ sống trong nước ao"]],a:0},
 {q:["What is a colony of microorganisms?","Khuẩn lạc (colony) của vi sinh vật là gì?"],o:[["One single cell on its own","Một tế bào đơn độc riêng lẻ"],["A drop of agar jelly","Một giọt thạch agar (agar jelly)"],["A collection of many cells grown when one cell divides again and again","Một tập hợp nhiều tế bào mọc lên khi một tế bào phân chia lặp đi lặp lại"]],a:2},
 {q:["Which microorganism in pond water is plant-like, with cells like plant cells?","Vi sinh vật nào trong nước ao giống cây (plant-like), với tế bào giống tế bào cây?"],o:[["A protozoan","Một động vật nguyên sinh (protozoan)"],["An alga","Một tảo (alga)"],["Yeast","Nấm men (yeast)"]],a:1},
 {q:["In a food chain, what do the arrows show?","Trong chuỗi thức ăn (food chain), các mũi tên cho thấy điều gì?"],o:[["Which animal is biggest","Con vật nào to nhất"],["How energy is transferred from one organism to the next","Năng lượng được truyền từ sinh vật này sang sinh vật tiếp theo như thế nào"],["Which way the animals walk","Các con vật đi về hướng nào"]],a:1},
 {q:["Which organism is a producer?","Sinh vật nào là sinh vật sản xuất (producer)?"],o:[["A deer","Một con hươu"],["A tiger","Một con hổ"],["An acacia tree","Một cây keo (acacia)"]],a:2},
 {q:["A springbok eats only plants. A springbok is a…","Springbok chỉ ăn cây. Springbok là…"],o:[["herbivore","động vật ăn cỏ (herbivore)"],["carnivore","động vật ăn thịt (carnivore)"],["producer","sinh vật sản xuất (producer)"]],a:0},
 {q:["A leopard catches and eats a deer. Which pairing is correct?","Báo hoa mai bắt và ăn một con hươu. Cặp nào đúng?"],o:[["Leopard = prey, deer = predator","Báo = con mồi (prey), hươu = kẻ săn mồi (predator)"],["Leopard = producer, deer = consumer","Báo = sinh vật sản xuất (producer), hươu = sinh vật tiêu thụ (consumer)"],["Leopard = predator, deer = prey","Báo = kẻ săn mồi (predator), hươu = con mồi (prey)"]],a:2},
 {q:["What does it mean to say that a microorganism is a decomposer?","Nói một vi sinh vật là sinh vật phân hủy (decomposer) nghĩa là gì?"],o:[["It makes its own food from sunlight","Nó tự làm thức ăn từ ánh sáng mặt trời"],["It breaks down organic matter as it feeds on it","Nó phá vỡ chất hữu cơ (organic matter) khi ăn nó"],["It can only live inside a fridge","Nó chỉ sống được trong tủ lạnh"]],a:1},
 {q:["Which of these is organic matter?","Chất nào dưới đây là chất hữu cơ (organic matter)?"],o:[["Water","Nước"],["Rock","Đá"],["Leather","Da thuộc"],["Glass","Thủy tinh"]],a:2},
 {q:["In the bread investigation, what did the results show after several days?","Trong khảo sát bánh mì, kết quả sau vài ngày cho thấy điều gì?"],o:[["The warm bread had much more mould than the bread in the fridge","Bánh ở nơi ấm có nhiều mốc (mould) hơn hẳn bánh trong tủ lạnh"],["The fridge bread had much more mould","Bánh trong tủ lạnh có nhiều mốc hơn hẳn"],["Both pieces stayed completely fresh","Cả hai miếng đều hoàn toàn tươi"]],a:0},
 {q:["You plan to test: “Moist bread decays more quickly than dry bread.” Which variable do you change?","Con định kiểm tra: “Bánh mì ẩm phân hủy nhanh hơn bánh mì khô.” Con thay đổi biến nào?"],o:[["The temperature of the room","Nhiệt độ của phòng"],["The amount of water on the bread","Lượng nước trên bánh mì"],["The type of bread","Loại bánh mì"]],a:1},
 {q:["What do decomposers do?","Sinh vật phân hủy (decomposers) làm gì?"],o:[["They make their own food from sunlight","Chúng tự làm thức ăn từ ánh sáng Mặt Trời"],["They break down dead bodies and animal waste","Chúng phá vỡ xác chết và chất thải động vật"],["They eat only living plants","Chúng chỉ ăn cây đang sống"]],a:1},
 {q:["Why are decomposers useful to plants?","Vì sao sinh vật phân hủy (decomposers) hữu ích cho cây?"],o:[["They return nutrients to the soil, and plants use the nutrients to grow","Chúng trả chất dinh dưỡng (nutrients) lại cho đất, và cây dùng chất dinh dưỡng để lớn lên"],["They eat all the insects that harm plants","Chúng ăn hết côn trùng hại cây"],["They make rain fall on the fields","Chúng làm mưa rơi xuống ruộng"]],a:0},
 {q:["In a food web, an arrow runs from a dead parrot to microorganisms. What does the arrow show?","Trong một lưới thức ăn (food web), một mũi tên chạy từ một con vẹt đã chết tới vi sinh vật. Mũi tên đó cho thấy điều gì?"],o:[["The parrot feeds on the microorganisms","Con vẹt ăn vi sinh vật"],["The microorganisms turn into a parrot","Vi sinh vật biến thành con vẹt"],["Energy passes from the dead parrot to the microorganisms that feed on it","Năng lượng truyền từ con vẹt đã chết tới vi sinh vật ăn nó"]],a:2},
 {q:["Are decomposers producers or consumers?","Sinh vật phân hủy (decomposers) là sinh vật sản xuất hay sinh vật tiêu thụ?"],o:[["Producers — they make their own food","Sinh vật sản xuất (producers) — chúng tự làm thức ăn"],["Consumers — they feed on other organisms (dead ones and their waste)","Sinh vật tiêu thụ (consumers) — chúng ăn các sinh vật khác (sinh vật đã chết và chất thải của chúng)"],["Neither — decomposers are not alive","Không loại nào — sinh vật phân hủy không có sự sống"]],a:1}

 {q:["What colour is universal indicator when a solution is neutral?","Chất chỉ thị vạn năng (universal indicator) có màu gì khi một dung dịch trung tính (neutral)?"],o:[["Red","Đỏ"],["Green","Xanh lá"],["Purple","Tím"],["Yellow","Vàng"]],a:1},
 {q:["An acid and an alkali are mixed together and the liquid becomes neutral, pH 7. This reaction is called…","Một axit và một kiềm được trộn với nhau và chất lỏng trở nên trung tính, pH 7. Phản ứng này được gọi là…"],o:[["neutralisation","phản ứng trung hòa (neutralisation)"],["decay","sự phân hủy (decay)"],["digestion","sự tiêu hóa (digestion)"],["filtration","sự lọc (filtration)"]],a:0},

 {q:["Why do farmers spread lime onto some fields?","Vì sao nông dân rải vôi (lime) lên một số thửa ruộng?"],o:[["To make the soil more acidic","Để làm đất có tính axit hơn"],["To colour the soil white","Để làm đất có màu trắng"],["To stop all plants growing","Để ngăn mọi cây trồng phát triển"],["To neutralise the acid in the soil, so plants grow better","Để trung hòa axit trong đất, giúp cây trồng phát triển tốt hơn"]],a:3},
 {q:["Which question about indigestion remedies can a scientist test?","Câu hỏi nào về thuốc chữa khó tiêu (remedies) mà một nhà khoa học có thể kiểm chứng được?"],o:[["Which remedy is the best?","Thuốc nào là tốt nhất?"],["Which powder neutralises the acid using the least amount of powder?","Bột nào trung hòa (neutralises) axit bằng lượng bột ít nhất?"],["Which remedy tastes the nicest?","Thuốc nào có vị ngon nhất?"],["Which remedy do people like most?","Thuốc nào được mọi người thích nhất?"]],a:1},

 {q:["After three tries, the mean numbers of spatulas are A 10, B 13, C 24. Which powder is now the most effective?","Sau ba lần thử, số thìa spatula trung bình là A 10, B 13, C 24. Bột nào giờ là hiệu quả nhất?"],o:[["Powder B","Bột B"],["Powder C","Bột C"],["Powder A","Bột A"]],a:2},
 {q:["Powder B’s results are 6, 17 and 16 spatulas. What is the best thing to do about the 6?","Kết quả của bột B là 6, 17 và 16 thìa spatula. Điều tốt nhất nên làm với số 6 là gì?"],o:[["Trust it — the first try is always right","Tin nó — lần thử đầu luôn luôn đúng"],["Use only the 6 and ignore the others","Chỉ dùng số 6 và bỏ qua các số còn lại"],["Delete it at once without checking","Xóa nó ngay mà không kiểm tra"],["Treat it as probably wrong: check for a mistake and repeat the test before trusting the mean","Coi nó có thể là sai: kiểm tra xem có sai sót không và lặp lại phép thử trước khi tin vào giá trị trung bình (mean)"]],a:3},
 {q:["How do you test for carbon dioxide, and what do you see?","Con thử carbon dioxide bằng cách nào, và con thấy gì?"],o:[["A glowing splint relights","Que đóm cháy âm ỉ bùng cháy lại"],["Limewater turns cloudy","Nước vôi trong (limewater) trở nên đục (cloudy)"],["A lit splint gives a squeaky pop","Que đóm đang cháy tạo tiếng nổ nhỏ (squeaky pop)"]],a:1},

 {q:["An ammeter reads 0.5 A at position X in a series circuit. What does it read at positions Y and Z?","Một ampe kế chỉ 0.5 A ở vị trí X trong một mạch nối tiếp (series circuit). Nó chỉ bao nhiêu ở các vị trí Y và Z?"],o:[["0.5 A at both — the current is the same all the way round","0.5 A ở cả hai — cường độ dòng điện như nhau khắp vòng mạch"],["Less at Y and even less at Z","Nhỏ hơn ở Y và còn nhỏ hơn nữa ở Z"],["More at Y and even more at Z","Lớn hơn ở Y và còn lớn hơn nữa ở Z"]],a:0},

 {q:["Why is it better to have millions of very small air sacs than a few large ones?","Vì sao có hàng triệu túi khí rất nhỏ lại tốt hơn chỉ có vài túi lớn?"],o:[["Together they give a much bigger surface area for diffusion","Cùng nhau chúng cho tổng diện tích bề mặt lớn hơn nhiều cho khuếch tán (diffusion)"],["They can hold more blood than large sacs","Chúng chứa được nhiều máu hơn các túi lớn"],["They make the air in the lungs warmer","Chúng làm không khí trong phổi ấm hơn"]],a:0},

 {q:["Which component of blood is a liquid?","Thành phần nào của máu là chất lỏng?"],o:[["Red blood cells","Hồng cầu (red blood cells)"],["Blood plasma","Huyết tương (blood plasma)"],["White blood cells","Bạch cầu (white blood cells)"]],a:1},
 {q:["Why do red blood cells have no nucleus?","Vì sao hồng cầu (red blood cells) không có nhân (nucleus)?"],o:[["So they can change shape and capture bacteria","Để chúng thay đổi hình dạng và bắt vi khuẩn"],["So they can make antibodies","Để chúng tạo kháng thể (antibodies)"],["It leaves more room for haemoglobin","Nó chừa thêm chỗ cho haemoglobin"]],a:2},
 {q:["How does a white blood cell kill a pathogen by phagocytosis?","Bạch cầu (white blood cell) diệt mầm bệnh (pathogen) bằng thực bào (phagocytosis) như thế nào?"],o:[["It changes shape, captures the bacterium, then kills and digests it","Nó thay đổi hình dạng, bắt vi khuẩn, rồi giết và tiêu hóa nó"],["It joins haemoglobin to make oxyhaemoglobin","Nó kết hợp với haemoglobin tạo oxyhaemoglobin"],["It carries the bacterium to the lungs","Nó chở vi khuẩn tới phổi"]],a:0},
 {q:["What is oxyhaemoglobin?","Oxyhaemoglobin là gì?"],o:[["A chemical in plasma that kills pathogens","Một chất trong huyết tương (plasma) giết mầm bệnh"],["An antibody made by white blood cells","Một kháng thể (antibody) do bạch cầu tạo ra"],["The bright red compound formed when haemoglobin combines with oxygen","Hợp chất màu đỏ tươi tạo thành khi haemoglobin kết hợp với oxy (oxygen)"]],a:2}

 {q:["A green powder is stirred into water. The water stays cloudy and lumps of powder can still be seen. Has a solution formed?","Một bột màu xanh được khuấy vào nước. Nước vẫn đục và vẫn thấy các cục bột. Dung dịch (solution) đã hình thành chưa?"],o:[["Yes — stirring always makes a solution","Rồi — khuấy luôn tạo thành dung dịch"],["No — it has not dissolved, and a solution would be transparent","Chưa — nó chưa hòa tan, mà dung dịch thì phải trong suốt (transparent)"],["Yes — the water changed colour","Rồi — vì nước đã đổi màu"]],a:1},

 {q:["Solution A (10 cm3 dye + 0 cm3 water) and solution E (2 cm3 dye + 8 cm3 water) both total 10 cm3. Why is A more concentrated?","Dung dịch A (10 cm3 phẩm + 0 cm3 nước) và dung dịch E (2 cm3 phẩm + 8 cm3 nước) đều tổng 10 cm3. Vì sao A đậm đặc (concentrated) hơn?"],o:[["A has more solute particles dissolved in the same total volume","A có nhiều hạt chất tan (solute) hòa tan hơn trong cùng tổng thể tích"],["A has more water in it","A có nhiều nước hơn"],["E has more solute particles","E có nhiều hạt chất tan hơn"]],a:0},
 {q:["100 g of water dissolves 204 g of sugar at 20 °C but 362 g at 80 °C. What does this show?","100 g nước hòa tan 204 g đường ở 20 °C nhưng 362 g ở 80 °C. Điều này cho thấy gì?"],o:[["Sugar is insoluble when hot","Đường không tan (insoluble) khi nóng"],["The solubility of sugar increases as the temperature increases","Độ tan (solubility) của đường tăng khi nhiệt độ tăng"],["Temperature makes no difference to solubility","Nhiệt độ không ảnh hưởng gì tới độ tan"]],a:1},
 {q:["In the students’ investigation, the temperature of the water is changed and the spatulas of salt are counted. The temperature is…","Trong cuộc khảo sát của các bạn học sinh, nhiệt độ của nước được thay đổi và số thìa muối được đếm. Nhiệt độ là…"],o:[["the dependent variable","biến phụ thuộc (dependent variable)"],["the independent variable","biến độc lập (independent variable)"],["a control variable","một biến kiểm soát (control variable)"]],a:1},
 {q:["Which of these is a control variable in the students’ investigation?","Điều nào sau đây là một biến kiểm soát (control variable) trong cuộc khảo sát của các bạn học sinh?"],o:[["The temperature of the water","Nhiệt độ của nước"],["The number of spatulas of salt that dissolve","Số thìa (spatulas) muối tan được"],["The volume of water — 50 cm³ in every test","Thể tích nước — 50 cm³ trong mọi lần đo"]],a:2},
 {q:["When you plot a graph of the results, the independent variable goes…","Khi vẽ đồ thị (graph) kết quả, biến độc lập (independent variable) đi…"],o:[["along the horizontal axis","dọc trục ngang (horizontal axis)"],["up the vertical axis","dọc trục đứng (vertical axis)"],["in the title of the graph","trong tiêu đề của đồ thị"]],a:0},
 {q:["A plan tests the water at 20, 30, 40, 50, 60, 70 and 80 °C. What is the interval between the temperatures?","Một kế hoạch kiểm tra nước ở 20, 30, 40, 50, 60, 70 và 80 °C. Bước nhảy (interval) giữa các nhiệt độ là bao nhiêu?"],o:[["60 °C","60 °C"],["7 temperatures","7 nhiệt độ"],["10 °C","10 °C"]],a:2},
 {q:["A black pen is tested by paper chromatography and its ink makes three separate colour bands. What does that show?","Một cây bút đen được thử bằng sắc ký giấy (paper chromatography) và mực của nó tạo ba băng màu riêng. Điều đó cho thấy gì?"],o:[["The ink has dried out","Mực đã khô"],["Black ink is a mixture of coloured inks","Mực đen là hỗn hợp (mixture) của các mực màu"],["The paper is faulty","Tờ giấy bị lỗi"]],a:1},
 {q:["On a chromatogram, which substance is carried the furthest by the solvent?","Trên một sắc ký đồ (chromatogram), chất nào được dung môi (solvent) mang đi xa nhất?"],o:[["The most soluble substance","Chất tan tốt nhất (most soluble)"],["The least soluble substance","Chất tan kém nhất (least soluble)"],["The heaviest substance","Chất nặng nhất"]],a:0},
 {q:["Why is the starting line on chromatography paper drawn in pencil, not pen?","Vì sao vạch xuất phát trên giấy sắc ký được kẻ bằng bút chì (pencil), không phải bút mực?"],o:[["Pencil lines are darker","Vạch bút chì đậm hơn"],["Pencil is cheaper","Bút chì rẻ hơn"],["A pencil mark does not dissolve and travel up the paper","Vết bút chì không tan và không chạy lên giấy"]],a:2},
 {q:["A petal colour does not move at all when water is the solvent. What should the scientist try next?","Một màu cánh hoa không hề di chuyển khi dung môi (solvent) là nước. Nhà khoa học nên thử gì tiếp theo?"],o:[["Add much more water","Thêm thật nhiều nước"],["Try a different solvent, such as ethanol","Thử một dung môi khác, như ethanol"],["Use a bigger beaker","Dùng một cốc to hơn"]],a:1}
],
"sci8-u3":[
 {q:["What is meant by balanced forces?","Lực cân bằng (balanced forces) có nghĩa là gì?"],o:[["Forces that are different sizes in the same direction","Các lực có độ lớn khác nhau và cùng hướng"],["Forces that are equal in size and opposite in direction","Các lực có độ lớn bằng nhau và ngược chiều (opposite)"],["One very large force on its own","Một lực rất lớn đứng một mình"]],a:1},
 {q:["A rock sits still on the ground. Which pair of forces on it is balanced?","Một tảng đá nằm yên trên mặt đất. Cặp lực nào tác dụng lên nó cân bằng (balanced)?"],o:[["Its weight pulling down and the contact force of the ground pushing up","Trọng lượng (weight) kéo xuống và lực tiếp xúc (contact force) của mặt đất đẩy lên"],["The wind and the Sun’s gravity","Gió và lực hấp dẫn (gravity) của Mặt Trời"],["Friction and the push of a large vehicle","Ma sát (friction) và lực đẩy của một chiếc xe lớn"]],a:0},
 {q:["A parachute has just opened on a fast-falling object. Why does the object slow down?","Một chiếc dù (parachute) vừa mở trên một vật đang rơi nhanh. Vì sao vật chậm lại (slow down)?"],o:[["Its weight suddenly gets bigger","Trọng lượng (weight) của nó đột nhiên lớn hơn"],["The parachute makes gravity stop working","Chiếc dù làm lực hấp dẫn (gravity) ngừng hoạt động"],["Air resistance pushing up is now larger than its weight","Lực cản không khí (air resistance) đẩy lên giờ lớn hơn trọng lượng (weight) của nó"]],a:2},
 {q:["In a tug of war, the rope is still. Then it starts moving towards Team B. Which change could make that happen?","Trong trò kéo co, sợi dây đang đứng yên. Rồi nó bắt đầu chuyển động về phía Đội B. Thay đổi nào có thể gây ra điều đó?"],o:[["Both teams pull harder by exactly the same amount","Cả hai đội cùng kéo mạnh hơn với lượng đúng bằng nhau"],["Team A pulls with a smaller force, or Team B pulls with a larger force","Đội A kéo với lực nhỏ hơn, hoặc Đội B kéo với lực lớn hơn"],["Both teams let go of the rope","Cả hai đội cùng buông dây"]],a:1},
 {q:["What is the standard scientific unit of speed?","Đơn vị khoa học chuẩn của tốc độ (speed) là gì?"],o:[["km/h","km/h"],["m/s — metres per second","m/s — mét trên giây (metres per second)"],["miles per hour","dặm trên giờ (miles per hour)"]],a:1},
 {q:["A bus travels 100 m in 20 s. What is its speed?","Một xe buýt đi 100 m trong 20 s. Tốc độ của nó là bao nhiêu?"],o:[["5 m/s","5 m/s"],["2000 m/s","2000 m/s"],["0.2 m/s","0.2 m/s"]],a:0},
 {q:["Marcus rides at 4 m/s for 60 s. How far does he go?","Marcus đạp xe với tốc độ 4 m/s trong 60 s. Cậu ấy đi được bao xa?"],o:[["15 m","15 m"],["64 m","64 m"],["240 m","240 m"]],a:2},
 {q:["A car travels at 35 m/s. How long does it take to travel 2100 m?","Một ô tô chạy với tốc độ 35 m/s. Nó mất bao lâu để đi 2100 m?"],o:[["6 s","6 s"],["60 s","60 s"],["2135 s","2135 s"]],a:1},
 {q:["On a distance–time graph, what does a horizontal (flat) line show?","Trên đồ thị quãng đường – thời gian (distance–time graph), một đường nằm ngang cho thấy điều gì?"],o:[["The object is moving very fast","Vật đang chuyển động rất nhanh"],["The distance is growing quickly","Khoảng cách đang tăng nhanh"],["The object is stationary — its distance does not change","Vật đứng yên (stationary) — khoảng cách của nó không đổi"]],a:2},
 {q:["Two objects move away from the same start. Object X has the steeper line on a distance–time graph. What does that mean?","Hai vật cùng rời một điểm xuất phát. Vật X có đường dốc hơn trên đồ thị quãng đường – thời gian. Điều đó nghĩa là gì?"],o:[["X is moving faster — it covers more distance in each second","X chuyển động nhanh hơn — mỗi giây nó đi quãng dài hơn"],["X is stationary","X đứng yên (stationary)"],["X is moving back to the start","X đang quay về điểm xuất phát"]],a:0},
 {q:["A train travels 2000 m from station P to station R in 200 s. What is its speed?","Một đoàn tàu đi 2000 m từ ga P tới ga R trong 200 s. Tốc độ của nó là bao nhiêu?"],o:[["20 m/s","20 m/s"],["10 m/s","10 m/s"],["5 m/s","5 m/s"]],a:1},
 {q:["On a distance–time graph, a straight line slopes downwards. What is the object doing?","Trên đồ thị quãng đường – thời gian, một đường thẳng dốc xuống. Vật đang làm gì?"],o:[["Moving away faster and faster","Đi ra xa ngày càng nhanh"],["Moving back towards its starting position","Đang quay về vị trí xuất phát của nó"],["Staying stationary","Đang đứng yên (stationary)"]],a:1},
 {q:["What is a moment, in physics?","Trong vật lý, mô-men (moment) là gì?"],o:[["A push in a straight line","Một lực đẩy theo đường thẳng"],["The turning effect of a force","Hiệu ứng làm quay (turning effect) của một lực"],["The weight of an object","Trọng lượng của một vật"]],a:1},
 {q:["A force of 35 N acts 0.8 m from a pivot. What is its moment?","Một lực 35 N tác dụng cách trục quay (pivot) 0,8 m. Mô-men (moment) của nó là bao nhiêu?"],o:[["28 N m","28 N m"],["43 N m","43 N m"],["2.8 N m","2,8 N m"]],a:0},
 {q:["Marcus (600 N) sits 2 m from a seesaw pivot. How far from the pivot must Arun (800 N) sit to balance him?","Marcus (600 N) ngồi cách trục quay (pivot) của bập bênh 2 m. Arun (800 N) phải ngồi cách trục quay bao xa để cân bằng với Marcus?"],o:[["1.0 m","1,0 m"],["2.0 m","2,0 m"],["1.5 m","1,5 m"]],a:2},
 {q:["In the metre-rule investigation, the same pull-down is used each time. As the pulling force is moved closer to the pivot, the force needed…","Trong khảo sát thước mét, mỗi lần kéo xuống cùng một đoạn. Khi lực kéo được dời gần trục quay (pivot) hơn, lực cần thiết…"],o:[["gets smaller","nhỏ đi"],["gets bigger","lớn lên"],["stays exactly the same","giữ nguyên chính xác"]],a:1},
 {q:["A box weighs 60 N and touches the ground over an area of 0.5 m². What pressure does it exert on the ground?","Một chiếc hộp nặng 60 N và chạm đất trên diện tích 0,5 m². Nó gây áp suất (pressure) bao nhiêu lên mặt đất?"],o:[["30 N/m²","30 N/m²"],["120 N/m²","120 N/m²"],["60.5 N/m²","60,5 N/m²"]],a:1},
 {q:["Why are shoes for walking on snow wide and flat?","Vì sao giày đi trên tuyết lại rộng và phẳng?"],o:[["They spread the weight over a larger area, so the pressure on the snow is smaller","Chúng trải trọng lượng trên diện tích (area) lớn hơn, nên áp suất (pressure) lên tuyết nhỏ hơn"],["They make the person heavier","Chúng làm người nặng hơn"],["They make the snow harder","Chúng làm tuyết cứng hơn"]],a:0},
 {q:["A nail goes into wood when the pressure at its point is 60 N/mm². The point area is 0.5 mm². What force is needed?","Một chiếc đinh cắm vào gỗ khi áp suất (pressure) ở mũi đinh là 60 N/mm². Diện tích mũi đinh là 0,5 mm². Cần lực (force) bao nhiêu?"],o:[["120 N","120 N"],["12 N","12 N"],["30 N","30 N"]],a:2},
 {q:["A force is measured in newtons and the area is measured in cm². What is the unit of the pressure?","Một lực (force) được đo bằng newton và diện tích (area) được đo bằng cm². Đơn vị của áp suất (pressure) là gì?"],o:[["newtons (N)","newton (N)"],["N/cm²","N/cm²"],["cm²/N","cm²/N"]],a:1},
 {q:["Why does pressure in a liquid increase with depth?","Vì sao áp suất trong chất lỏng tăng theo độ sâu (depth)?"],o:[["There is less liquid above you","Có ít chất lỏng phía trên hơn"],["The liquid gets colder","Chất lỏng lạnh hơn"],["There is more liquid above you, and its weight pushes down","Có nhiều chất lỏng phía trên hơn, và trọng lượng của nó ép xuống"]],a:2},
 {q:["What causes the pressure of a gas inside a container?","Điều gì gây ra áp suất của chất khí bên trong một vật chứa (container)?"],o:[["Particles colliding with the walls of the container","Các hạt va chạm (collide) vào thành của vật chứa"],["Particles standing still at the bottom","Các hạt đứng yên ở đáy"],["The colour of the container","Màu của vật chứa"]],a:0},
 {q:["Where is atmospheric pressure greatest?","Áp suất khí quyển (atmospheric pressure) lớn nhất ở đâu?"],o:[["At the top of a high mountain","Trên đỉnh một ngọn núi cao"],["At sea level","Ở mực nước biển (sea level)"],["High above the clouds","Cao trên những đám mây"]],a:1},
 {q:["A sealed gas bottle is heated. What happens to the pressure inside?","Một chai khí kín được đun nóng. Áp suất bên trong thay đổi thế nào?"],o:[["It falls to zero","Nó giảm xuống không"],["It stays exactly the same","Nó giữ nguyên y như cũ"],["It rises, because the particles move faster and collide harder","Nó tăng, vì các hạt chuyển động nhanh hơn và va chạm mạnh hơn"]],a:2},
 {q:["Zara is across the room from an open bottle of perfume, and after a few minutes she can smell it. Which statement explains why?","Zara ở phía bên kia phòng so với một chai nước hoa đã mở, và sau vài phút bạn ấy ngửi thấy mùi. Phát biểu nào giải thích vì sao?"],o:[["All the perfume particles move in one direction","Mọi hạt nước hoa chuyển động theo một hướng"],["The perfume gas particles move randomly and spread out","Các hạt khí nước hoa chuyển động ngẫu nhiên (randomly) và lan ra"],["All the particles in the air stay still","Mọi hạt trong không khí đứng yên"]],a:1},
 {q:["Which change would make Zara smell the perfume in a shorter time, if nothing else changes?","Thay đổi nào sẽ làm Zara ngửi thấy mùi nước hoa trong thời gian ngắn hơn, nếu không có gì khác thay đổi?"],o:[["The air in the room is at a higher temperature","Không khí trong phòng ở nhiệt độ (temperature) cao hơn"],["Zara moves further away from the bottle","Zara di chuyển ra xa chai hơn"],["The lid is put back on the bottle","Nắp được đậy lại lên chai"]],a:0},
 {q:["What is meant by diffusion?","Khuếch tán (diffusion) nghĩa là gì?"],o:[["Particles moving only downwards","Các hạt chỉ chuyển động xuống dưới"],["Particles stopping as soon as they spread out","Các hạt dừng lại ngay khi chúng lan ra"],["The overall random movement of particles from a higher concentration to a lower concentration","Chuyển động ngẫu nhiên tổng thể của các hạt từ nồng độ (concentration) cao hơn tới nồng độ thấp hơn"]],a:2},
 {q:["Arun says: when the orange colour has stopped spreading in a drink, the particles in the liquid have stopped moving. Is he correct?","Arun nói: khi màu cam đã ngừng lan trong một cốc nước, các hạt trong chất lỏng đã ngừng chuyển động. Bạn ấy có đúng không?"],o:[["Yes — everything has stopped","Đúng — mọi thứ đã dừng lại"],["No — the particles keep moving; the concentrations are now equal","Không — các hạt vẫn tiếp tục chuyển động; các nồng độ (concentration) giờ đã bằng nhau"],["Yes — because the colour is even","Đúng — vì màu đã đều"]],a:1}
],
"sci8-u4":[
 {q:["In the book food web diagram of the Sonoran Desert, which organisms are the producers?","Trong sơ đồ lưới thức ăn (food web) của sa mạc Sonoran trong sách, những sinh vật nào là sinh vật sản xuất (producers)?"],o:[["The grasshopper and the collared lizard","Châu chấu và thằn lằn cổ vòng"],["The prickly pear cactus and the brittlebrush","Xương rồng lê gai (prickly pear cactus) và cây brittlebrush"],["The kangaroo rat and the red-tailed hawk","Chuột túi và diều hâu đuôi đỏ"]],a:1},
 {q:["Why could the desert food web not exist without the producers?","Vì sao lưới thức ăn (food web) sa mạc không thể tồn tại nếu không có sinh vật sản xuất (producers)?"],o:[["Producers make food from sunlight energy, and every other organism in the web depends on that food","Sinh vật sản xuất làm thức ăn từ năng lượng ánh nắng, và mọi sinh vật khác trong lưới đều phụ thuộc vào thức ăn đó"],["Producers dig the burrows that animals live in","Sinh vật sản xuất đào hang cho động vật ở"],["Producers bring the rain to the desert","Sinh vật sản xuất mang mưa đến sa mạc"]],a:0},
 {q:["What do the arrows in a food web diagram represent?","Các mũi tên trong sơ đồ lưới thức ăn (food web) biểu thị điều gì?"],o:[["Which way the animals walk","Hướng động vật đi lại"],["Where the rain falls","Nơi mưa rơi xuống"],["The passing of energy from one organism to the one that eats it","Sự truyền năng lượng (energy) từ một sinh vật sang sinh vật ăn nó"]],a:2},
 {q:["What is the difference between a habitat and an ecosystem?","Sự khác nhau giữa nơi ở (habitat) và hệ sinh thái (ecosystem) là gì?"],o:[["They are two words for exactly the same thing","Chúng là hai từ chỉ đúng cùng một thứ"],["A habitat is where one organism lives; an ecosystem is the whole network of interactions between living and non-living things","Nơi ở (habitat) là chỗ một sinh vật sống; hệ sinh thái (ecosystem) là toàn bộ mạng lưới tương tác giữa sinh vật sống và những thứ vô sinh"],["A habitat is always bigger than an ecosystem","Nơi ở luôn lớn hơn hệ sinh thái"]],a:1},
 {q:["Marcus says an ecosystem is just a place. Sofia says an ecosystem is not just a place — it is more than that. Who is correct, and why?","Marcus nói một hệ sinh thái (ecosystem) chỉ là một nơi chốn. Sofia nói một hệ sinh thái không chỉ là một nơi chốn — nó còn hơn thế. Ai đúng, và vì sao?"],o:[["Marcus — an ecosystem is only the place itself","Marcus — một hệ sinh thái chỉ là chính nơi chốn đó"],["Sofia — an ecosystem also includes all the organisms, the non-living environment, and how they interact","Sofia — một hệ sinh thái còn gồm mọi sinh vật, môi trường (environment) không sống, và cách chúng tương tác"],["Neither of them","Cả hai đều sai"]],a:1},
 {q:["Which of these is a habitat inside the mangrove forest ecosystem?","Điều nào sau đây là một nơi sống (habitat) bên trong hệ sinh thái rừng ngập mặn?"],o:[["Among the mangrove roots, where young fish shelter from larger fish","Giữa các rễ cây đước, nơi cá con trú ẩn khỏi cá lớn hơn"],["Under the sea ice in the Arctic Ocean","Dưới băng biển ở Bắc Băng Dương"],["Inside a pitfall trap in a school garden","Bên trong một bẫy hố (pitfall trap) trong vườn trường"]],a:0},
 {q:["On Arctic sea ice, tiny algae grow under the ice and are eaten by tiny shrimp-like animals, which fish then eat. What eats the algae?","Trên băng biển Bắc Cực, tảo nhỏ mọc dưới băng và bị các động vật nhỏ giống tôm ăn, rồi cá ăn chúng. Sinh vật nào ăn tảo (algae)?"],o:[["Polar bears","Gấu Bắc Cực"],["Arctic foxes","Cáo Bắc Cực"],["The tiny shrimp-like animals","Các động vật nhỏ giống tôm"]],a:2},
 {q:["During a local ecosystem investigation, you catch a beetle in a pitfall trap. What must you do with it afterwards?","Trong một cuộc điều tra hệ sinh thái địa phương, con bắt được một con bọ cánh cứng trong bẫy hố (pitfall trap). Sau đó con phải làm gì với nó?"],o:[["Take it home and keep it in a jar","Mang nó về nhà và giữ trong một chiếc lọ"],["Release it exactly where you found it","Thả nó về đúng nơi con đã tìm thấy nó"],["Move it to a nicer habitat in another garden","Chuyển nó tới một nơi sống (habitat) đẹp hơn ở khu vườn khác"]],a:1},
 {q:["What is a native species?","Loài bản địa (native species) là gì?"],o:[["A species that people have just brought to a place","Một loài vừa được con người mang tới một nơi"],["A species that lives and developed in a place naturally","Một loài sống và phát triển tự nhiên ở một nơi"],["A species that has become extinct","Một loài đã tuyệt chủng (extinct)"]],a:1},
 {q:["What have stoats done in New Zealand?","Chồn stoat đã gây ra điều gì ở New Zealand?"],o:[["Eaten many kiwi chicks and helped drive some native birds extinct","Ăn nhiều chim kiwi con và góp phần làm vài loài chim bản địa tuyệt chủng (extinct)"],["Eaten all the rabbits and nothing else","Ăn hết thỏ và không ăn gì khác"],["Planted grass for sheep to eat","Trồng cỏ cho cừu ăn"]],a:0},
 {q:["Buffelgrass is spreading through the Sonoran Desert, where it does not belong. What is the name for a plant like this?","Cỏ buffel (buffelgrass) đang lan khắp sa mạc Sonoran, nơi nó không thuộc về. Tên gọi cho một loài cây như vậy là gì?"],o:[["A native species","Loài bản địa (native species)"],["An extinct species","Loài tuyệt chủng (extinct species)"],["An invasive species","Loài xâm nhập (invasive species)"]],a:2},
 {q:["Why is it very difficult to eradicate an introduced species once it has settled?","Vì sao rất khó xóa sổ (eradicate) một loài du nhập khi nó đã định cư?"],o:[["Because it is always a native species","Vì nó luôn là loài bản địa (native species)"],["Because it may be widespread, well hidden and breeding rapidly, so only controlling its numbers may be possible","Vì nó có thể đã lan rộng, trốn giỏi và sinh sản nhanh, nên có khi chỉ kiểm soát (control) được số lượng của nó"],["Because scientists are not allowed to try","Vì các nhà khoa học không được phép thử"]],a:1},
 {q:["Why is DDT described as a persistent chemical?","Vì sao DDT được mô tả là một hóa chất bền vững (persistent)?"],o:[["It kills insects very quickly","Nó diệt côn trùng rất nhanh"],["It does not break down, so it stays in the environment and in bodies for years","Nó không phân hủy (break down), nên ở lại trong môi trường và trong cơ thể nhiều năm"],["It is sprayed from aeroplanes","Nó được phun từ máy bay"]],a:1},
 {q:["The concentration of DDT in a minnow is 0.50 ppm and in a cormorant 26.40 ppm. How many times greater is the cormorant’s concentration?","Nồng độ DDT trong cá nhỏ (minnow) là 0.50 ppm và trong chim cốc (cormorant) là 26.40 ppm. Nồng độ của chim cốc gấp mấy lần?"],o:[["About 5 times","Khoảng 5 lần"],["About 26 times","Khoảng 26 lần"],["52.8 times","52.8 lần"]],a:2},
 {q:["What is the difference between bioaccumulation and biomagnification?","Tích lũy sinh học (bioaccumulation) và khuếch đại sinh học (biomagnification) khác nhau thế nào?"],o:[["Bioaccumulation is the build-up in one animal’s body; biomagnification is the rise in concentration up the food chain","Tích lũy sinh học (bioaccumulation) là sự tích lũy trong cơ thể một con vật; khuếch đại sinh học (biomagnification) là sự tăng nồng độ dọc chuỗi thức ăn (food chain)"],["They are two names for exactly the same thing","Chúng là hai tên của cùng một điều"],["Bioaccumulation only happens in plants","Tích lũy sinh học chỉ xảy ra ở thực vật"]],a:0},
 {q:["A biodegradable insecticide is unlikely to show biomagnification. Why?","Một thuốc trừ sâu (insecticide) phân hủy sinh học được ít có khả năng gây khuếch đại sinh học (biomagnification). Vì sao?"],o:[["It kills no insects at all","Nó không diệt con côn trùng nào cả"],["Microorganisms can break it down, so it does not keep building up in bodies","Vi sinh vật (microorganisms) có thể phân hủy nó, nên nó không tích lũy mãi trong cơ thể"],["It is always more expensive","Nó luôn đắt hơn"]],a:1}
],
