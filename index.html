<html lang="en">
<head>
<meta charset="UTF-8">

<title>Cambridge — Science & Maths</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         background:#f8fafc; color:#0f172a; min-height:100vh; }
  .col { max-width:480px; margin:0 auto; padding:16px 14px 40px; display:flex; flex-direction:column; gap:14px; }

  h1 { font-size:24px; font-weight:900; letter-spacing:-.02em; line-height:1.15; }
  .sub { color:#94a3b8; font-size:13px; font-weight:600; margin-top:2px; }

                    padding:5px 10px; border-radius:999px; cursor:pointer; }
  .langbar button.on { background:#0f172a; color:#fff; }
  .subjects { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .subj { border:0; font:inherit; text-align:left; color:#fff; padding:18px; border-radius:18px; cursor:pointer;
          transition:transform .08s; }

  .subj .ic { display:block; font-size:34px; margin-bottom:6px; }
  .subj .nm { display:block; font-size:19px; font-weight:900; }
  .subj .ds { display:block; margin-top:2px; font-size:12.5px; font-weight:600; opacity:.85; }

  .subj.math { background:#4f46e5; box-shadow:0 10px 20px rgba(79,70,229,.30); }
  .subj.dim { filter:saturate(.25); opacity:.55; box-shadow:none; }

  .stars .lb { font-size:12px; font-weight:700; opacity:.92; }

  .goal .gd { color:#64748b; font-size:12.5px; font-weight:600; margin-top:2px; }

          background:none; border:0; font:inherit; cursor:pointer; }

  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:14px; }
  .modal.open { display:flex; }
  .mbox { background:#fff; border-radius:20px; max-width:440px; width:100%; padding:20px; max-height:92vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .mbox h2 { font-size:20px; font-weight:900; }
  .bprog { color:#64748b; font-weight:700; font-size:13px; margin:6px 0 2px; }
  .hearts { font-size:17px; letter-spacing:2px; }
  .bq { font-size:17.5px; font-weight:800; line-height:1.4; margin:10px 0 12px; }
  .bopt { display:block; width:100%; text-align:left; font:inherit; font-size:15.5px; font-weight:700; padding:12px 14px; margin:8px 0;
          border-radius:14px; border:2px solid #e2e8f0; background:#f8fafc; cursor:pointer; }
  .bopt.right { border-color:#22c55e; background:#f0fdf4; }
  .bopt.wrong { border-color:#ef4444; background:#fef2f2; }

  .breveal { font-weight:700; font-size:14.5px; background:#fff7ed; border:2px solid #fed7aa; border-radius:12px; padding:10px 12px; margin-top:10px; display:none; }
  .bbtn { font:inherit; font-weight:900; font-size:15.5px; border:0; border-radius:14px; padding:12px 18px; cursor:pointer; margin-top:14px; }
  .bbtn.go { background:#dc2626; color:#fff; box-shadow:0 6px 14px rgba(220,38,38,.35); }
  .bbtn.ghost { background:#f1f5f9; color:#334155; }
  .bres { text-align:center; padding:8px 0 2px; }
  .bres .e { font-size:46px; }
  .bres .t { font-size:20px; font-weight:900; margin:6px 0; }
  .bres .d { color:#64748b; font-weight:600; font-size:14px; }

};
let LANG = localStorage.getItem("camb:hub-lang") || "mix";
const S = k => STR[k][LANG] || STR[k].en;
function L(code,en,vi,file){ return {code,en,vi,file:file||null}; }
const DATA = {
  science: { 1: [
    {u:1, en:"Living things", vi:"Sinh vật sống", items:[ L("1.1","Animals and plants alive!","Động vật và cây cối đang sống!","sci1-1-1-animals-and-plants-alive.html"), L("1.2","Parts of a plant","Các bộ phận của cây","sci1-1-2-parts-of-a-plant.html"), L("1.3","Plants and light","Cây và ánh sáng","sci1-1-3-plants-and-light.html"), L("1.4","Plants need water","Cây cần nước","sci1-1-4-plants-need-water.html") ]},

function sumKey(item){ return "camb:sum:" + (item.file||"").replace(/^sci(\d)-(\d+)-(\d+).*$/, "sci$1-$2-$3"); }
function getProgress(item){
  if (!item.file) return null;
  try { const s = JSON.parse(localStorage.getItem(sumKey(item))); if (s) return s; } catch(e){}
  try { const code = item.file.match(/^sci\d-\d+-\d+/)[0]; const r = JSON.parse(localStorage.getItem("camb:"+code));
    if (r && Array.isArray(r.done)) return {s:r.done.length, st:Math.max(6,r.done.length), e:0, et:0, q:0, qt:0}; } catch(e){}
  return null;
}
function starsOf(p){ if (!p) return 0; let n=0; if (p.st>0 && p.s>=p.st) n++; if (p.et>0 && p.e>=p.et) n++; if (p.qt>0 && p.q/p.qt>=0.75) n++; return n; }
function complete(p){ return !!p && p.st>0 && p.s>=p.st; }

function saveWallet(w){ try { localStorage.setItem("camb:wallet", JSON.stringify(w)); } catch(e){} }

 {q:["What do we use to look at plant parts carefully?","Ta dùng gì để ngắm các bộ phận của cây thật kỹ?"],o:[["A big spoon","Một cái thìa to"],["A magnifying glass","Kính lúp (magnifying glass)"],["A hat","Một cái mũ"]],a:1},

/* ============ render ============ */
const $ = id => document.getElementById(id);
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2400); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const DECOS = ["🍬","🍭","🌸","🍀","⭐","🦋"];
function render(){
  document.querySelectorAll("#langbar button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("ttl").textContent = S("title"); $("tsub").textContent = S("tsub");
  $("sciDs").textContent = S("sciDs"); $("mathDs").textContent = S("mathDs");
  $("subjSci").classList.toggle("dim", view.tab !== "science");
  $("subjMath").classList.toggle("dim", view.tab !== "math");
  $("starLb").textContent = S("starLb"); $("goalT").textContent = S("goalT"); $("foot").textContent = S("foot");
  /* books */
  const bk = $("books"); bk.innerHTML = "";
  for (let n=1;n<=9;n++){ const b = document.createElement("button"); b.textContent = S("book")(n);
    if (n === view.book) b.className = "on " + (view.tab === "science" ? "sci" : "math");
    b.onclick = () => { view.book = n; saveView(); render(); }; bk.appendChild(b); }
  /* totals across produced lessons */
  const wallet = loadWallet();
  let lessonStars = 0, prodTotal = 0, prodDone = 0;
  Object.values(DATA).forEach(books => Object.values(books).forEach(units => units.forEach(u => u.items.forEach(it => {
    if (it.file){ const p = getProgress(it); lessonStars += starsOf(p); }
  }))));
  $("starVl").textContent = "⭐ " + (lessonStars + wallet.stars);
  $("starBr").textContent = S("starBr")(lessonStars, wallet.stars);
  /* map */
  const map = $("map"); map.className = "map " + (view.tab === "science" ? "sci" : "math"); map.innerHTML = "";
  const units = (DATA[view.tab] || {})[view.book];
  if (!units){ map.innerHTML = '<div class="soonbox"><span class="e">🚀</span>' + S("soon") + "</div>";
    $("ringPc").textContent = "0%"; $("ringFg").style.strokeDashoffset = 169.6; $("goalD").textContent = S("goalD")(0,0); return; }
  /* sequential unlock over produced lessons in book order */
  const flat = []; units.forEach(u => u.items.forEach(it => flat.push(it)));
  const produced = flat.filter(it => it.file);
  produced.forEach(it => { const p = getProgress(it); if (p){ prodTotal++; if (complete(p)) prodDone++; } else prodTotal++; });
  const pct = produced.length ? Math.round(100 * produced.filter(it => complete(getProgress(it))).length / produced.length) : 0;
  $("ringPc").textContent = pct + "%"; $("ringFg").style.strokeDashoffset = (169.6 * (1 - pct/100)).toFixed(1);
  $("ringFg").style.stroke = view.tab === "science" ? "#0d9488" : "#4f46e5";
  $("goalD").textContent = S("goalD")(produced.filter(it => complete(getProgress(it))).length, produced.length);
  let prevComplete = true, firstProduced = true;
  const openMap = {};
  produced.forEach(it => { const p = getProgress(it); openMap[it.code] = firstProduced || prevComplete || !!p; firstProduced = false; prevComplete = complete(p); });
  units.forEach(u => {
    const sec = document.createElement("div");
    const bossKey = (view.tab === "science" ? "sci" : "math") + view.book + "-u" + u.u;
    const unitProduced = u.items.filter(it => it.file);
    const unitAllDone = unitProduced.length === u.items.length && unitProduced.length > 0 && unitProduced.every(it => complete(getProgress(it)));
    const bossWon = !!wallet.bossWins[bossKey];
    const rib = document.createElement("div"); rib.className = "ribbon";
    rib.innerHTML = "<span>Unit " + u.u + " · " + (LANG === "vi" ? u.vi : (LANG === "en" ? u.en : u.en + " · " + u.vi)) + "</span>" + (bossWon ? '<span class="tr">🏆</span>' : "");
    sec.appendChild(rib);
    const rows = u.items.length + ((unitProduced.length === u.items.length && BANKS[bossKey]) ? 1 : 0);
    const H = rows * 96 + 10;
    const path = document.createElement("div"); path.className = "path"; path.style.height = H + "px";
    const xs = [22, 50, 78, 50];
    let pts = [];
    const posOf = i => ({ x: xs[i % 4], y: 46 + i * 96 });
    u.items.forEach((it, i) => pts.push(posOf(i)));
    if (rows > u.items.length) pts.push({ x:50, y: 46 + u.items.length * 96 });
    let dAttr = "";
    pts.forEach((p, i) => { dAttr += (i === 0 ? "M" : "L") + (p.x * 4.4) + "," + p.y + " "; });
    path.innerHTML = '<svg viewBox="0 0 440 ' + H + '" preserveAspectRatio="none"><path d="' + dAttr + '" fill="none" stroke="#ffffff" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.95"/></svg>';
    pts.forEach((p, i) => { if (i % 2 === 1) { const d = document.createElement("div"); d.className = "deco"; d.textContent = DECOS[(u.u + i) % DECOS.length];
      d.style.left = ((p.x + 26) % 92) + "%"; d.style.top = (p.y + 8) + "px"; path.appendChild(d); } });
    u.items.forEach((it, i) => {
      const p = posOf(i), prog = getProgress(it);
      const node = document.createElement("button");
      let st, face;
      if (!it.file){ st = "st-soon"; face = "…"; }
      else if (complete(prog)){ st = "st-done"; face = "✓"; }
      else if (prog){ st = "st-prog"; face = it.code; }
      else if (openMap[it.code]){ st = "st-open"; face = it.code; }
      else { st = "st-lock"; face = "🔒"; }
      node.className = "node " + st; node.style.left = p.x + "%"; node.style.top = (p.y - 28) + "px";
      const st3 = it.file ? starsOf(prog) : 0;
      node.innerHTML = '<div class="bubble">' + face + '</div><div class="st3">' +
        (it.file ? ("★".repeat(st3) + '<span class="off">' + "★".repeat(3 - st3) + "</span>") : "") +
        '</div><div class="lb2">' + it.code + " " + (LANG === "vi" ? it.vi : it.en) + "</div>";
      node.onclick = () => {
        if (!it.file){ toast(S("soon")); return; }
        if (st === "st-lock"){ node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); toast(S("locked")); return; }
        location.href = it.file;
      };
      path.appendChild(node);
    });
    if (rows > u.items.length){
      const p = pts[pts.length - 1];
      const bn = document.createElement("button");
      const bst = bossWon ? "boss-won" : (unitAllDone ? "boss-ready" : "boss-lock");
      bn.className = "node bossnode " + bst; bn.style.left = p.x + "%"; bn.style.top = (p.y - 34) + "px";
      bn.innerHTML = '<div class="bubble">' + (bossWon ? "🏆" : "👹") + '</div><div class="st3"></div><div class="lb2">' + S("boss") + "</div>";
      bn.onclick = () => { if (!unitAllDone && !bossWon){ bn.classList.remove("shake"); void bn.offsetWidth; bn.classList.add("shake"); toast(S("bossLocked")); return; } openBoss(bossKey, u.u); };
      path.appendChild(bn);
    }
    sec.appendChild(path); map.appendChild(sec);
  });
}
function saveView(){ try { localStorage.setItem("camb:hub-view", JSON.stringify(view)); } catch(e){} }
$("subjSci").onclick = () => { view.tab = "science"; saveView(); render(); };
$("subjMath").onclick = () => { view.tab = "math"; saveView(); render(); };
document.querySelectorAll("#langbar button").forEach(b => b.onclick = () => { LANG = b.dataset.l; localStorage.setItem("camb:hub-lang", LANG); render(); });
/* ============ boss fight ============ */
let boss = null;
function openBoss(key, unitNo){
  boss = { key, unitNo, qs: shuffle(BANKS[key]).slice(0, 8), idx: 0, me: 0, bo: 0, hearts: 3, phase: "intro", order: null };
  $("bossModal").classList.add("open"); renderBoss();
}
function closeBoss(){ $("bossModal").classList.remove("open"); boss = null; render(); }
function heartsStr(){ return "❤️".repeat(boss.hearts) + "🖤".repeat(3 - boss.hearts); }
function renderBoss(){
  const box = $("bossBox");
  if (boss.phase === "intro"){
    box.innerHTML = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bq" style="font-weight:700;font-size:15.5px">' + S("bossIntro") +
      '</div><button class="bbtn go" id="bStart">' + S("start") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bStart").onclick = () => { boss.phase = "q"; boss.order = shuffle(boss.qs[0].o.map((_, i) => i)); renderBoss(); };
    $("bClose").onclick = closeBoss; return;
  }
  if (boss.phase === "end"){
    const won = boss.result === "win"; const w = loadWallet(); const again = won && !boss.firstWin;
    box.innerHTML = '<div class="bres"><div class="e">' + (won ? "🏆" : "👹") + '</div><div class="t">' + (won ? S("win") : S("lose")) +
      '</div><div class="d">' + (won ? S("winD")(again) : S("loseD")) + "<br>" + S("qOf")(boss.qs.length, boss.qs.length, boss.me, boss.bo, heartsStr()) +
      '</div></div><button class="bbtn go" id="bAgain">' + S("again") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bAgain").onclick = () => openBoss(boss.key, boss.unitNo);
    $("bClose").onclick = closeBoss; return;
  }
  const q = boss.qs[boss.idx];
  let html = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bprog">' + S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr()) + "</div>";
  html += '<div class="bq">' + txt(q.q) + "</div>";
  boss.order.forEach(oi => { html += '<button class="bopt" data-oi="' + oi + '">' + txt(q.o[oi]) + "</button>"; });
  html += '<div class="breveal" id="bRev"></div><div id="bNext"></div>';
  box.innerHTML = html;
  box.querySelectorAll(".bopt").forEach(btn => btn.onclick = () => answerBoss(parseInt(btn.dataset.oi, 10)));
}
function answerBoss(oi){
  const q = boss.qs[boss.idx]; const right = oi === q.a;
  if (right) boss.me++; else boss.hearts--;
  const bossRight = Math.random() < 0.75;
  let bossPick = q.a;
  if (!bossRight){ const wrongs = q.o.map((_, i) => i).filter(i => i !== q.a); bossPick = wrongs[Math.floor(Math.random() * wrongs.length)]; }
  if (bossRight) boss.bo++;
  const box = $("bossBox");
  box.querySelectorAll(".bopt").forEach(btn => { const b = parseInt(btn.dataset.oi, 10); btn.disabled = true;
    if (b === q.a) btn.classList.add("right"); else if (b === oi) btn.classList.add("wrong"); });
  const rev = $("bRev"); rev.style.display = "block";
  rev.innerHTML = (right ? S("right") : S("wrong")) + "<br>" + (bossRight ? S("bossRight")(txt(q.o[bossPick])) : S("bossWrong")(txt(q.o[bossPick])));
  const prog = box.querySelector(".bprog"); if (prog) prog.textContent = S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr());
  if (boss.hearts <= 0){ boss.phase = "end"; boss.result = "lose"; setTimeout(renderBoss, 900); return; }
  $("bNext").innerHTML = '<button class="bbtn go" id="bNx">' + S("next") + "</button>";
  $("bNx").onclick = () => { boss.idx++;
    if (boss.idx >= boss.qs.length){ boss.phase = "end";
      if (boss.me > boss.bo){ boss.result = "win"; const w = loadWallet();
        if (!w.bossWins[boss.key]){ w.bossWins[boss.key] = true; w.stars += 3; saveWallet(w); boss.firstWin = true; } }
      else boss.result = "lose";
      renderBoss(); return; }
    boss.order = shuffle(boss.qs[boss.idx].o.map((_, i) => i)); renderBoss(); };
}
$("bossModal").addEventListener("click", e => { if (e.target === $("bossModal")) closeBoss(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && boss) closeBoss(); });
render();
</script>
</body>
