<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge — Science & Maths</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         background:#f8fafc; color:#0f172a; min-height:100vh; }
  .col { max-width:480px; margin:0 auto; padding:16px 14px 40px; display:flex; flex-direction:column; gap:14px; }
  header.top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  h1 { font-size:24px; font-weight:900; letter-spacing:-.02em; line-height:1.15; }
  .sub { color:#94a3b8; font-size:13px; font-weight:600; margin-top:2px; }
  .langbar { display:flex; gap:4px; background:#e2e8f0; border-radius:999px; padding:3px; flex:none; }
  .langbar button { border:0; background:transparent; font:inherit; font-size:12px; font-weight:800; color:#64748b;
                    padding:5px 10px; border-radius:999px; cursor:pointer; }
  .langbar button.on { background:#0f172a; color:#fff; }
  .subjects { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .subj { border:0; font:inherit; text-align:left; color:#fff; padding:18px; border-radius:18px; cursor:pointer;
          transition:transform .08s; }
  .subj:active { transform:scale(.98); }
  .subj .ic { display:block; font-size:34px; margin-bottom:6px; }
  .subj .nm { display:block; font-size:19px; font-weight:900; }
  .subj .ds { display:block; margin-top:2px; font-size:12.5px; font-weight:600; opacity:.85; }
  .subj.sci { background:#0d9488; box-shadow:0 10px 20px rgba(13,148,136,.30); }
  .subj.math { background:#4f46e5; box-shadow:0 10px 20px rgba(79,70,229,.30); }
  .subj.dim { filter:saturate(.25); opacity:.55; box-shadow:none; }
  .stars { border-radius:18px; padding:16px 18px; color:#fff; display:flex; align-items:center; justify-content:space-between;
           background:linear-gradient(90deg,#f59e0b,#f97316); box-shadow:0 10px 20px rgba(245,158,11,.25); }
  .stars .lb { font-size:12px; font-weight:700; opacity:.92; }
  .stars .vl { font-size:32px; font-weight:900; line-height:1.05; }
  .stars .br { font-size:11.5px; font-weight:600; opacity:.9; margin-top:2px; }
  .stars .big { font-size:34px; }
  .goal { background:#fff; border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:14px;
          box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .ring { position:relative; width:64px; height:64px; flex:none; }
  .ring svg { transform:rotate(-90deg); }
  .ring .pc { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }
  .goal .gt { font-weight:900; font-size:15.5px; }
  .goal .gd { color:#64748b; font-size:12.5px; font-weight:600; margin-top:2px; }
  .books { display:flex; gap:7px; flex-wrap:wrap; }
  .books button { border:2px solid #e2e8f0; background:#fff; font:inherit; font-size:13.5px; font-weight:800; color:#475569;
                  padding:7px 13px; border-radius:999px; cursor:pointer; }
  .books button.on.sci { background:#0d9488; border-color:#0d9488; color:#fff; box-shadow:0 6px 14px rgba(13,148,136,.35); }
  .books button.on.math { background:#4f46e5; border-color:#4f46e5; color:#fff; box-shadow:0 6px 14px rgba(79,70,229,.35); }
  .map { border-radius:22px; padding:8px 10px 22px; }
  .map.sci { background:#ecfdf5; } .map.math { background:#f5f3ff; }
  .ribbon { display:flex; align-items:center; gap:8px; background:#4f46e5; color:#fff; font-weight:900; font-size:14.5px;
            border-radius:12px; padding:9px 14px; margin:16px 6px 4px; box-shadow:0 6px 14px rgba(79,70,229,.30); }
  .ribbon .tr { margin-left:auto; font-size:15px; }
  .path { position:relative; margin:0 4px; }
  .path svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; transform:translate(-50%,0); width:78px; display:flex; flex-direction:column; align-items:center; gap:3px;
          background:none; border:0; font:inherit; cursor:pointer; }
  .bubble { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:19px; font-weight:900; color:#fff; border:3px solid #fff; transition:transform .08s; }
  .node:active .bubble { transform:scale(.94); }
  .st-done .bubble { background:linear-gradient(180deg,#fbbf24,#f59e0b); box-shadow:0 6px 0 #b45309, 0 12px 18px rgba(245,158,11,.35); }
  .st-open .bubble { background:linear-gradient(180deg,#4ade80,#22c55e); box-shadow:0 6px 0 #15803d, 0 12px 18px rgba(34,197,94,.35); animation:pulse 1.6s infinite; }
  .st-prog .bubble { background:linear-gradient(180deg,#60a5fa,#3b82f6); box-shadow:0 6px 0 #1d4ed8, 0 12px 18px rgba(59,130,246,.35); }
  .st-lock .bubble { background:#cbd5e1; color:#94a3b8; box-shadow:0 6px 0 #94a3b8; }
  .st-soon .bubble { background:#fff; color:#cbd5e1; border:3px dashed #cbd5e1; box-shadow:none; }
  @keyframes pulse { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.18);} }
  .node .lb2 { font-size:11px; font-weight:800; color:#334155; text-align:center; line-height:1.15; max-width:78px; }
  .node .st3 { font-size:11px; letter-spacing:1px; color:#f59e0b; height:14px; }
  .node .st3 .off { color:#cbd5e1; }
  .shake { animation:shk .4s; } @keyframes shk { 0%,100%{transform:translate(-50%,0);} 25%{transform:translate(calc(-50% - 6px),0);} 75%{transform:translate(calc(-50% + 6px),0);} }
  .bossnode .bubble { width:68px; height:68px; font-size:30px; }
  .boss-ready .bubble { background:linear-gradient(180deg,#f87171,#dc2626); box-shadow:0 7px 0 #991b1b, 0 14px 22px rgba(220,38,38,.4); animation:pulse 1.6s infinite; }
  .boss-won .bubble { background:linear-gradient(180deg,#fbbf24,#f59e0b); box-shadow:0 7px 0 #b45309, 0 14px 22px rgba(245,158,11,.4); }
  .boss-lock .bubble { background:#cbd5e1; box-shadow:0 7px 0 #94a3b8; }
  .deco { position:absolute; font-size:17px; opacity:.7; pointer-events:none; }
  .soonbox { text-align:center; padding:36px 16px; color:#64748b; font-weight:700; font-size:15px; }
  .soonbox .e { font-size:42px; display:block; margin-bottom:8px; }
  footer { text-align:center; color:#94a3b8; font-size:12px; font-weight:600; line-height:1.5; padding:0 8px; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#0f172a; color:#fff; font-weight:700;
           font-size:14px; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:14px; }
  .modal.open { display:flex; }
  .mbox { background:#fff; border-radius:20px; max-width:440px; width:100%; padding:20px; max-height:92vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .mbox h2 { font-size:20px; font-weight:900; }
  .bprog { color:#64748b; font-weight:700; font-size:13px; margin:6px 0 2px; }
  .hearts { font-size:17px; letter-spacing:2px; }
  .bq { font-size:17.5px; font-weight:800; line-height:1.4; margin:10px 0 12px; }
  .bopt { display:block; width:100%; text-align:left; font:inherit; font-size:15.5px; font-weight:700; padding:12px 14px; margin:8px 0;
          border-radius:14px; border:2px solid #e2e8f0; background:#f8fafc; cursor:pointer; }
  .bopt.right { border-color:#22c55e; background:#f0fdf4; }
  .bopt.wrong { border-color:#ef4444; background:#fef2f2; }
  .bopt:disabled { cursor:default; }
  .breveal { font-weight:700; font-size:14.5px; background:#fff7ed; border:2px solid #fed7aa; border-radius:12px; padding:10px 12px; margin-top:10px; display:none; }
  .bbtn { font:inherit; font-weight:900; font-size:15.5px; border:0; border-radius:14px; padding:12px 18px; cursor:pointer; margin-top:14px; }
  .bbtn.go { background:#dc2626; color:#fff; box-shadow:0 6px 14px rgba(220,38,38,.35); }
  .bbtn.ghost { background:#f1f5f9; color:#334155; }
  .bres { text-align:center; padding:8px 0 2px; }
  .bres .e { font-size:46px; }
  .bres .t { font-size:20px; font-weight:900; margin:6px 0; }
  .bres .d { color:#64748b; font-weight:600; font-size:14px; }
</style>
<style id="skin2">

  .band .sub { color:rgba(255,255,255,.85); }

  @keyframes candyBounce { 0%,100%{ transform:translateY(0) rotate(-8deg);} 50%{ transform:translateY(-7px) rotate(8deg);} }

  .st-done.gold .bubble { background:linear-gradient(180deg,#fef9c3,#fcd34d); border-color:#fbbf24; color:#92400e; }
  .st-done .bubble, .st-prog .bubble { background:linear-gradient(180deg,#fce7f3,#f9a8d4); border-color:#f472b6; color:#be185d; animation:none; }
  .st-open .bubble { background:#fff; color:#db2777; border-color:#f472b6; animation:none; }
  .st-lock .bubble { background:#e2e8f0; border-color:#cbd5e1; color:#94a3b8; }
  .node .st3 { color:#f59e0b; font-size:12.5px; height:auto; margin-top:2px; }
  .node .st3 .off { color:#fbbf24; opacity:.6; }
  .node .lb2 { background:rgba(255,255,255,.78); border-radius:999px; padding:3px 10px; box-shadow:none;
          font-size:10.5px; color:rgba(131,24,67,.78); max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bossnode .bubble { width:80px; height:80px; }
  #toast { bottom:102px; }
  #botbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(480px,100%); z-index:40;
          background:linear-gradient(92deg,#ec4899,#fb7185); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
          display:flex; gap:10px; box-shadow:0 -6px 20px rgba(190,24,93,.25); }
  #botbar button { flex:1; border:0; font:inherit; font-weight:900; font-size:15px; color:#fff; cursor:pointer;
          background:rgba(255,255,255,.22); border-radius:14px; padding:12px 6px; }

</style>

<body>
<div class="col">
  <header class="band">
    <div><h1 id="ttl"></h1><div class="sub" id="tsub"></div><div class="brk" id="starBr"></div></div>
    <div class="right">
      <div class="spill" id="starVl">⭐ 0</div>
      <div class="langbar" id="langbar">

  <div class="map sci" id="map"></div>

</div>

</div>
<div id="toast"></div>

</div></div>

 {q:["In Sofia's investigation, why were the classroom lights turned down?","Trong thí nghiệm của Sofia, vì sao đèn trong lớp được tắt bớt?"],o:[["So the toy could have a rest","Để món đồ chơi được nghỉ"],["So the flashlight shadow was clear and easy to see","Để bóng của đèn pin hiện rõ và dễ nhìn"],["Because flashlights only work at night","Vì đèn pin chỉ dùng được vào ban đêm"]],a:1},
 {q:["The star moves closer to the flashlight. What happens to its shadow?","Ngôi sao di chuyển lại gần đèn pin hơn. Bóng của nó sẽ thế nào?"],o:[["It gets smaller","Nó nhỏ đi"],["It stays exactly the same","Nó giữ nguyên y hệt"],["It gets bigger","Nó to ra"]],a:2},
 {q:["Marcus moved an object towards a light. At 50 cm from the light the shadow was 6 cm wide; at 10 cm it was 42 cm wide. What is the pattern?","Marcus di chuyển một vật lại gần một nguồn sáng. Cách nguồn sáng 50 cm, bóng rộng 6 cm; cách 10 cm, bóng rộng 42 cm. Quy luật là gì?"],o:[["The shadow got bigger as the object moved towards the light","Bóng to ra khi vật di chuyển lại gần nguồn sáng"],["The shadow got smaller as the object moved towards the light","Bóng nhỏ đi khi vật di chuyển lại gần nguồn sáng"],["The shadow stayed the same size all the time","Bóng giữ nguyên kích thước suốt"]],a:0},
 {q:["What does a transparent material do?","Một vật liệu trong suốt (transparent) làm được gì?"],o:[["It lets light pass through, so we can see things clearly","Nó cho ánh sáng xuyên qua, nên ta nhìn rõ mọi vật"],["It blocks all the light","Nó chặn hết ánh sáng"],["It makes the light change colour","Nó làm ánh sáng đổi màu"]],a:0},
 {q:["Zara adds one more layer of coloured plastic to her sunglasses. What happens?","Zara thêm một lớp nhựa màu nữa vào kính râm của mình. Điều gì xảy ra?"],o:[["The sunglasses get lighter","Kính râm sáng hơn"],["The sunglasses get darker","Kính râm tối hơn"],["Nothing changes at all","Không có gì thay đổi cả"]],a:1},
 {q:["Why are very dark sunglasses no help indoors?","Vì sao kính râm rất tối không giúp ích gì khi ở trong nhà?"],o:[["Indoors the light is already dim, and the dark glasses block even more of it","Trong nhà ánh sáng đã yếu, mà kính tối còn chặn thêm ánh sáng nữa"],["Because they only work at the beach","Vì chúng chỉ dùng được ở bãi biển"],["Because they get too heavy indoors","Vì ở trong nhà chúng trở nên quá nặng"]],a:0},
 {q:["Which sentence is true?","Câu nào sau đây đúng?"],o:[["Dirty water can be opaque, even though clean water is transparent","Nước bẩn có thể mờ đục (opaque), dù nước sạch thì trong suốt (transparent)"],["All water is always transparent","Mọi thứ nước luôn luôn trong suốt"],["We can look at the Sun safely with sunglasses on","Ta có thể nhìn vào Mặt Trời an toàn khi đeo kính râm"]],a:0},
 {q:["What does a translucent material do to light?","Vật liệu mờ (translucent) làm gì với ánh sáng?"],o:[["It scatters the light","Nó làm ánh sáng tán xạ (scatter)"],["It blocks all the light","Nó chặn hết ánh sáng"],["It makes its own light","Nó tự tạo ra ánh sáng"]],a:0},
 {q:["Which of these materials is translucent?","Vật liệu nào sau đây là vật liệu mờ (translucent)?"],o:[["Clear glass","Kính trong (clear glass)"],["Frosted glass","Kính mờ (frosted glass)"],["A wooden board","Một tấm ván gỗ"]],a:1},
 {q:["Sofia holds a page of writing behind bubble plastic. What can she do?","Sofia để một trang chữ phía sau tấm nhựa bong bóng. Bạn ấy làm được gì?"],o:[["She can read the words clearly","Bạn ấy đọc rõ các chữ"],["She cannot read the words clearly","Bạn ấy không đọc rõ các chữ"],["She cannot see the page at all","Bạn ấy hoàn toàn không thấy trang giấy"]],a:1},
 {q:["A friend says: “Translucent materials are a source of light.” Is the friend right?","Một người bạn nói: “Vật liệu mờ là một nguồn sáng.” Bạn ấy nói có đúng không?"],o:[["Yes — translucent materials make light","Đúng — vật liệu mờ tạo ra ánh sáng"],["No — they only scatter light from a light source","Không — chúng chỉ tán xạ ánh sáng từ một nguồn sáng"],["Yes — but only at night","Đúng — nhưng chỉ vào ban đêm"]],a:1}

 {q:["Zara’s heart rate was 65 beats per minute at rest and 85 after exercise. What happens two minutes after she stops?","Nhịp tim của Zara là 65 nhịp/phút lúc nghỉ và 85 sau khi vận động. Hai phút sau khi bạn ấy dừng lại, điều gì xảy ra?"],o:[["It stays at 85","Vẫn ở mức 85"],["It comes back down towards the resting rate","Giảm xuống dần về nhịp lúc nghỉ"],["Her heart stops beating","Tim bạn ấy ngừng đập"]],a:1},
 {q:["Why does your breathing rate go up after exercise?","Vì sao nhịp thở của con tăng lên sau khi vận động?"],o:[["Your body needs more oxygen","Cơ thể cần nhiều ô-xi (oxygen) hơn"],["Your lungs get smaller","Phổi (lungs) của con nhỏ lại"],["The air gets heavier","Không khí nặng hơn"]],a:0},
 {q:["Humans belong to which animal group?","Con người thuộc nhóm động vật nào?"],o:[["Mammals","Thú (mammals)"],["Birds","Chim (birds)"],["Reptiles","Bò sát (reptiles)"]],a:0},

 {q:["Which animal is cold-blooded?","Con vật nào là động vật máu lạnh (cold-blooded)?"],o:[["A polar bear","Gấu trắng"],["An eagle","Đại bàng"],["A frog","Một con ếch"]],a:2},
 {q:["In the frog life cycle, what comes just after the eggs?","Trong vòng đời của ếch, giai đoạn nào đến ngay sau trứng (eggs)?"],o:[["A tadpole","Nòng nọc (tadpole)"],["A froglet","Ếch con (froglet)"],["An adult frog","Ếch trưởng thành"]],a:0},
 {q:["In a food chain, a plant is the…","Trong chuỗi thức ăn (food chain), cây là…"],o:[["producer","sinh vật sản xuất (producer)"],["consumer","sinh vật tiêu thụ (consumer)"],["sunlight","ánh nắng (sunlight)"]],a:0},
 {q:["What do the arrows in a food chain show?","Các mũi tên trong chuỗi thức ăn cho ta biết điều gì?"],o:[["The biggest animal","Con vật to nhất"],["The way energy flows","Hướng năng lượng (energy) chảy"],["Where animals sleep","Nơi các con vật ngủ"]],a:1},
 {q:["Corn → mouse → cat. The cat gets its energy from…","Ngô → chuột → mèo. Bạn mèo lấy năng lượng (energy) từ…"],o:[["the mouse","bạn chuột (mouse)"],["the soil","đất (soil)"],["the rain","mưa (rain)"]],a:0},
 {q:["Grass → grasshopper → bird → snake → hawk. What happens if there is NO grass?","Cỏ → châu chấu → chim → rắn → diều hâu. Nếu KHÔNG có cỏ thì sao?"],o:[["The hawks eat the grass","Diều hâu ăn cỏ"],["Nothing changes","Không có gì thay đổi"],["The grasshoppers have no food","Châu chấu không còn thức ăn"]],a:2},
 {q:["What is a fossil?","Hóa thạch (fossil) là gì?"],o:[["The real living animal, still alive today","Chính con vật thật, vẫn còn sống đến ngày nay"],["An impression, or the remains, of something that was once alive","Vết in (impression), hoặc phần còn lại (remains), của một sinh vật từng sống"],["A toy made by scientists","Một món đồ chơi do các nhà khoa học làm ra"]],a:1},
 {q:["How does an impression fossil start?","Một hóa thạch vết in bắt đầu như thế nào?"],o:[["The hard parts of a dead animal press their shape into mud","Phần cứng của con vật chết ép hình dạng của chúng vào bùn"],["The animal paints a picture of itself on a rock","Con vật tự vẽ hình của nó lên tảng đá"],["Rain washes the animal into the sea","Mưa cuốn con vật ra biển"]],a:0},
 {q:["Why do scientists brush sand away from a fossil with a soft paintbrush?","Vì sao các nhà khoa học dùng cọ mềm quét cát khỏi hóa thạch?"],o:[["To make the sand clean and shiny","Để cát sạch và bóng"],["To scare insects away","Để đuổi côn trùng đi"],["So the fossil is not damaged","Để hóa thạch không bị hư hại"]],a:2},
 {q:["What is special about the insect fossil in tree gum?","Hóa thạch côn trùng trong nhựa cây (gum) có gì đặc biệt?"],o:[["It is still alive and can fly away","Nó vẫn còn sống và có thể bay đi"],["We can see the whole insect very clearly","Ta nhìn thấy toàn bộ con côn trùng rất rõ"],["It turned into a pattern in rock","Nó đã biến thành vết hình trong đá"]],a:1}

 {q:["Which of these is the standard unit for measuring force?","Đâu là đơn vị chuẩn (standard unit) để đo lực?"],o:[["Lines","Vạch (lines)"],["The newton (N)","Niu-tơn (N)"],["Centimetres (cm)","Xăng-ti-mét (cm)"]],a:1},
 {q:["On Earth, what is the weight of a 100 g mass?","Trên Trái Đất, trọng lượng (weight) của một quả cân 100 g là bao nhiêu?"],o:[["10 newtons","10 niu-tơn"],["100 newtons","100 niu-tơn"],["1 newton","1 niu-tơn"]],a:2},
 {q:["Zara's first forcemeter measures in lines. Why is measuring in standard units better?","Lực kế đầu tiên của Zara đo bằng vạch (lines). Vì sao đo bằng đơn vị chuẩn (standard units) lại tốt hơn?"],o:[["Because lines are too short to see","Vì vạch quá ngắn, khó nhìn"],["Because everyone in the world can compare measurements made in standard units","Vì mọi người trên thế giới đều so sánh được kết quả đo bằng đơn vị chuẩn"],["Because only Zara can read standard units","Vì chỉ Zara đọc được đơn vị chuẩn"]],a:1},
 {q:["Which way do things fall on the Earth?","Mọi vật trên Trái Đất rơi về hướng nào?"],o:[["Towards the Earth’s centre","Về phía tâm (centre) của Trái Đất"],["Straight down to the bottom of the picture, everywhere","Thẳng xuống phía dưới bức hình, ở mọi nơi"],["Away from the Earth, out into space","Ra xa khỏi Trái Đất, bay vào vũ trụ"]],a:0},
 {q:["How do we measure the weight of an object?","Ta đo trọng lượng (weight) của một vật bằng cách nào?"],o:[["With a ruler, in centimetres","Bằng thước kẻ, theo xăng-ti-mét"],["With a forcemeter, in newtons","Bằng lực kế (forcemeter), theo niu-tơn (newtons)"],["With a thermometer, in degrees","Bằng nhiệt kế, theo độ"]],a:1},
 {q:["A heavy book (3 N) and a light ball (2 N) drop from the same height at the same time. What happens?","Một quyển sách nặng (3 N) và một quả bóng nhẹ (2 N) rơi từ cùng một độ cao, cùng một lúc. Điều gì xảy ra?"],o:[["The book lands first, because it is heavier","Quyển sách chạm đất trước, vì nó nặng hơn"],["The ball lands first, because it is lighter","Quả bóng chạm đất trước, vì nó nhẹ hơn"],["They land at the same time","Chúng chạm đất cùng một lúc"]],a:2},
 {q:["Why do people near the bottom of the Earth not fall off?","Vì sao những người ở gần phía dưới của Trái Đất không bị rơi ra ngoài?"],o:[["Their shoes stick to the ground","Giày của họ dính chặt vào mặt đất"],["Gravity pulls them towards the Earth’s centre","Trọng lực (gravity) kéo họ về phía tâm của Trái Đất"],["The Earth is flat, so there is no bottom","Trái Đất phẳng, nên không có phía dưới"]],a:1},
 {q:["What does friction do to moving objects?","Ma sát (friction) làm gì với các vật đang chuyển động?"],o:[["It slows them down","Nó làm chúng chậm lại"],["It speeds them up","Nó làm chúng nhanh lên"],["It lifts them into the air","Nó nhấc chúng lên không trung"]],a:0},
 {q:["Where does friction happen?","Ma sát (friction) xảy ra ở đâu?"],o:[["Only inside the object","Chỉ ở bên trong vật"],["Where the surface of one object rubs over the surface of another","Nơi bề mặt của vật này cọ xát trên bề mặt của vật khác"],["Only in the air around the object","Chỉ ở trong không khí quanh vật"]],a:1},
 {q:["Why are you so fast on a water slide?","Vì sao con trượt rất nhanh trên cầu trượt nước?"],o:[["Because the slide is longer","Vì cầu trượt dài hơn"],["Because gravity stops working","Vì trọng lực ngừng hoạt động"],["Because the water makes the slide slippery — there is less friction","Vì nước làm cầu trượt trơn (slippery) — ma sát ít hơn"]],a:2},
 {q:["You pull the same shoe over carpet and over ice with a forcemeter. Which surface gives the BIGGER forcemeter number?","Con kéo cùng một chiếc giày trên thảm và trên băng bằng lực kế. Bề mặt nào cho số đo trên lực kế LỚN hơn?"],o:[["Ice — smooth surfaces grip more","Băng — bề mặt trơn bám hơn"],["Carpet — rough surfaces have more friction","Thảm — bề mặt nhám có nhiều ma sát hơn"],["Both give exactly the same number","Cả hai cho số đo y hệt nhau"]],a:1},
 {q:["What are the two poles of a magnet called?","Hai cực của một nam châm được gọi là gì?"],o:[["The east pole and the west pole","Cực đông và cực tây"],["The north pole and the south pole","Cực bắc (north pole) và cực nam (south pole)"],["The top pole and the bottom pole","Cực trên và cực dưới"]],a:1},
 {q:["Which pole of a magnet is often coloured red?","Cực nào của nam châm thường được sơn màu đỏ?"],o:[["The north pole","Cực bắc (north pole)"],["The south pole","Cực nam (south pole)"],["Magnets are never coloured","Nam châm không bao giờ được sơn màu"]],a:0},
 {q:["You push a north pole towards another north pole. What happens?","Con đẩy một cực bắc về phía một cực bắc khác. Điều gì xảy ra?"],o:[["They attract and snap together","Chúng hút nhau và dính chặt vào nhau"],["Nothing happens at all","Không có gì xảy ra cả"],["They repel — they push each other apart","Chúng đẩy nhau (repel) — chúng đẩy nhau ra xa"]],a:2},
 {q:["Which of these uses magnets to make things move?","Vật nào sau đây dùng nam châm để làm cho vật chuyển động?"],o:[["A wooden ruler","Một cây thước gỗ"],["An electric motor","Một động cơ điện (electric motor)"],["A plastic cup","Một chiếc cốc nhựa"]],a:1},
 {q:["Which material is magnetic?","Vật liệu nào có từ tính (magnetic)?"],o:[["Wood","Gỗ (wood)"],["Steel","Thép (steel)"],["Plastic","Nhựa (plastic)"]],a:1},
 {q:["Why did Sofia’s wooden car not move towards the magnet?","Vì sao ô tô gỗ của Sofia không chạy về phía nam châm (magnet)?"],o:[["The car was too heavy","Chiếc ô tô quá nặng"],["Wood is non-magnetic, so the magnet does not attract it","Gỗ không có từ tính (non-magnetic) nên nam châm không hút nó"],["The magnet was broken","Nam châm bị hỏng"]],a:1},
 {q:["Arun predicted aluminium would be magnetic. What did the test show?","Arun dự đoán nhôm (aluminium) sẽ có từ tính. Kiểm tra cho thấy điều gì?"],o:[["Aluminium is magnetic — it stuck to the magnet","Nhôm có từ tính — nó dính vào nam châm"],["Aluminium is non-magnetic — it stayed on the tray","Nhôm không có từ tính (non-magnetic) — nó ở yên trên khay"],["Aluminium melted","Nhôm bị chảy ra"]],a:1},
 {q:["What is the right conclusion from the pattern in the results?","Kết luận đúng rút ra từ quy luật (pattern) trong kết quả là gì?"],o:[["All metals are magnetic","Mọi kim loại đều có từ tính"],["All materials are magnetic","Mọi vật liệu đều có từ tính"],["Only some metals are magnetic, and materials that are not metals are non-magnetic","Chỉ một số kim loại có từ tính, còn vật liệu không phải kim loại thì không có từ tính"]],a:2}

 {q:["What shape are the Earth, the Sun and the Moon?","Trái Đất, Mặt Trời và Mặt Trăng có hình gì?"],o:[["They are all spheres","Cả ba đều là hình cầu (sphere)"],["They are all flat discs","Cả ba đều là đĩa phẳng"],["The Earth is a sphere, but the Sun is a cube","Trái Đất là hình cầu, còn Mặt Trời là hình khối lập phương"]],a:0},
 {q:["Why is each of the three bodies — Sun, Earth and Moon — a sphere?","Vì sao mỗi thiên thể trong ba thiên thể — Mặt Trời, Trái Đất và Mặt Trăng — là một hình cầu?"],o:[["The wind blew them round","Gió đã thổi chúng thành tròn"],["Gravity pulls everything towards the centre of each one","Trọng lực (gravity) kéo mọi vật về phía tâm (centre) của mỗi thiên thể"],["People shaped them long ago","Con người đã nặn chúng từ ngày xưa"]],a:1},
 {q:["Which body has the strongest gravity?","Thiên thể nào có trọng lực (gravity) mạnh nhất?"],o:[["The Moon","Mặt Trăng"],["The Earth","Trái Đất"],["The Sun","Mặt Trời"]],a:2},
 {q:["In the clay model, what do the pushes of the hands show?","Trong mô hình đất sét, những lần ấn của bàn tay tượng trưng cho điều gì?"],o:[["Gravity pulling towards the centre","Trọng lực (gravity) kéo về phía tâm (centre)"],["The wind pushing the Earth","Gió đang đẩy Trái Đất"],["A rocket pushing the Moon","Một tên lửa đang đẩy Mặt Trăng"]],a:0},
 {q:["What shape is the Moon’s orbit?","Quỹ đạo (orbit) của Mặt Trăng có hình gì?"],o:[["A circle","Một vòng tròn"],["A square","Một hình vuông"],["A straight line","Một đường thẳng"]],a:0},
 {q:["How many days does the Moon need for one full orbit of the Earth?","Mặt Trăng cần bao nhiêu ngày cho một vòng quỹ đạo (orbit) trọn quanh Trái Đất?"],o:[["1 day","1 ngày"],["29 days","29 ngày"],["365 days","365 ngày"]],a:1},
 {q:["Why does the Moon have craters?","Vì sao Mặt Trăng có các hố (crater)?"],o:[["Strong winds blew holes in the ground","Gió mạnh thổi thành các lỗ trên mặt đất"],["Astronauts dug them","Các phi hành gia đã đào chúng"],["Rocks from space crashed into the Moon","Đá từ vũ trụ đã đâm vào Mặt Trăng"]],a:2},
 {q:["In a scale model, 1000 km = 1 cm. The Earth is 13,000 km across. How wide is the model Earth?","Trong mô hình tỉ lệ (scale model), 1000 km = 1 cm. Trái Đất rộng 13.000 km. Trái Đất mô hình rộng bao nhiêu?"],o:[["130 cm","130 cm"],["13 cm","13 cm"],["1,300 cm","1.300 cm"]],a:1},
 {q:["Why does the Moon seem to change shape?","Vì sao Mặt Trăng trông như thay đổi hình dạng?"],o:[["The Earth’s shadow falls on the Moon and covers different parts of it","Bóng của Trái Đất đổ lên Mặt Trăng và che các phần khác nhau của nó"],["The Sun lights up half of the Moon — we see lots of the light part at some times and lots of the dark part at others","Mặt Trời chiếu sáng một nửa Mặt Trăng — có lúc ta thấy nhiều phần sáng, có lúc ta thấy nhiều phần tối"],["The Moon really changes shape, growing and shrinking","Mặt Trăng thật sự thay đổi hình dạng, phình ra và co lại"]],a:1},
 {q:["Night after night, the lit part of the Moon is getting bigger. The Moon is…","Đêm này qua đêm khác, phần sáng của Mặt Trăng ngày càng lớn. Mặt Trăng đang…"],o:[["Waning — the lit part is shrinking","Đang nhỏ dần (waning) — phần sáng đang thu hẹp"],["Waxing — the lit part is growing","Đang lớn dần (waxing) — phần sáng đang to ra"],["A new Moon","Trăng mới (new Moon)"]],a:1},
 {q:["At first quarter, how much of the Moon looks lit from Earth?","Ở pha thượng huyền (first quarter), bao nhiêu phần của Mặt Trăng trông sáng khi nhìn từ Trái Đất?"],o:[["All of it — the whole Moon is bright","Toàn bộ — cả Mặt Trăng đều sáng"],["None of it — it is completely dark","Không chút nào — nó tối hoàn toàn"],["Half of it","Một nửa"]],a:2},
 {q:["The Moon rises in the east and sets in the west every day. Why does it seem to move across the sky?","Mặt Trăng mỗi ngày mọc ở phía đông và lặn ở phía tây. Vì sao nó trông như di chuyển ngang bầu trời?"],o:[["The Moon races around the Earth once every day","Mặt Trăng phóng quanh Trái Đất một vòng mỗi ngày"],["Because the Earth rotates — we are the ones turning","Vì Trái Đất tự quay (rotate) — chính chúng ta là phía đang quay"],["The Sun pulls it across the sky","Mặt Trời kéo nó ngang qua bầu trời"]],a:1}
],
"sci4-u1":[
 {q:["What is a skeleton?","Bộ xương (skeleton) là gì?"],o:[["A frame of bones joined together inside the body","Một khung (frame) gồm các xương nối lại với nhau bên trong cơ thể"],["A kind of muscle","Một loại cơ"],["The skin of an animal","Da của một con vật"],["A model made of straws","Một mô hình (model) làm bằng ống hút"]],a:0},
 {q:["How many bones are there in the human skeleton?","Bộ xương người có bao nhiêu xương?"],o:[["26 bones","26 xương"],["106 bones","106 xương"],["206 bones","206 xương"],["620 bones","620 xương"]],a:2},
 {q:["Which bone moves when we chew food?","Xương nào cử động khi ta nhai thức ăn?"],o:[["The skull","Xương sọ (skull)"],["The jaw","Xương hàm (jaw)"],["The spine","Cột sống (spine)"],["The rib cage","Lồng ngực (rib cage)"]],a:1},
 {q:["How is a model skeleton different from a real skeleton?","Mô hình bộ xương khác bộ xương thật ở điểm nào?"],o:[["It is made of materials like straws and clay, not real bone","Nó làm bằng vật liệu như ống hút và đất nặn, không phải xương thật"],["It has no bones at all","Nó không có xương nào cả"],["It is alive","Nó đang sống"],["It is inside a body","Nó nằm bên trong một cơ thể"]],a:0},
 {q:["How does the skull protect the brain?","Xương sọ (skull) bảo vệ não (brain) như thế nào?"],o:[["It is a hard shell around the brain","Nó là một vỏ cứng bao quanh não"],["It makes the brain grow","Nó làm cho não lớn lên"],["It pumps blood to the brain","Nó bơm máu lên não"]],a:0},
 {q:["Which organs does the rib cage protect?","Lồng ngực (rib cage) bảo vệ những cơ quan (organs) nào?"],o:[["The stomach and the brain","Dạ dày và não"],["The heart and the lungs","Tim (heart) và phổi (lungs)"],["The muscles and the skin","Cơ bắp và da"]],a:1},
 {q:["Why do we measure bone lengths in centimetres and not in hand spans?","Vì sao ta đo chiều dài (length) xương bằng xăng-ti-mét mà không dùng gang tay?"],o:[["Centimetres are quicker to count","Xăng-ti-mét đếm nhanh hơn"],["Hands are prettier than rulers","Bàn tay đẹp hơn thước"],["A centimetre is a standard unit — the same for everyone; hands are different sizes","Xăng-ti-mét là đơn vị chuẩn (standard unit) — ai đo cũng giống nhau; bàn tay mỗi người một cỡ"]],a:2},
 {q:["Why do we get bigger as we grow older?","Vì sao ta lớn lên khi thêm tuổi?"],o:[["Because our skeleton grows","Vì bộ xương (skeleton) của ta lớn lên"],["Because we eat more sweets","Vì ta ăn nhiều kẹo hơn"],["Because our clothes stretch","Vì quần áo của ta giãn ra"]],a:0},
 {q:["How do muscles make our bones move?","Cơ làm xương của chúng ta cử động như thế nào?"],o:[["They pull on the bones","Cơ kéo (pull) xương"],["They push the bones along","Cơ đẩy xương đi"],["They bend the bones","Cơ bẻ cong xương"]],a:0},
 {q:["You lift a heavy book. The muscle at the front of your arm gets…","Con nâng một quyển sách nặng. Cơ ở phía trước cánh tay sẽ…"],o:[["longer and thinner","dài ra và thon lại"],["shorter and fatter","ngắn lại và phình to ra"],["longer and fatter","dài ra và phình to ra"]],a:1},
 {q:["Muscles work in pairs. The front muscle contracts to lift your arm. What does the back muscle do?","Cơ làm việc theo cặp (pair). Cơ phía trước co lại để nâng cánh tay. Cơ phía sau làm gì?"],o:[["It contracts and gets shorter too","Nó cũng co lại và ngắn lại"],["It lets go of the bone","Nó buông xương ra"],["It relaxes and gets longer","Nó giãn ra (relax) và dài ra"]],a:2},
 {q:["Amira and Jessie made a model arm from card, elastic bands and a split pin. In their model, what is the split pin?","Amira và Jessie làm mô hình cánh tay bằng bìa, dây thun và một chốt tách (split pin). Trong mô hình của hai bạn, chốt tách là gì?"],o:[["A muscle","Một cơ (muscle)"],["The joint","Khớp (joint)"],["The skin","Lớp da (skin)"]],a:1},
 {q:["Animals that keep their backbone inside the body are called…","Động vật giữ xương sống (backbone) bên trong cơ thể được gọi là…"],o:[["vertebrates","động vật có xương sống (vertebrates)"],["invertebrates","động vật không xương sống (invertebrates)"],["exoskeletons","bộ xương ngoài (exoskeletons)"]],a:0},
 {q:["Which animal has an exoskeleton?","Con vật nào có bộ xương ngoài (exoskeleton)?"],o:[["A frog","Một con ếch"],["A beetle","Một con bọ cánh cứng"],["A fish","Một con cá"]],a:1},
 {q:["A jellyfish has…","Một con sứa có…"],o:[["a backbone","một xương sống (backbone)"],["an exoskeleton","một bộ xương ngoài (exoskeleton)"],["no skeleton at all","không có bộ xương nào cả"]],a:2},
 {q:["What does an identification key do?","Khóa phân loại (identification key) dùng để làm gì?"],o:[["It helps you name an animal by answering questions","Nó giúp con gọi tên một con vật bằng cách trả lời các câu hỏi"],["It tells you what an animal eats","Nó cho biết con vật ăn gì"],["It counts the animal’s bones","Nó đếm xương của con vật"]],a:0},
 {q:["Why do we take medicines?","Vì sao ta uống thuốc (medicines)?"],o:[["To help us get better when we are ill","Để mau khỏe lại khi bị bệnh"],["To make our food taste nicer","Để thức ăn ngon hơn"],["So that we never feel tired","Để không bao giờ thấy mệt"]],a:0},
 {q:["A friend offers Mia his medicine because they have the same illness. What should Mia do?","Một người bạn đưa cho Mia thuốc của bạn ấy vì hai bạn mắc cùng một bệnh. Mia nên làm gì?"],o:[["Take it — it is the same illness","Uống đi — cùng một bệnh mà"],["Not take it — only a doctor, a nurse or a grown-up who looks after her should give her medicine","Không uống — chỉ bác sĩ, y tá hoặc người lớn chăm sóc bạn ấy mới được đưa thuốc"],["Take just a tiny bit","Uống một chút xíu thôi"]],a:1},
 {q:["What is an infectious disease?","Bệnh truyền nhiễm (infectious disease) là gì?"],o:[["A disease caused by germs that get into the body and make us ill","Bệnh do vi trùng (germs) xâm nhập vào cơ thể và làm ta ốm"],["A disease you get from eating too much","Bệnh do ăn quá nhiều"],["A broken bone","Gãy xương"]],a:0},
 {q:["How can vaccinations help the farmer’s chickens?","Tiêm chủng (vaccinations) giúp đàn gà của bác nông dân thế nào?"],o:[["They make the chickens lay more eggs","Làm gà đẻ nhiều trứng hơn"],["They can prevent the chickens from getting bird flu","Có thể phòng (prevent) cho gà khỏi cúm gia cầm (bird flu)"],["They make the chickens’ feathers grow bigger","Làm lông gà mọc to hơn"]],a:1}
],
"sci4-u2":[
 {q:["Where do our bodies get the energy we use?","Cơ thể ta lấy năng lượng mà ta dùng từ đâu?"],o:[["From the food we eat","Từ thức ăn (food) ta ăn"],["From the Moon","Từ Mặt Trăng"],["From standing very still","Từ việc đứng thật yên"],["From our shoes","Từ đôi giày của ta"]],a:0},
 {q:["Which list names only forms of energy?","Danh sách nào chỉ gồm các dạng năng lượng (forms of energy)?"],o:[["Tables, chairs and books","Bàn, ghế và sách"],["Light, heat and sound","Ánh sáng (light), nhiệt (heat) và âm thanh (sound)"],["Rocks, water and soil","Đá, nước và đất"],["Cats, dogs and birds","Mèo, chó và chim"]],a:1},
 {q:["A radio is playing music. What form of energy is it giving out?","Một chiếc radio đang phát nhạc. Nó cho ra dạng năng lượng nào?"],o:[["Heat energy","Năng lượng nhiệt (heat)"],["Light energy","Năng lượng ánh sáng (light)"],["Sound energy","Năng lượng âm thanh (sound)"],["Movement energy","Năng lượng chuyển động (movement)"]],a:2},
 {q:["You flick a ball gently and it stops at the 30 mark. Then you flick the same ball harder. What happens?","Con búng nhẹ một quả bóng và nó dừng ở vạch 30. Sau đó con búng cùng quả bóng đó mạnh hơn. Điều gì xảy ra?"],o:[["It stops sooner than before","Nó dừng sớm hơn lần trước"],["It does not move at all","Nó không chuyển động chút nào"],["It rolls backwards","Nó lăn ngược lại"],["It rolls further than before","Nó lăn xa hơn lần trước"]],a:3},
 {q:["What is an energy transfer?","Sự truyền năng lượng (energy transfer) là gì?"],o:[["Energy passing from one thing to another thing","Năng lượng chuyển từ vật này sang vật khác"],["Energy disappearing so that it is gone","Năng lượng biến mất hẳn"],["Energy being used up","Năng lượng bị dùng hết"],["Making new energy from nothing","Tạo ra năng lượng mới từ hư không"]],a:0},
 {q:["A cup of hot water is left standing on the table. Why does the water get colder?","Một cốc nước nóng để trên bàn. Vì sao nước nguội đi?"],o:[["Its heat energy transfers to the cup and the air around","Năng lượng nhiệt của nó truyền sang cốc và không khí xung quanh"],["The heat energy is used up and disappears","Năng lượng nhiệt bị dùng hết và biến mất"],["Cold energy flows in from the table","Năng lượng lạnh chảy vào từ mặt bàn"],["The water makes its own cold energy","Nước tự tạo ra năng lượng lạnh"]],a:0},
 {q:["In the bead investigation, which energy chain is correct?","Trong thí nghiệm hạt cườm, chuỗi năng lượng nào đúng?"],o:[["petroleum jelly → metal spoon → hot water","sáp dầu → thìa kim loại → nước nóng"],["hot water → metal spoon → petroleum jelly","nước nóng → thìa kim loại → sáp dầu"],["metal spoon → hot water → petroleum jelly","thìa kim loại → nước nóng → sáp dầu"],["hot water → petroleum jelly → metal spoon","nước nóng → sáp dầu → thìa kim loại"]],a:1},
 {q:["Zara wants to test a metal spoon and a plastic spoon fairly. What is the ONE thing she should change?","Zara muốn kiểm tra thìa kim loại và thìa nhựa một cách công bằng. Cô ấy nên thay đổi MỘT điều duy nhất nào?"],o:[["Everything — the drink, the spoon and the time","Mọi thứ — đồ uống, thìa và thời gian"],["Only the material the spoon is made of","Chỉ chất liệu làm thìa"],["Only how long each spoon stays in the drink","Chỉ thời gian mỗi thìa ngâm trong đồ uống"],["Nothing at all","Không thay đổi gì cả"]],a:1},
 {q:["A fan changes electrical energy into…","Quạt đổi năng lượng điện (electrical energy) thành…"],o:[["movement energy","năng lượng chuyển động (movement energy)"],["light energy","năng lượng ánh sáng (light energy)"],["heat energy only","chỉ năng lượng nhiệt (heat energy)"]],a:0},
 {q:["When you hit a drum, movement energy changes into…","Khi con gõ trống, năng lượng chuyển động (movement energy) đổi thành…"],o:[["electrical energy","năng lượng điện (electrical energy)"],["sound energy","năng lượng âm thanh (sound energy)"],["light energy","năng lượng ánh sáng (light energy)"]],a:1},
 {q:["A cup of hot tea gets cold because…","Một cốc trà nóng nguội đi vì…"],o:[["its heat energy is destroyed","năng lượng nhiệt của nó bị phá hủy (destroy)"],["its heat energy is used up","năng lượng nhiệt của nó bị dùng hết"],["its heat energy moves into the surrounding environment","năng lượng nhiệt của nó chuyển vào môi trường xung quanh (surrounding environment)"]],a:2},
 {q:["Which sentence about energy is true?","Câu nào về năng lượng là đúng?"],o:[["We can make new energy when we need it","Ta có thể tạo ra năng lượng mới khi cần"],["We cannot make energy or destroy energy","Ta không thể tạo ra năng lượng, cũng không thể phá hủy (destroy) năng lượng"],["Energy disappears when it is used","Năng lượng biến mất khi bị sử dụng"]],a:1},
 {q:["Why are plants called producers?","Vì sao cây được gọi là sinh vật sản xuất (producer)?"],o:[["Because they make their own food using light energy from the Sun","Vì chúng tự làm thức ăn bằng năng lượng ánh sáng từ Mặt Trời"],["Because they eat small insects","Vì chúng ăn côn trùng nhỏ"],["Because animals eat them","Vì động vật ăn chúng"],["Because they grow in soil","Vì chúng mọc trong đất"]],a:0},
 {q:["What do the arrows in a food chain show?","Các mũi tên trong chuỗi thức ăn (food chain) cho thấy điều gì?"],o:[["Which animal walks first","Con vật nào đi trước"],["The direction in which energy is transferred","Hướng năng lượng được truyền (transfer) đi"],["Which animal is the biggest","Con vật nào to nhất"],["Where the Sun shines","Nơi Mặt Trời chiếu sáng"]],a:1},
 {q:["A snail eats only plants. The snail is a…","Một con ốc sên chỉ ăn cây cỏ. Ốc sên là…"],o:[["carnivore","động vật ăn thịt (carnivore)"],["producer","sinh vật sản xuất (producer)"],["herbivore","động vật ăn cỏ (herbivore)"],["predator","kẻ săn mồi (predator)"]],a:2},
 {q:["An owl kills and eats a mouse. The owl is the ___ and the mouse is the ___.","Một con cú giết và ăn thịt một con chuột. Cú là ___ và chuột là ___."],o:[["prey · predator","con mồi (prey) · kẻ săn mồi (predator)"],["producer · consumer","sinh vật sản xuất (producer) · sinh vật tiêu thụ (consumer)"],["herbivore · carnivore","động vật ăn cỏ (herbivore) · động vật ăn thịt (carnivore)"],["predator · prey","kẻ săn mồi (predator) · con mồi (prey)"]],a:3}
],
"sci4-u3":[
 {q:["What is matter?","Vật chất (matter) là gì?"],o:[["Everything around us","Mọi thứ quanh ta"],["Only the things we can see","Chỉ những thứ ta nhìn thấy được"],["Only solids and liquids","Chỉ chất rắn và chất lỏng"],["Only very small particles","Chỉ các hạt rất nhỏ"]],a:0},
 {q:["Is glass a material or a substance?","Thủy tinh là vật liệu (material) hay là chất (substance)?"],o:[["A substance, because it is pure","Một chất, vì nó tinh khiết"],["A material, because it is made by mixing substances like sand, soda ash and limestone","Một vật liệu, vì nó được làm bằng cách trộn các chất như cát, soda ash và đá vôi"],["A particle, because it is very small","Một hạt (particle), vì nó rất nhỏ"],["A gas, because it can flow when it is hot","Một chất khí, vì nó chảy được khi nóng"]],a:1},
 {q:["In a solid, how are the particles arranged?","Trong một chất rắn (solid), các hạt (particle) được sắp xếp thế nào?"],o:[["Far apart, moving quickly in all directions","Cách xa nhau, chuyển động nhanh theo mọi hướng"],["Close together, sliding past each other and changing places","Ở gần nhau, trượt qua nhau và đổi chỗ"],["Packed tightly in neat, regular rows, with very small spaces between them","Xếp khít vào nhau theo trật tự đều đặn, với khoảng trống rất nhỏ giữa chúng"],["Completely still, never moving at all","Hoàn toàn đứng yên, không bao giờ chuyển động"]],a:2},
 {q:["You drop food dye into water and do NOT stir. The colour spreads through the water. Why?","Con nhỏ thuốc màu vào nước và KHÔNG khuấy. Màu lan ra khắp nước. Vì sao?"],o:[["The water pushes the colour downwards","Nước đẩy màu xuống dưới"],["The particles of the liquid move and carry the colour with them","Các hạt của chất lỏng (liquid) chuyển động và mang màu đi theo"],["The dye is heavier than the water","Thuốc màu nặng hơn nước"],["The beaker shakes the water","Cốc thí nghiệm làm rung nước"]],a:1},
 {q:["Why does a solid keep its shape?","Vì sao chất rắn (solid) giữ nguyên hình dạng của nó?"],o:[["Its particles are packed closely together in fixed positions","Các hạt của nó xếp khít vào nhau ở vị trí cố định"],["Its particles slide past one another","Các hạt của nó trượt qua nhau"],["It is not made of particles","Nó không được làm từ các hạt"],["Its particles are far apart and move very fast","Các hạt của nó ở xa nhau và chuyển động rất nhanh"]],a:0},
 {q:["You pour water from a jug into a wide bowl. What happens to the water?","Con rót nước từ một cái bình vào một cái bát to. Điều gì xảy ra với nước?"],o:[["It keeps the shape of the jug","Nó giữ hình dạng của cái bình"],["It turns into a solid","Nó biến thành chất rắn"],["It flows and takes the shape of the bowl","Nó chảy và mang hình dạng của cái bát"],["It stays in a heap in the middle","Nó đọng thành một đống ở giữa"]],a:2},
 {q:["Why can a liquid flow and change shape?","Vì sao chất lỏng (liquid) chảy được và đổi hình dạng được?"],o:[["Its particles are locked in fixed positions","Các hạt của nó bị khóa ở vị trí cố định"],["Its particles can slide past one another and change places","Các hạt của nó có thể trượt qua nhau và đổi chỗ"],["It is made of one very big particle","Nó được làm từ một hạt rất to"],["Its particles are joined together in stiff rows","Các hạt của nó gắn với nhau thành các hàng cứng"]],a:1},
 {q:["Sand is a solid — so why can we pour it, like a liquid?","Cát là chất rắn (solid) — vậy vì sao ta rót (pour) được nó, như chất lỏng?"],o:[["Sand is really a liquid","Cát thực ra là chất lỏng"],["The grains melt inside the funnel","Các hạt nhỏ tan chảy trong phễu"],["Sand has no particles","Cát không có hạt"],["Sand is a powder of tiny grains with air between them, so the grains can flow past one another","Cát là một loại bột (powder) gồm các hạt nhỏ (grain) tí hon với không khí ở giữa chúng, nên các hạt nhỏ chảy qua nhau được"]],a:3},
 {q:["A solid ice-cream left in the Sun turns into a runny liquid. This change of state is called…","Một cây kem ở trạng thái rắn để dưới nắng biến thành chất lỏng chảy được. Sự thay đổi trạng thái này gọi là…"],o:[["melting","nóng chảy (melting)"],["solidifying","đông đặc (solidifying)"],["disappearing","biến mất"],["burning","cháy"]],a:0},
 {q:["What happens to the particles in a solid when it is heated and melts?","Các hạt trong một chất rắn làm gì khi chất rắn được đun nóng và nóng chảy?"],o:[["They slow down and move closer together","Chúng chậm lại và xích lại gần nhau"],["They gain energy, move faster and move further apart","Chúng nhận thêm năng lượng, chuyển động nhanh hơn và tản ra xa nhau"],["They change into different particles","Chúng biến thành các hạt khác"],["They stop moving completely","Chúng ngừng chuyển động hoàn toàn"]],a:1},
 {q:["The water from melted ice is put into a freezer and turns back into ice. Has it become a different substance?","Nước từ đá tan được cho vào tủ đông và biến trở lại thành đá. Nó có trở thành một chất khác không?"],o:[["Yes — ice is a completely new substance","Có — đá là một chất hoàn toàn mới"],["No — it is still water; only its form (its state) changed","Không — nó vẫn là nước; chỉ hình dạng (trạng thái) của nó thay đổi"],["Yes — because it feels different","Có — vì cảm giác sờ vào khác hẳn"],["Yes — the particles turned into new particles","Có — các hạt đã biến thành hạt mới"]],a:1},
 {q:["For the melting race, the ice, butter and chocolate pieces are all the same size, in the same warm place, and checked at the same times. Why?","Trong cuộc đua nóng chảy, các miếng đá, bơ và sô-cô-la đều cùng kích thước, ở cùng một nơi ấm, và được kiểm tra vào cùng các mốc thời gian. Vì sao?"],o:[["So the chocolate wins the race","Để sô-cô-la thắng cuộc đua"],["So they all melt at exactly the same speed","Để tất cả nóng chảy với tốc độ y hệt nhau"],["To make it a fair test — the only difference is the kind of solid","Để phép thử công bằng — điểm khác biệt duy nhất là loại chất rắn"],["Because the saucers are the same colour","Vì các đĩa có cùng màu"]],a:2},
 {q:["What happens in a chemical reaction?","Điều gì xảy ra trong một phản ứng hóa học (chemical reaction)?"],o:[["The substances only change shape","Các chất chỉ thay đổi hình dạng"],["New substances form","Các chất mới (new substance) hình thành"],["Everything melts into a liquid","Mọi thứ đều tan chảy thành chất lỏng"],["The substances disappear","Các chất biến mất"]],a:1},
 {q:["Sofia leaves a metal nail in a saucer of water for three days. When she looks again, a reddish-brown substance covers the nail. What is the reddish-brown substance?","Sofia đặt một chiếc đinh kim loại vào đĩa nước. Sau ba ngày, chiếc đinh phủ một chất màu nâu đỏ. Chất màu nâu đỏ đó là gì?"],o:[["Dried water","Nước đã khô"],["Dirt from the air","Bụi bẩn từ không khí"],["Rust","Gỉ (rust)"],["Brown paint","Sơn nâu"]],a:2},
 {q:["Which of these changes is NOT a chemical reaction?","Thay đổi nào sau đây KHÔNG phải là phản ứng hóa học (chemical reaction)?"],o:[["Wood burning to ash","Củi cháy thành tro"],["Chocolate melting","Sô-cô-la tan chảy"],["Iron rusting","Sắt bị gỉ"],["Concrete setting hard","Bê tông đông cứng"]],a:1},
 {q:["What does iron or steel need, so that it can rust?","Sắt hoặc thép cần có gì để có thể bị gỉ (rust)?"],o:[["Only water","Chỉ nước"],["Only air","Chỉ không khí"],["Oil and paint","Dầu và sơn"],["Both water and air","Cả nước lẫn không khí"]],a:3}
],
"sci4-u4":[
 {q:["Which layer of the Earth do we live on?","Chúng ta sống trên lớp nào của Trái Đất?"],o:[["The mantle","Lớp phủ (mantle)"],["The crust","Vỏ (crust)"],["The outer core","Lõi ngoài (outer core)"],["The inner core","Lõi trong (inner core)"]],a:1},
 {q:["The mantle is full of rock that has melted and can move like a liquid. Melted rock inside the Earth is called…","Lớp phủ (mantle) chứa đá đã nóng chảy và có thể chuyển động như chất lỏng. Đá nóng chảy bên trong Trái Đất gọi là…"],o:[["magma","mắc-ma (magma)"],["ice","băng (ice)"],["sand","cát (sand)"],["fresh water","nước ngọt"]],a:0},
 {q:["The inner core is the hottest part of the Earth. Why is it solid, and not liquid?","Lõi trong (inner core) là phần nóng nhất của Trái Đất. Vì sao nó ở dạng rắn chứ không phải lỏng?"],o:[["Because it is really very cold","Vì nó thực ra rất lạnh"],["Because it is made of ice","Vì nó làm bằng băng"],["Because the pressure of all the layers above squeezes it into a solid","Vì áp suất của tất cả các lớp phía trên ép nó thành chất rắn"],["Because the Sun cannot reach it","Vì Mặt Trời không chiếu tới được nó"]],a:2},
 {q:["No one has ever seen the inside of the Earth. How do scientists know the outer core flows like a liquid while the centre is solid?","Chưa ai từng nhìn thấy bên trong Trái Đất. Làm sao các nhà khoa học biết lõi ngoài là lỏng và lõi trong là rắn?"],o:[["They drilled a hole all the way to the centre","Họ đã khoan một lỗ tới tận tâm Trái Đất"],["They cut the Earth in half and looked","Họ bổ đôi Trái Đất ra và nhìn"],["Divers swam down and checked","Thợ lặn bơi xuống kiểm tra"],["They study earthquake waves travelling through the Earth","Họ nghiên cứu sóng động đất (earthquake waves) truyền qua Trái Đất"]],a:3},
 {q:["Magma that has burst out onto the surface of the Earth is called…","Magma đã trào ra bề mặt Trái Đất được gọi là…"],o:[["lava","dung nham (lava)"],["ash","tro (ash)"],["crust","lớp vỏ (crust)"],["smoke","khói"]],a:0},
 {q:["What is the vent of a volcano?","Ống dẫn (vent) của núi lửa là gì?"],o:[["The bowl-shaped hole at the very top","Cái hố hình bát ở trên đỉnh"],["The central pipe that magma travels up","Ống trung tâm mà magma đi lên qua đó"],["A baby volcano on the side","Một núi lửa con ở bên sườn"],["A flat layer of cooled lava","Một lớp dung nham đã nguội và phẳng"]],a:1},
 {q:["A composite volcano is built up from layers of…","Một núi lửa hỗn hợp (composite volcano) được tạo thành từ các lớp…"],o:[["sand and soil","cát và đất"],["water and ice","nước và đá"],["ash and lava","tro (ash) và dung nham (lava)"],["wood and leaves","gỗ và lá"]],a:2},
 {q:["Why are there so many volcanoes around the Pacific Ocean?","Vì sao quanh Thái Bình Dương lại có nhiều núi lửa như vậy?"],o:[["Because the ocean water is boiling hot","Vì nước biển ở đó sôi nóng"],["Because it rains there every day","Vì ở đó ngày nào cũng mưa"],["Because the ocean is the deepest of all","Vì đại dương đó sâu nhất"],["Because there are many cracks (breaks) in the crust there","Vì ở đó có nhiều vết nứt (chỗ vỡ) trong lớp vỏ (crust)"]],a:3},
 {q:["What causes an earthquake?","Nguyên nhân nào gây ra động đất (earthquake)?"],o:[["Rocks in the Earth's crust moving suddenly","Đá trong lớp vỏ (crust) của Trái Đất chuyển động đột ngột"],["Very strong winds blowing for many days","Gió rất mạnh thổi trong nhiều ngày"],["The Moon pulling on the sea","Mặt Trăng kéo nước biển"],["The Sun heating the ground","Mặt Trời làm nóng mặt đất"]],a:0},
 {q:["What is the epicentre of an earthquake?","Tâm chấn trên mặt đất (epicentre) của một trận động đất là gì?"],o:[["The place deep in the crust where the earthquake starts","Nơi sâu trong lớp vỏ, nơi trận động đất bắt đầu"],["The place on the surface directly above the focus","Điểm trên mặt đất nằm ngay phía trên tâm chấn sâu (focus)"],["A huge wave in the sea","Một con sóng khổng lồ trên biển"],["The middle of the Pacific Ring of Fire","Phần giữa của Vành đai Lửa Thái Bình Dương"]],a:1},
 {q:["Where do most earthquakes in the world happen?","Phần lớn động đất trên thế giới xảy ra ở đâu?"],o:[["In hot, dry deserts","Ở các sa mạc nóng và khô"],["Under the North Pole","Dưới Bắc Cực"],["In the Pacific Ring of Fire","Ở Vành đai Lửa Thái Bình Dương (Pacific Ring of Fire)"],["Only in Chile","Chỉ ở Chile"]],a:2},
 {q:["What is a tsunami?","Sóng thần (tsunami) là gì?"],o:[["Soil and mud sliding down a slope","Đất và bùn trượt xuống sườn dốc"],["A huge sea wave started by an earthquake under the sea","Một con sóng biển khổng lồ bắt đầu từ một trận động đất dưới biển"],["A crack that bends a railway line","Một vết nứt làm cong đường ray"],["A small wave that children surf on","Một con sóng nhỏ để trẻ em lướt sóng"]],a:1},
 {q:["What do fish use to breathe underwater?","Cá dùng gì để thở dưới nước?"],o:[["Gills","Mang (gills)"],["Fins","Vây (fins)"],["Their eyes","Đôi mắt của chúng"],["Their tails","Đuôi của chúng"]],a:0},
 {q:["A kingfisher's beak is large, with a sharp point. What does the beak help it do?","Mỏ của chim bói cá (kingfisher) lớn, với một đầu nhọn sắc. Chiếc mỏ giúp nó làm gì?"],o:[["Crack open seeds","Tách vỡ hạt (crack open)"],["Dig into the ground for worms","Đào xuống đất tìm giun"],["Catch fish in rivers","Bắt cá ở sông"],["Strain tiny plants out of the water","Lọc (strain) những cây nhỏ ra khỏi nước"]],a:2},
 {q:["Why is it good to repeat bird observations on different days?","Vì sao lặp lại việc quan sát chim vào những ngày khác nhau lại tốt?"],o:[["The birds learn your name","Các con chim học thuộc tên của con"],["It gives more reliable data","Nó cho dữ liệu đáng tin cậy hơn"],["The birds always sit still","Các con chim luôn ngồi yên"],["It makes the birds fly away","Nó làm các con chim bay đi"]],a:1},
 {q:["Orchids grow naturally in hot, wet forests. How can an orchid survive in a pot in a home?","Cây lan (orchid) mọc tự nhiên trong rừng nóng, ẩm. Làm thế nào cây lan có thể sống sót trong chậu ở nhà?"],o:[["It never needs any water","Nó không bao giờ cần nước"],["It eats insects from the air","Nó ăn côn trùng từ không khí"],["It changes into a different plant","Nó biến thành một cây khác"],["People water it and keep it warm","Con người tưới nước cho nó và giữ ấm cho nó"]],a:3}
],
"sci4-u5":[
 {q:["A coin is inside a dark box. The flashlight shines in. Why can you see the coin now?","Một đồng xu ở trong chiếc hộp tối. Đèn pin chiếu vào. Vì sao bây giờ con nhìn thấy đồng xu?"],o:[["The coin makes its own light","Đồng xu tự phát ra ánh sáng"],["Light reflects off the coin into your eyes","Ánh sáng phản xạ (reflect) khỏi đồng xu vào mắt con"],["Your eyes send light to the coin","Mắt con gửi ánh sáng tới đồng xu"],["The coin glows in the dark by itself","Đồng xu tự phát sáng trong bóng tối"]],a:1},
 {q:["What happens if a room is in total darkness, with no light at all?","Điều gì xảy ra nếu một căn phòng tối hoàn toàn, không có chút ánh sáng nào?"],o:[["Objects glow softly so we can see them","Các vật phát sáng nhẹ để ta nhìn thấy"],["Our eyes send out light to the objects","Mắt ta gửi ánh sáng tới các vật"],["Nothing can be seen, because no light reflects off objects into our eyes","Không nhìn thấy gì cả, vì không có ánh sáng nào phản xạ khỏi các vật vào mắt ta"],["We can still see all the colours","Ta vẫn nhìn thấy mọi màu sắc"]],a:2},
 {q:["Which of these is a source of light?","Vật nào sau đây là nguồn sáng (source)?"],o:[["The Sun","Mặt Trời (Sun)"],["A mirror","Một cái gương (mirror)"],["A book","Một quyển sách"],["The Moon","Mặt Trăng"]],a:0},
 {q:["In the evening, a person looks at a car under a street lamp. How does the person see the car?","Vào buổi tối, một người ngắm một chiếc ô tô dưới đèn đường. Người đó nhìn thấy ô tô bằng cách nào?"],o:[["The person's eyes light up the car","Mắt của người đó thắp sáng ô tô"],["The car reflects the person's eyes","Ô tô phản xạ mắt của người đó"],["Darkness helps us to see cars","Bóng tối giúp ta nhìn thấy ô tô"],["Light from the lamp reflects off the car into the person's eyes","Ánh sáng từ đèn đường phản xạ (reflect) khỏi ô tô vào mắt người đó"]],a:3},
 {q:["How does light travel from a light source?","Ánh sáng đi từ nguồn sáng như thế nào?"],o:[["In straight lines called rays","Theo đường thẳng, gọi là tia (rays)"],["In curvy, wiggly lines","Theo đường cong ngoằn ngoèo"],["Only downwards","Chỉ đi xuống dưới"]],a:0},
 {q:["Sofia shines a flashlight down a bent tube. Why can Zara not see the light?","Sofia chiếu đèn pin qua một ống cong. Vì sao Zara không nhìn thấy ánh sáng?"],o:[["The tube is too dark inside","Trong ống tối quá"],["Light travels in straight lines, so it cannot follow the bend","Ánh sáng đi theo đường thẳng nên không đi theo khúc cong được"],["The flashlight has stopped working","Đèn pin đã hỏng"]],a:1},
 {q:["On a ray diagram, the ray that bounces off an object is called…","Trên sơ đồ tia sáng (ray diagram), tia bật ra khỏi một vật được gọi là…"],o:[["a light ray","một tia sáng"],["an arriving ray","tia tới (arriving ray)"],["a reflected ray","tia phản xạ (reflected ray)"]],a:2},
 {q:["Light rays travel from a light source…","Các tia sáng đi từ nguồn sáng…"],o:[["only as far as our eyes","chỉ tới mắt của ta"],["in straight lines downwards only","chỉ theo đường thẳng đi xuống"],["out in every direction, stopping when they hit something","ra mọi hướng, cho tới khi gặp một vật"]],a:2},
 {q:["How do you see the person sitting next to you?","Con nhìn thấy người ngồi bên cạnh mình bằng cách nào?"],o:[["Your eyes shine light onto the person","Mắt của con chiếu ánh sáng lên người đó"],["Light reflects off the person and travels into your eyes","Ánh sáng phản chiếu (reflect) từ người đó và đi vào mắt con"],["You see the person with your ears","Con nhìn thấy người đó bằng tai"],["The person glows in the dark","Người đó phát sáng trong bóng tối"]],a:1},
 {q:["Which surface reflects light best?","Bề mặt nào phản chiếu ánh sáng tốt nhất?"],o:[["A wooden chopping board","Một chiếc thớt gỗ"],["A piece of cardboard","Một miếng bìa cứng (cardboard)"],["A mirror","Một chiếc gương (mirror)"],["A sheet of white paper","Một tờ giấy trắng"]],a:2},
 {q:["In the investigation, a surface scored 0 for reflection. What does the score 0 mean?","Trong khảo sát, một bề mặt đạt 0 điểm về phản chiếu. Điểm 0 nghĩa là gì?"],o:[["A perfect reflection","Phản chiếu hoàn hảo"],["A fairly good reflection","Phản chiếu khá tốt"],["A poor reflection","Phản chiếu kém"],["No reflection at all — the surface absorbs the light","Không phản chiếu chút nào — bề mặt hấp thụ (absorb) ánh sáng"]],a:3},
 {q:["Paper looks smooth and flat. Why can’t you see your reflection in a piece of paper?","Giấy trông nhẵn và phẳng. Vì sao con không thể thấy hình phản chiếu của mình trong một tờ giấy?"],o:[["Because paper is white","Vì giấy có màu trắng"],["Because under a microscope, paper is full of tiny bumps, so it absorbs more light than it reflects","Vì dưới kính hiển vi, giấy đầy những gồ ghề rất nhỏ, nên nó hấp thụ (absorb) nhiều ánh sáng hơn là phản chiếu"],["Because paper is too thin","Vì giấy quá mỏng"],["Because only round things reflect light","Vì chỉ những vật tròn mới phản chiếu ánh sáng"]],a:1},
 {q:["The Sun is a star. What does the Sun do that the planets do not do?","Mặt Trời là một ngôi sao. Mặt Trời làm được điều gì mà các hành tinh không làm được?"],o:[["It reflects light from other bodies","Nó phản chiếu ánh sáng từ các thiên thể khác"],["It gives out its own light","Nó tự phát ra ánh sáng của chính mình"],["It orbits the Earth","Nó quay quanh Trái Đất"],["It has moons travelling around it","Nó có các mặt trăng đi quanh nó"]],a:1},
 {q:["How long does the Moon take to travel once around the Earth?","Mặt Trăng mất bao lâu để đi một vòng quanh Trái Đất?"],o:[["29 days — about one month","29 ngày — khoảng một tháng"],["365¼ days — one year","365¼ ngày — một năm"],["24 hours — one day","24 giờ — một ngày"],["88 days","88 ngày"]],a:0},
 {q:["Where are nearly all the asteroids in our solar system?","Gần như toàn bộ các tiểu hành tinh trong hệ Mặt Trời nằm ở đâu?"],o:[["Travelling around the Moon","Đi quanh Mặt Trăng"],["Hidden inside the Sun","Ẩn bên trong Mặt Trời"],["In a belt between Mars and Jupiter","Trong một vành đai giữa Sao Hỏa và Sao Mộc"],["Floating above the Earth","Trôi phía trên Trái Đất"]],a:2},

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  let lessonStars = 0, prodTotal = 0, prodDone = 0;
  Object.values(DATA).forEach(books => Object.values(books).forEach(units => units.forEach(u => u.items.forEach(it => {
    if (it.file){ const p = getProgress(it); lessonStars += starsOf(p); }
  }))));
  $("starVl").textContent = (isBypass() ? "🔓 " : "") + "⭐ " + (lessonStars + wallet.stars);
  $("starBr").textContent = S("starBr")(lessonStars, wallet.stars);
  /* map */
  const map = $("map"); map.className = "map " + (view.tab === "science" ? "sci" : "math"); map.innerHTML = "";
  const units = (DATA[view.tab] || {})[view.book];
  if (!units){ map.innerHTML = '<div class="soonbox"><span class="e">🚀</span>' + S("soon") + "</div>";
    $("ringPc").textContent = "0%"; $("ringFg").style.strokeDashoffset = 169.6; $("goalD").textContent = S("goalD")(0,0); return; }
  /* sequential unlock over produced lessons in book order */
  const flat = []; units.forEach(u => u.items.forEach(it => flat.push(it)));
  const produced = flat.filter(it => it.file);
  produced.forEach(it => { const p = getProgress(it); if (p){ prodTotal++; if (complete(p)) prodDone++; } else prodTotal++; });
  const pct = produced.length ? Math.round(100 * produced.filter(it => complete(getProgress(it))).length / produced.length) : 0;
  $("ringPc").textContent = pct + "%"; $("ringFg").style.strokeDashoffset = (169.6 * (1 - pct/100)).toFixed(1);
  $("ringFg").style.stroke = view.tab === "science" ? "#0d9488" : "#4f46e5";
  $("goalD").textContent = S("goalD")(produced.filter(it => complete(getProgress(it))).length, produced.length);
  let prevComplete = true, firstProduced = true;
  const openMap = {};

  if (isBypass()) produced.forEach(it => { openMap[it.code] = true; });

  units.forEach(u => {

    const unitProduced = u.items.filter(it => it.file);

    const bossWon = !!wallet.bossWins[bossKey];
    const rib = document.createElement("div"); rib.className = "ribbon";

    sec.appendChild(rib);
    const rows = u.items.length + ((unitProduced.length === u.items.length && BANKS[bossKey]) ? 1 : 0);

      node.innerHTML = (st === "st-cur" ? '<div class="candypin">🍭</div>' : "") + '<div class="bubble">' + face + '</div>' +
        (st3 > 0 ? '<div class="st3">' + "★".repeat(st3) + '<span class="off">' + "☆".repeat(3 - st3) + "</span></div>" : "") +
        '<div class="lb2">' + it.code + " " + (LANG === "vi" ? it.vi : it.en) + "</div>";

      bn.innerHTML = '<div class="bubble">' + (bossWon ? "🏆" : "👹") + '</div><div class="lb2">' + S("boss") + "</div>";
      bn.onclick = () => { if (!unitAllDone && !bossWon){ bn.classList.remove("shake"); void bn.offsetWidth; bn.classList.add("shake"); toast(S("bossLocked")); return; } openBoss(bossKey, u.u); };
      path.appendChild(bn);
    }
    sec.appendChild(path); map.appendChild(sec);
  });
  requestAnimationFrame(drawRoads);
}
/* Smooth saga road, drawn exactly like toan.b-media.vn: measure the real node
   centres after layout, join them with vertical-tangent cubic curves,
   white 34px at 55% + pink dotted centre line. */
function drawRoads(){
  document.querySelectorAll(".path").forEach(path => {
    const svg = path.querySelector("svg"); if (!svg) return;
    const circles = path.querySelectorAll(".bubble"); if (circles.length < 2) { svg.innerHTML = ""; return; }
    const rr = path.getBoundingClientRect();
    const pts = [...circles].map(c => { const r = c.getBoundingClientRect();
      return [r.left - rr.left + r.width / 2, r.top - rr.top + r.height / 2]; });
    svg.setAttribute("viewBox", "0 0 " + rr.width + " " + rr.height);
    let d = "M " + pts[0][0] + " " + pts[0][1];
    for (let i = 1; i < pts.length; i++){
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1];
      const my = (y0 + y1) / 2;
      d += " C " + x0 + " " + my + ", " + x1 + " " + my + ", " + x1 + " " + y1;
    }
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.55"/>' +
      '<path d="' + d + '" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.9"/>';
  });
}

let boss = null;
function openBoss(key, unitNo){
  boss = { key, unitNo, qs: shuffle(BANKS[key]).slice(0, 8), idx: 0, me: 0, bo: 0, hearts: 3, phase: "intro", order: null };

}
function closeBoss(){ $("bossModal").classList.remove("open"); boss = null; render(); }
function heartsStr(){ return "❤️".repeat(boss.hearts) + "🖤".repeat(3 - boss.hearts); }
function renderBoss(){
  const box = $("bossBox");

    box.innerHTML = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bq" style="font-weight:700;font-size:15.5px">' + S("bossIntro") +
      '</div><button class="bbtn go" id="bStart">' + S("start") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bStart").onclick = () => { boss.phase = "q"; boss.order = shuffle(boss.qs[0].o.map((_, i) => i)); renderBoss(); };
    $("bClose").onclick = closeBoss; return;
  }
  if (boss.phase === "end"){
    const won = boss.result === "win"; const w = loadWallet(); const again = won && !boss.firstWin;
    box.innerHTML = '<div class="bres"><div class="e">' + (won ? "🏆" : "👹") + '</div><div class="t">' + (won ? S("win") : S("lose")) +
      '</div><div class="d">' + (won ? S("winD")(again) : S("loseD")) + "<br>" + S("qOf")(boss.qs.length, boss.qs.length, boss.me, boss.bo, heartsStr()) +
      '</div></div><button class="bbtn go" id="bAgain">' + S("again") + '</button> <button class="bbtn ghost" id="bClose">' + S("close") + "</button>";
    $("bAgain").onclick = () => openBoss(boss.key, boss.unitNo);
    $("bClose").onclick = closeBoss; return;
  }
  const q = boss.qs[boss.idx];
  let html = "<h2>" + S("bossTitle")(boss.unitNo) + '</h2><div class="bprog">' + S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr()) + "</div>";
  html += '<div class="bq">' + txt(q.q) + "</div>";
  boss.order.forEach(oi => { html += '<button class="bopt" data-oi="' + oi + '">' + txt(q.o[oi]) + "</button>"; });
  html += '<div class="breveal" id="bRev"></div><div id="bNext"></div>';
  box.innerHTML = html;
  box.querySelectorAll(".bopt").forEach(btn => btn.onclick = () => answerBoss(parseInt(btn.dataset.oi, 10)));
}
function answerBoss(oi){
  const q = boss.qs[boss.idx]; const right = oi === q.a;
  if (right) boss.me++; else boss.hearts--;
  const bossRight = Math.random() < 0.75;
  let bossPick = q.a;
  if (!bossRight){ const wrongs = q.o.map((_, i) => i).filter(i => i !== q.a); bossPick = wrongs[Math.floor(Math.random() * wrongs.length)]; }
  if (bossRight) boss.bo++;
  const box = $("bossBox");
  box.querySelectorAll(".bopt").forEach(btn => { const b = parseInt(btn.dataset.oi, 10); btn.disabled = true;
    if (b === q.a) btn.classList.add("right"); else if (b === oi) btn.classList.add("wrong"); });
  const rev = $("bRev"); rev.style.display = "block";
  rev.innerHTML = (right ? S("right") : S("wrong")) + "<br>" + (bossRight ? S("bossRight")(txt(q.o[bossPick])) : S("bossWrong")(txt(q.o[bossPick])));
  const prog = box.querySelector(".bprog"); if (prog) prog.textContent = S("qOf")(boss.idx + 1, boss.qs.length, boss.me, boss.bo, heartsStr());
  if (boss.hearts <= 0){ boss.phase = "end"; boss.result = "lose"; setTimeout(renderBoss, 900); return; }
  $("bNext").innerHTML = '<button class="bbtn go" id="bNx">' + S("next") + "</button>";
  $("bNx").onclick = () => { boss.idx++;
    if (boss.idx >= boss.qs.length){ boss.phase = "end";
      if (boss.me > boss.bo){ boss.result = "win"; const w = loadWallet();
        if (!w.bossWins[boss.key]){ w.bossWins[boss.key] = true; w.stars += 3; saveWallet(w); boss.firstWin = true; } }
      else boss.result = "lose";
      renderBoss(); return; }
    boss.order = shuffle(boss.qs[boss.idx].o.map((_, i) => i)); renderBoss(); };
}
$("bossModal").addEventListener("click", e => { if (e.target === $("bossModal")) closeBoss(); });
