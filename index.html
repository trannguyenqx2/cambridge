<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge · B-Media — Science & Maths Adventure / Bản đồ học tập</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fdf3f7; color: #26313f; min-height: 100vh; }
  body.subj-maths { background: #fdf3f7; }
  body.subj-science { background: #eefaf3; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; background: #fff; box-shadow: 0 1px 6px rgba(20,40,80,.09); position: sticky; top: 0; z-index: 20; }
  .brand { font-size: 21px; font-weight: 800; white-space: nowrap; }
  .brand span { color: #e84393; }
  body.subj-science .brand span { color: #0aa06e; }
  .langbar { display: flex; border: 2px solid #e84393; border-radius: 999px; overflow: hidden; flex: none; }
  body.subj-science .langbar { border-color: #0aa06e; }
  .langbar button { border: 0; background: #fff; color: #e84393; font-weight: 700; font-size: 13px; padding: 6px 12px; cursor: pointer; }
  body.subj-science .langbar button { color: #0aa06e; }
  .langbar button.on { background: #e84393; color: #fff; }
  body.subj-science .langbar button.on { background: #0aa06e; }
  .vi { display: block; font-size: .76em; color: #8494a9; font-weight: 600; margin-top: 1px; }
  body.lang-en .vi { display: none; }
  body.lang-vi .en-main { display: none; }
  body.lang-vi .vi { font-size: 1em; color: inherit; font-weight: inherit; margin-top: 0; }
  /* Tabs */
  .tabs { display: flex; gap: 12px; max-width: 560px; margin: 16px auto 0; padding: 0 14px; }
  .tab { flex: 1; border: 0; cursor: pointer; border-radius: 18px; padding: 13px 10px; font-size: 19px; font-weight: 800; color: #fff; background: #c9d4e2; box-shadow: 0 3px 0 rgba(0,0,0,.12); transition: transform .1s; }
  .tab small { display: block; font-size: 12px; font-weight: 600; opacity: .9; }
  .tab:active { transform: scale(.98); }
  .tab.on[data-subj="science"] { background: linear-gradient(135deg, #0aa06e, #0d9488); }
  .tab.on[data-subj="maths"] { background: linear-gradient(135deg, #e84393, #d6336c); }
  /* Book chips */
  .books { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 620px; margin: 14px auto 2px; padding: 0 12px; }
  .book { border: 2px solid #dbe4ee; background: #fff; color: #41546b; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .book.on { border-color: #e84393; background: #e84393; color: #fff; }
  body.subj-science .book.on { border-color: #0aa06e; background: #0aa06e; }
  .book .dot { font-size: 10px; vertical-align: super; }
  .starbar { text-align: center; font-size: 16px; font-weight: 800; color: #7a5b00; margin: 10px 0 0; }
  .starbar .n { color: #e8a100; }
  /* Map */
  .mapwrap { max-width: 520px; margin: 6px auto 70px; padding: 8px 10px 30px; position: relative; }
  .map { position: relative; }
  .map svg.wire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .map svg.wire path { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 1 18; opacity: .95; filter: drop-shadow(0 1px 1px rgba(0,0,0,.06)); }
  .urow { height: 46px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; }
  .unit-ribbon { background: linear-gradient(135deg, #6a3df0, #4f46e5); color: #fff; font-weight: 800; font-size: 15px; border-radius: 999px; padding: 7px 18px; box-shadow: 0 3px 8px rgba(60,40,160,.25); text-align: center; }
  body.subj-science .unit-ribbon { background: linear-gradient(135deg, #0aa06e, #067a54); }
  .nrow { height: 124px; position: relative; z-index: 2; }
  .node { position: absolute; top: 8px; transform: translateX(-50%); width: 74px; text-align: center; cursor: pointer; background: none; border: 0; font-family: inherit; }
  .ball { width: 62px; height: 62px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #fff; border: 4px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 16px rgba(0,0,0,.12); position: relative; }
  .node .stars { height: 17px; font-size: 14px; letter-spacing: 2px; color: #f6b73c; text-shadow: 0 1px 0 #fff; margin-bottom: 1px; }
  .node .stars .off { color: #d7dee8; }
  .node .lab { margin-top: 4px; font-size: 13.5px; font-weight: 700; line-height: 1.15; color: #33475e; }
  .node .lab .code { color: #8494a9; font-weight: 800; }
  .st-done .ball { background: radial-gradient(circle at 32% 30%, #ffe082, #f6b73c); color: #7a4d00; }
  .st-open .ball { background: radial-gradient(circle at 32% 30%, #7ee2b8, #0aa06e); animation: pulse 1.6s infinite; }
  body.subj-maths .st-open .ball { background: radial-gradient(circle at 32% 30%, #ff9ecb, #e84393); }
  .st-prog .ball { background: radial-gradient(circle at 32% 30%, #a5d8ff, #4dabf7); }
  .st-lock .ball { background: radial-gradient(circle at 32% 30%, #dbe4ee, #aebdd0); color: #8494a9; font-size: 21px; }
  .st-soon .ball { background: #fff; border: 4px dashed #c3cedd; color: #aebdd0; font-size: 19px; box-shadow: none; }
  .st-soon { cursor: default; }
  .st-lock { cursor: not-allowed; }
  @keyframes pulse { 0% { box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 0 0 0 rgba(10,160,110,.45);} 70% { box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 0 0 15px rgba(10,160,110,0);} 100% { box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 0 0 0 rgba(10,160,110,0);} }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(-50%);} 25%{transform:translateX(calc(-50% - 6px));} 75%{transform:translateX(calc(-50% + 6px));} }
  .deco { position: absolute; font-size: 30px; opacity: .8; z-index: 1; pointer-events: none; }
  .empty { text-align: center; padding: 46px 22px; background: #fff; border-radius: 22px; box-shadow: 0 3px 12px rgba(20,40,80,.08); margin-top: 18px; }
  .empty .big { font-size: 44px; }
  .empty h3 { margin: 8px 0 4px; font-size: 19px; }
  .empty p { color: #8494a9; font-size: 15px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(80px); background: #26313f; color: #fff; font-size: 15px; font-weight: 700; padding: 11px 18px; border-radius: 999px; box-shadow: 0 8px 22px rgba(0,0,0,.3); transition: transform .25s; z-index: 50; max-width: 92vw; text-align: center; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  footer { text-align: center; color: #9aa7b8; font-size: 12.5px; padding: 14px 10px 26px; }
</style>
</head>
<body class="lang-bi subj-science">
<header>
  <div class="brand">🎓 Cambridge <span>· B-Media</span></div>
  <div class="langbar" role="group" aria-label="Language">
    <button data-lang="en">EN</button>
    <button data-lang="bi" class="on">EN+VI</button>
    <button data-lang="vi">VI</button>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-subj="science">🔬 Science<small><span class="en-main">Science</span><span class="vi">Khoa học</span></small></button>
  <button class="tab" data-subj="maths">➕ Maths<small><span class="en-main">Mathematics</span><span class="vi">Toán học</span></small></button>
</div>

<div class="books" id="books"></div>
<div class="starbar" id="starbar"></div>
<div class="mapwrap"><div class="map" id="map"></div></div>
<div id="toast"></div>
<footer>Cambridge Primary · Interactive lessons based on the Cambridge Learner's Books · B-Media</footer>

<script>
var DATA = {
  science: {
    1: { units: [
      { t: 'Unit 1 · Living things', vi: 'Sinh vật sống', lessons: [
        { c: '1.1', t: 'Animals and plants alive!', vi: 'Động vật và cây cối đều sống', f: 'sci1-1-1-animals-and-plants-alive.html' },
        { c: '1.2', t: 'Parts of a plant', vi: 'Các bộ phận của cây', f: 'sci1-1-2-parts-of-a-plant.html' },
        { c: '1.3', t: 'Plants and light', vi: 'Cây và ánh sáng', f: 'sci1-1-3-plants-and-light.html' },
        { c: '1.4', t: 'Plants need water', vi: 'Cây cần nước', f: 'sci1-1-4-plants-need-water.html' } ] },
      { t: 'Unit 2 · Sound', vi: 'Âm thanh', lessons: [
        { c: '2.1', t: 'Sound sources', vi: 'Nguồn âm thanh', f: 'sci1-2-1-sound-sources.html' },
        { c: '2.2', t: 'Loud and quiet', vi: 'To và nhỏ', f: 'sci1-2-2-loud-and-quiet.html' },
        { c: '2.3', t: 'Sound moves', vi: 'Âm thanh di chuyển', f: 'sci1-2-3-sound-moves.html' } ] },
      { t: 'Unit 3 · Materials in my world', vi: 'Vật liệu quanh em', lessons: [
        { c: '3.1', t: 'Different materials', vi: 'Các vật liệu khác nhau', f: null },
        { c: '3.2', t: 'Properties of materials', vi: 'Tính chất của vật liệu', f: null },
        { c: '3.3', t: 'Sorting materials', vi: 'Phân loại vật liệu', f: null },
        { c: '3.4', t: 'Changing materials', vi: 'Vật liệu thay đổi', f: null } ] },
      { t: 'Unit 4 · The Earth', vi: 'Trái Đất', lessons: [
        { c: '4.1', t: 'Planet Earth', vi: 'Hành tinh Trái Đất', f: null },
        { c: '4.2', t: 'Heat and light from the Sun', vi: 'Nhiệt và ánh sáng từ Mặt Trời', f: null },
        { c: '4.3', t: 'Rocks', vi: 'Đá', f: null },
        { c: '4.4', t: 'Soil', vi: 'Đất', f: null } ] },
      { t: 'Unit 5 · Humans', vi: 'Con người', lessons: [
        { c: '5.1', t: 'Our bodies', vi: 'Cơ thể chúng ta', f: null },
        { c: '5.2', t: 'Our amazing senses', vi: 'Các giác quan tuyệt vời', f: null },
        { c: '5.3', t: 'Similar and different', vi: 'Giống và khác nhau', f: null },
        { c: '5.4', t: 'Staying alive', vi: 'Sống khỏe', f: null } ] },
      { t: 'Unit 6 · Forces', vi: 'Lực', lessons: [
        { c: '6.1', t: 'Moving things', vi: 'Những vật chuyển động', f: null },
        { c: '6.2', t: 'Push and pull forces', vi: 'Lực đẩy và lực kéo', f: 'sci1-6-2-push-and-pull.html' },
        { c: '6.3', t: 'Making things move', vi: 'Làm cho vật chuyển động', f: null },
        { c: '6.4', t: 'Floating and sinking', vi: 'Nổi và chìm', f: null },
        { c: '6.5', t: 'Magnets can pull', vi: 'Nam châm biết kéo', f: null } ] }
    ] },
    2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null, 9: null
  },
  maths: { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null, 9: null }
};
var POS = [50, 30, 56, 74, 50, 26, 52, 70];
var DECOS = ['🍭', '🧁', '🍬', '⭐', '🍓', '🎈'];
var state = { subj: 'science', book: 1 };
try { var sv = JSON.parse(localStorage.getItem('camb:hub-view') || 'null'); if (sv && DATA[sv.subj]) { state.subj = sv.subj; state.book = sv.book || 1; } } catch (e) {}

function sumKey(subj, book, code) { return 'camb:sum:' + (subj === 'science' ? 'sci' : 'math') + book + '-' + code.replace('.', '-'); }
function getSum(k) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return (v && typeof v === 'object') ? v : null; } catch (e) { return null; } }
function getProgress(subj, book, code) {
  var sm = getSum(sumKey(subj, book, code));
  if (sm) return sm;
  /* Fallback: derive from the lesson's own main record (progress saved before summary keys existed) */
  try {
    var mk = (subj === 'science' ? 'camb:sci' : 'camb:math') + book + '-' + code.replace('.', '-');
    var m = JSON.parse(localStorage.getItem(mk) || 'null');
    if (m && Array.isArray(m.done)) return { s: m.done.length, st: Math.max(6, m.done.length), e: 0, et: 0, q: 0, qt: 0, legacy: true };
  } catch (e) {}
  return null;
}
function starsOf(sm) {
  if (!sm) return 0;
  var n = 0;
  if (sm.st > 0 && sm.s >= sm.st) n++;
  if (sm.et > 0 && sm.e >= sm.et) n++;
  if (sm.qt > 0 && sm.q / sm.qt >= 0.75) n++;
  return n;
}
function bi(en, vi) { return '<span class="en-main">' + en + '</span><span class="vi">' + vi + '</span>'; }

function renderBooks() {
  var el = document.getElementById('books'); el.innerHTML = '';
  for (var b = 1; b <= 9; b++) {
    (function (b) {
      var btn = document.createElement('button');
      btn.className = 'book' + (state.book === b ? ' on' : '');
      var has = !!DATA[state.subj][b];
      btn.innerHTML = (document.body.classList.contains('lang-vi') ? 'Quyển ' : 'Book ') + b + (has ? '' : ' <span class="dot">●</span>');
      btn.addEventListener('click', function () { state.book = b; saveView(); render(); });
      el.appendChild(btn);
    })(b);
  }
}
function saveView() { try { localStorage.setItem('camb:hub-view', JSON.stringify(state)); } catch (e) {} }

function render() {
  document.body.classList.toggle('subj-science', state.subj === 'science');
  document.body.classList.toggle('subj-maths', state.subj === 'maths');
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.subj === state.subj); });
  renderBooks();
  var map = document.getElementById('map'); map.innerHTML = '';
  var book = DATA[state.subj][state.book];
  var bar = document.getElementById('starbar');
  if (!book) {
    bar.textContent = '';
    var d = document.createElement('div'); d.className = 'empty';
    d.innerHTML = '<div class="big">' + (state.subj === 'maths' ? '➕' : '🔬') + '</div><h3>' + bi('Coming soon!', 'Sắp có!') + '</h3><p>' +
      (state.subj === 'maths'
        ? bi('Maths lessons are being made — Science comes first.', 'Các bài Toán đang được sản xuất — Science làm trước.')
        : bi('This book is being made. Please check back soon!', 'Quyển này đang được sản xuất. Mời quay lại sau nhé!')) + '</p>';
    map.appendChild(d); return;
  }
  // Flatten lessons with production + progress state
  var flat = [];
  book.units.forEach(function (u) { u.lessons.forEach(function (l) { flat.push(l); }); });
  flat.forEach(function (l) {
    l._sm = l.f ? getProgress(state.subj, state.book, l.c) : null;
    l._done = !!(l._sm && l._sm.st > 0 && l._sm.s >= l._sm.st);
    l._prog = !!(l._sm && (l._sm.s > 0 || l._sm.e > 0 || l._sm.q > 0));
  });
  var prevProducedDone = true, firstProduced = true, totalStars = 0, maxStars = 0;
  flat.forEach(function (l) {
    if (!l.f) { l._state = 'soon'; return; }
    maxStars += 3; totalStars += starsOf(l._sm);
    if (l._done) l._state = 'done';
    else if (l._prog) l._state = 'prog';
    else if (firstProduced || prevProducedDone) l._state = 'open';
    else l._state = 'lock';
    if (l._done) prevProducedDone = true; else if (l.f) prevProducedDone = false;
    firstProduced = false;
  });
  bar.innerHTML = '⭐ <span class="n">' + totalStars + '</span> / ' + maxStars + ' &nbsp;·&nbsp; ' + bi('Book', 'Quyển') + ' ' + state.book;
  var idx = 0, decoIdx = 0;
  book.units.forEach(function (u) {
    var ur = document.createElement('div'); ur.className = 'urow';
    ur.innerHTML = '<div class="unit-ribbon">' + bi(u.t, u.t.split('· ')[0] + '· ' + u.vi) + '</div>';
    map.appendChild(ur);
    u.lessons.forEach(function (l) {
      var row = document.createElement('div'); row.className = 'nrow';
      var x = POS[idx % POS.length]; idx++;
      if (idx % 3 === 0) { var dc = document.createElement('div'); dc.className = 'deco'; dc.textContent = DECOS[decoIdx++ % DECOS.length]; dc.style.top = '34px'; dc.style.left = (x > 50 ? '6%' : '84%'); row.appendChild(dc); }
      var nd = document.createElement('button');
      nd.className = 'node st-' + l._state;
      nd.style.left = x + '%';
      var st = starsOf(l._sm);
      var starsHtml = '<span>' + (st >= 1 ? '★' : '<span class="off">★</span>') + (st >= 2 ? '★' : '<span class="off">★</span>') + (st >= 3 ? '★' : '<span class="off">★</span>') + '</span>';
      var ballTxt = l._state === 'done' ? '✓' : l._state === 'lock' ? '🔒' : l._state === 'soon' ? '…' : l.c;
      nd.innerHTML = '<div class="stars">' + starsHtml + '</div><div class="ball">' + ballTxt + '</div><div class="lab"><span class="code">' + l.c + '</span> ' + bi(l.t, l.vi) + '</div>';
      (function (l, nd) {
        nd.addEventListener('click', function () {
          if (l._state === 'soon') { toast(bi('This lesson is being made!', 'Bài này đang được sản xuất!')); return; }
          if (l._state === 'lock') { nd.classList.remove('shake'); void nd.offsetWidth; nd.classList.add('shake'); toast(bi('Finish the lesson before to open this one!', 'Hoàn thành bài trước để mở khóa bài này nhé!')); return; }
          location.href = l.f;
        });
      })(l, nd);
      row.appendChild(nd);
      map.appendChild(row);
    });
  });
  drawWire();
}
function drawWire() {
  var map = document.getElementById('map');
  var old = map.querySelector('svg.wire'); if (old) old.remove();
  var nodes = map.querySelectorAll('.node .ball');
  if (nodes.length < 2) return;
  var mr = map.getBoundingClientRect();
  var pts = [];
  nodes.forEach(function (b) { var r = b.getBoundingClientRect(); pts.push({ x: r.left + r.width / 2 - mr.left, y: r.top + r.height / 2 - mr.top }); });
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'wire'); svg.setAttribute('width', map.offsetWidth); svg.setAttribute('height', map.offsetHeight);
  var d = 'M ' + pts[0].x + ' ' + pts[0].y;
  for (var i = 1; i < pts.length; i++) {
    var p0 = pts[i - 1], p1 = pts[i], mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
    d += ' Q ' + p0.x + ' ' + (p0.y + (p1.y - p0.y) * 0.5) + ' ' + mx + ' ' + my + ' T ' + p1.x + ' ' + p1.y;
  }
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d); svg.appendChild(path); map.prepend(svg);
}
var toastTimer = null;
function toast(html) { var t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400); }

document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () { state.subj = t.dataset.subj; state.book = 1; saveView(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
});
function setLang(m) {
  document.body.classList.remove('lang-en', 'lang-bi', 'lang-vi');
  document.body.classList.add('lang-' + m);
  document.querySelectorAll('.langbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === m); });
  try { localStorage.setItem('camb:hub-lang', m); } catch (e) {}
  render();
}
document.querySelectorAll('.langbar button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
try { var sl = localStorage.getItem('camb:hub-lang'); if (sl) { document.body.classList.remove('lang-bi'); document.body.classList.add('lang-' + sl); document.querySelectorAll('.langbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === sl); }); } } catch (e) {}
window.addEventListener('resize', drawWire);
render();
</script>
</body>
</html>
