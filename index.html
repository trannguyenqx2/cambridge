 {q:["What percentage of 9 carat gold is gold?","Vàng 9 carat có bao nhiêu phần trăm là vàng?"],o:[["9%","9%"],["37.5%","37.5%"],["75%","75%"]],a:1},
 {q:["What percentage of silver is in silver marked 900?","Bạc khắc 900 có bao nhiêu phần trăm là bạc?"],o:[["85%","85%"],["92.5%","92.5%"],["90%","90%"]],a:2},
 {q:["Which element mixed with carbon in a diamond makes it blue?","Nguyên tố nào lẫn với carbon trong kim cương làm cho nó có màu xanh?"],o:[["Boron","Boron"],["Nitrogen","Nitơ (nitrogen)"],["Nickel","Niken (nickel)"]],a:0},
 {q:["Why is the sodium chloride obtained from sea water not pure?","Vì sao natri clorua (sodium chloride) thu được từ nước biển không tinh khiết?"],o:[["Because the water evaporates too slowly","Vì nước bay hơi quá chậm"],["Because other salts are dissolved in the sea water too, and they are left behind with it","Vì các muối khác cũng hòa tan trong nước biển, và chúng còn lại cùng với nó"],["Because sodium chloride disappears when it is heated","Vì natri clorua biến mất khi bị đun nóng"]],a:1},
 {q:["What is the difference between weather and climate?","Thời tiết (weather) và khí hậu (climate) khác nhau thế nào?"],o:[["There is no difference — they mean the same thing","Không có gì khác — chúng cùng một nghĩa"],["Weather is the short-term state of the atmosphere; climate is the average weather of a place over more than 30 years","Thời tiết là trạng thái ngắn hạn của khí quyển (atmosphere); khí hậu là thời tiết trung bình của một nơi qua hơn 30 năm"],["Weather is only about rain; climate is only about temperature","Thời tiết chỉ nói về mưa; khí hậu chỉ nói về nhiệt độ"]],a:1},
 {q:["Which list gives the features that together describe the weather?","Danh sách nào nêu các đặc điểm hợp lại mô tả thời tiết?"],o:[["Rocks, soil and rivers","Đá, đất và sông"],["Day, month and year","Ngày, tháng và năm"],["Temperature, humidity, precipitation, cloudiness, visibility and wind","Nhiệt độ (temperature), độ ẩm (humidity), lượng mưa (precipitation), độ mây (cloudiness), tầm nhìn (visibility) và gió (wind)"]],a:2},
 {q:["Why should temperature readings always be taken in the shade, at the same time each day?","Vì sao số đo nhiệt độ luôn phải lấy trong bóng râm, vào cùng một giờ mỗi ngày?"],o:[["So the readings can be compared fairly — full sun would warm the thermometer itself, and different times of day are naturally warmer or cooler","Để các số đo so sánh được công bằng — nắng gắt sẽ làm nóng chính nhiệt kế, và các giờ khác nhau trong ngày vốn ấm hay mát khác nhau"],["Because thermometers break in sunlight","Vì nhiệt kế sẽ hỏng dưới ánh nắng"],["Because the shade is always the warmest place","Vì bóng râm luôn là nơi ấm nhất"]],a:0},
 {q:["Which description matches the Mediterranean climate?","Mô tả nào khớp với khí hậu Địa Trung Hải (Mediterranean)?"],o:[["Very cold and dry all year","Rất lạnh và khô quanh năm"],["Mild winters and hot, dry summers","Mùa đông ôn hòa và mùa hè nóng, khô"],["Hot and wet all year","Nóng và ẩm quanh năm"]],a:1},
 {q:["How many ice ages do scientists think there have been on Earth?","Các nhà khoa học cho rằng Trái Đất đã có bao nhiêu kỷ băng hà (ice ages)?"],o:[["Two","Hai"],["Five","Năm"],["Fifty","Năm mươi"]],a:1},
 {q:["What is the difference between a glacial period and an ice age?","Kỳ glacial (glacial period) và kỷ băng hà (ice age) khác nhau thế nào?"],o:[["They are two names for exactly the same thing","Chúng là hai tên của cùng một điều"],["A glacial period is much longer than an ice age","Kỳ glacial dài hơn nhiều so với kỷ băng hà"],["A glacial is one very cold phase; an ice age is a long cold period that contains many glacial and interglacial periods","Glacial là một giai đoạn rất lạnh; kỷ băng hà (ice age) là một thời kỳ lạnh dài chứa nhiều kỳ glacial và interglacial"]],a:2},
 {q:["How does pollen in a peat core tell scientists about past climates?","Phấn hoa (pollen) trong lõi than bùn cho các nhà khoa học biết về khí hậu quá khứ bằng cách nào?"],o:[["The pollen shows which plants lived at that time — and each kind of plant points to the climate it could live in","Phấn cho biết cây nào sống ở thời đó — và mỗi loại cây chỉ về kiểu khí hậu nó sống được"],["The pollen gives the exact temperature in degrees for each year","Phấn cho nhiệt độ chính xác theo độ cho từng năm"],["The pollen changes colour when the weather is cold","Phấn đổi màu khi trời lạnh"]],a:0},
 {q:["Is the Earth in an ice age now?","Trái Đất hiện có đang ở trong kỷ băng hà (ice age) không?"],o:[["No — there is no ice left anywhere on Earth","Không — không còn băng ở đâu trên Trái Đất nữa"],["Yes — we are in the interglacial phase of the current ice age, and permanent ice still covers the poles","Có — ta đang ở giai đoạn interglacial của kỷ băng hà hiện tại, và băng vĩnh cửu vẫn phủ hai cực"],["No — ice ages only happened before humans existed","Không — kỷ băng hà chỉ xảy ra trước khi con người tồn tại"]],a:1},
 {q:["Where did Earth’s early atmosphere come from?","Khí quyển (atmosphere) đầu tiên của Trái Đất đến từ đâu?"],o:[["From oxygen released by the first plants","Từ oxygen do những cây đầu tiên thải ra"],["From gases given out by volcanoes","Từ khí do núi lửa (volcanoes) phun ra"],["From air that arrived on comets last century","Từ không khí do sao chổi mang tới thế kỷ trước"]],a:1},
 {q:["What evidence shows that oxygen levels in the atmosphere rose long ago?","Bằng chứng nào cho thấy mức oxygen trong khí quyển (atmosphere) đã tăng từ lâu?"],o:[["Red bands of iron oxide in old rocks — oxygen combined with the iron","Các dải iron oxide đỏ trong đá cổ — oxygen đã kết hợp với sắt"],["Fossil fuels contain stored oxygen gas","Nhiên liệu hóa thạch (fossil fuels) chứa khí oxygen dự trữ"],["Venus has a hot surface","Sao Kim (Venus) có bề mặt nóng"]],a:0},
 {q:["Why have carbon dioxide levels risen over the last 200 years?","Vì sao mức carbon dioxide đã tăng trong 200 năm qua?"],o:[["Volcanoes have become much more active","Núi lửa đã hoạt động mạnh hơn nhiều"],["Plants have stopped photosynthesising","Cây cối đã ngừng quang hợp (photosynthesis)"],["Humans burn fossil fuels, releasing carbon locked up for millions of years","Con người đốt nhiên liệu hóa thạch (fossil fuels), giải phóng carbon bị khóa giữ (locked up) hàng triệu năm"]],a:2},
 {q:["Which of these is a renewable resource?","Tài nguyên nào sau đây là tài nguyên tái tạo (renewable)?"],o:[["Natural gas","Khí tự nhiên (natural gas)"],["Wind","Gió (wind)"],["Coal","Than (coal)"]],a:1}

 {q:["Sofia looks at a candle in a mirror. Which path does the light take to reach her eye?","Sofia nhìn một cây nến trong gương. Ánh sáng đi theo đường nào để tới mắt cô ấy?"],o:[["Candle → eye, directly","Nến → mắt, trực tiếp"],["Candle → mirror → eye","Nến → gương → mắt"],["Eye → mirror → candle","Mắt → gương → nến"]],a:1},
 {q:["What causes refraction?","Điều gì gây ra khúc xạ (refraction)?"],o:[["Light reflecting off a shiny surface","Ánh sáng phản xạ (reflecting) khỏi một bề mặt bóng"],["Light changing speed as it passes from one medium to another, so it changes direction","Ánh sáng thay đổi tốc độ (speed) khi đi từ môi trường (medium) này sang môi trường khác, nên nó thay đổi hướng"],["Light being blocked by an opaque object","Ánh sáng bị một vật đục chắn lại"]],a:1},
 {q:["A ray of light passes from air into glass. What happens to it?","Một tia sáng đi từ không khí vào thủy tinh (glass). Điều gì xảy ra với nó?"],o:[["It slows down and bends towards the normal","Nó chậm lại và bẻ cong về phía pháp tuyến (normal)"],["It speeds up and bends away from the normal","Nó nhanh lên và bẻ cong ra xa pháp tuyến (normal)"],["It stops at the surface","Nó dừng lại ở bề mặt"]],a:0},
 {q:["The speed of light in water is 225 000 km/s and in glass 200 000 km/s. A ray passing from water into glass will…","Tốc độ ánh sáng trong nước là 225 000 km/s và trong thủy tinh là 200 000 km/s. Một tia đi từ nước vào thủy tinh (glass) sẽ…"],o:[["speed up and bend away from the normal","nhanh lên và bẻ cong ra xa pháp tuyến (normal)"],["slow down and bend towards the normal","chậm lại và bẻ cong về phía pháp tuyến (normal)"],["keep exactly the same direction","giữ nguyên đúng hướng cũ"]],a:1},
 {q:["A coin at the bottom of an empty cup is just out of sight. Pouring water into the cup makes the coin visible because…","Một đồng xu ở đáy một cái cốc rỗng vừa khuất khỏi tầm nhìn. Đổ nước vào cốc làm đồng xu nhìn thấy được vì…"],o:[["the water lifts the coin up to the surface","nước nâng đồng xu lên mặt nước"],["the coin floats to the top of the water","đồng xu nổi lên trên mặt nước"],["light from the coin bends away from the normal as it leaves the water, so the coin appears raised","ánh sáng từ đồng xu bẻ cong ra xa pháp tuyến (normal) khi rời khỏi nước, nên đồng xu trông như được nâng lên"]],a:2},
 {q:["What name is given to white light being split into different colours?","Tên gọi của việc ánh sáng trắng (white light) bị tách thành các màu khác nhau là gì?"],o:[["Refraction","Khúc xạ (refraction)"],["Dispersion","Tán sắc (dispersion)"],["Reflection","Phản xạ (reflection)"],["Conduction","Dẫn nhiệt (conduction)"]],a:1},
 {q:["A glass block is used to separate white light into colours. Which piece of equipment is it?","Một khối thủy tinh được dùng để tách ánh sáng trắng thành các màu. Đó là thiết bị nào?"],o:[["A round glass cylinder","Một hình trụ thủy tinh tròn"],["A square glass prism","Một lăng kính thủy tinh vuông"],["A triangular glass prism","Một lăng kính thủy tinh hình tam giác (triangular glass prism)"],["A hexagonal glass prism","Một lăng kính thủy tinh lục giác"]],a:2},
 {q:["Which colour of light is refracted through the smallest angle in a prism?","Màu ánh sáng nào bị khúc xạ qua góc nhỏ nhất trong một lăng kính (prism)?"],o:[["Red","Đỏ (red)"],["Violet","Tím (violet)"],["Blue","Lam (blue)"],["Green","Lục (green)"]],a:0},
 {q:["Why are drops of water needed for a rainbow to be seen?","Vì sao cần có giọt nước (drops of water) để nhìn thấy cầu vồng?"],o:[["The drops make the sunlight white","Các giọt làm ánh nắng thành màu trắng"],["The drops cause dispersion of the light, and reflect it from inside themselves","Các giọt gây tán sắc (dispersion) ánh sáng, và phản xạ (reflect) nó từ bên trong chúng"],["The drops block the Sun so it is not too bright","Các giọt che Mặt Trời để nó không quá chói"],["The drops cool the air down","Các giọt làm mát không khí"]],a:1},
 {q:["What are the three primary colours of light?","Ba màu cơ bản (primary colours) của ánh sáng là những màu nào?"],o:[["Red, green and yellow","Đỏ, xanh lá và vàng"],["Red, green and blue","Đỏ, xanh lá và xanh dương"],["Red, blue and yellow — the same as in paints","Đỏ, xanh dương và vàng — giống như trong sơn vẽ"]],a:1},
 {q:["What colour of light is made when red light and blue light are added together?","Màu ánh sáng nào được tạo thành khi cộng ánh sáng đỏ và ánh sáng xanh dương?"],o:[["Yellow","Vàng (yellow)"],["Cyan","Cyan"],["Magenta","Magenta"]],a:2},
 {q:["White light shines on a red filter. What happens?","Ánh sáng trắng chiếu vào một kính lọc đỏ (red filter). Điều gì xảy ra?"],o:[["Only red light is transmitted; the other colours are absorbed by the filter","Chỉ ánh sáng đỏ được truyền qua (transmitted); các màu còn lại bị kính lọc hấp thụ (absorbed)"],["All the colours pass through, and the light stays white","Mọi màu đều lọt qua, và ánh sáng vẫn trắng"],["Only green light is transmitted","Chỉ ánh sáng xanh lá được truyền qua"]],a:0},
 {q:["A red cube is seen in green light. What colour does it appear?","Một khối đỏ được nhìn trong ánh sáng xanh lá. Nó trông có màu gì?"],o:[["Red","Đỏ (red)"],["Black","Đen (black)"],["Green","Xanh lá (green)"]],a:1},
 {q:["What is a galaxy made from?","Một thiên hà (galaxy) được tạo thành từ những gì?"],o:[["Only empty space","Chỉ khoảng không trống rỗng"],["Stellar dust, gas, stars and solar systems","Bụi sao (stellar dust), khí (gas), các ngôi sao (stars) và các hệ mặt trời (solar systems)"],["Only the Sun and the Moon","Chỉ Mặt Trời và Mặt Trăng"]],a:1},
 {q:["The Milky Way is which shape of galaxy?","Ngân Hà (Milky Way) là thiên hà có hình dạng nào?"],o:[["Elliptical","Elip (elliptical)"],["Irregular","Bất định (irregular)"],["Spiral","Xoắn ốc (spiral)"]],a:2},
 {q:["Which force holds all the parts of a galaxy together?","Lực nào giữ mọi phần của một thiên hà (galaxy) lại với nhau?"],o:[["Gravity","Lực hấp dẫn (gravity)"],["Friction","Ma sát (friction)"],["Magnetism","Từ tính (magnetism)"]],a:0},
 {q:["A group counts 48 grains of sand. Their sample has a mass of 6 g and the large container has a mass of 600 g. What is the estimated number of grains in the large container?","Một nhóm đếm được 48 hạt cát. Mẫu của họ có khối lượng 6 g và thùng lớn có khối lượng 600 g. Số hạt ước lượng trong thùng lớn là bao nhiêu?"],o:[["480 grains","480 hạt"],["4,800 grains — G × L ÷ S = 48 × 600 ÷ 6","4.800 hạt — G × L ÷ S = 48 × 600 ÷ 6"],["48,000 grains","48.000 hạt"]],a:1},
 {q:["What is an asteroid?","Tiểu hành tinh (asteroid) là gì?"],o:[["A small planet with oceans","Một hành tinh nhỏ có đại dương"],["An object made of rock that orbits the Sun, smaller than a planet","Một vật làm bằng đá quay quanh (orbit) Mặt Trời, nhỏ hơn hành tinh"],["A star that has gone out","Một ngôi sao đã tắt"]],a:1},
 {q:["Where are most asteroids in the Solar System found?","Hầu hết tiểu hành tinh (asteroids) trong Hệ Mặt Trời được tìm thấy ở đâu?"],o:[["Between the orbits of Mars and Jupiter, in the asteroid belt","Giữa quỹ đạo (orbits) của Sao Hỏa (Mars) và Sao Mộc (Jupiter), trong vành đai tiểu hành tinh (asteroid belt)"],["Between the orbits of Venus and Earth","Giữa quỹ đạo của Sao Kim (Venus) và Trái Đất"],["Orbiting the Earth, like the Moon","Quay quanh Trái Đất, như Mặt Trăng"]],a:0},
 {q:["Scientists believe asteroids are…","Các nhà khoa học tin rằng tiểu hành tinh (asteroids) là…"],o:[["Pieces broken off the Moon last year","Các mảnh vỡ ra từ Mặt Trăng năm ngoái"],["Rocks made by volcanoes on Jupiter","Đá do núi lửa trên Sao Mộc (Jupiter) tạo ra"],["Rocks left over from the formation of the Solar System","Đá còn sót lại từ khi Hệ Mặt Trời hình thành"]],a:2},
 {q:["Why do asteroids sometimes impact Earth?","Vì sao tiểu hành tinh (asteroids) đôi khi va chạm (impact) với Trái Đất?"],o:[["The Sun pushes them straight at Earth","Mặt Trời đẩy chúng thẳng về phía Trái Đất"],["Earth’s gravity pulls on passing asteroids, and many asteroid orbits pass close to Earth","Lực hấp dẫn (gravity) của Trái Đất hút các tiểu hành tinh đi ngang qua, và nhiều quỹ đạo (orbits) của tiểu hành tinh đi gần Trái Đất"],["Asteroids are aiming at Earth","Tiểu hành tinh đang nhắm vào Trái Đất"]],a:1}
],
"sci8-u7":[
 {q:["What is a nutrient?","Chất dinh dưỡng (nutrient) là gì?"],o:[["Any food you enjoy eating","Bất kỳ món ăn nào con thích ăn"],["A substance in food that the body needs to stay healthy","Một chất trong thức ăn mà cơ thể cần để khỏe mạnh"],["A vitamin made in the skin","Một vitamin được tạo ra trong da"]],a:1},
 {q:["In the iodine test, what colour shows that a food contains starch?","Trong phép thử iodine, màu nào cho thấy một món ăn chứa tinh bột (starch)?"],o:[["Very dark blue-black","Xanh đen rất đậm"],["Orange-brown, unchanged","Nâu cam, không đổi"],["Bright green","Xanh lá sáng"]],a:0},
 {q:["For most people, where does most of their vitamin D come from?","Với hầu hết mọi người, phần lớn vitamin D đến từ đâu?"],o:[["From citrus fruit","Từ trái cây họ cam quýt"],["From drinking water","Từ nước uống"],["It is made in the skin when sunlight falls on it","Nó được tạo ra trong da khi ánh nắng chiếu vào"]],a:2},
 {q:["A person with anaemia feels very tired and has little energy. What are they missing?","Một người bị thiếu máu (anaemia) cảm thấy rất mệt và ít năng lượng. Họ đang thiếu chất gì?"],o:[["Vitamin C, so their skin cannot heal","Vitamin C, nên da của họ không lành được"],["Iron, so they make too little haemoglobin to carry oxygen","Sắt (iron), nên họ tạo quá ít haemoglobin để vận chuyển oxygen"],["Calcium, so their bones are weak","Canxi (calcium), nên xương của họ yếu"]],a:1},
 {q:["What is a balanced diet?","Chế độ ăn cân bằng (balanced diet) là gì?"],o:[["A diet of carbohydrate only","Một chế độ ăn chỉ có cacbohydrat (carbohydrate)"],["A diet that gives some of every kind of nutrient, and the right amount of energy","Một chế độ ăn cho một ít của mọi loại chất dinh dưỡng (nutrient), và lượng năng lượng (energy) vừa đúng"],["A diet with no fat at all","Một chế độ ăn hoàn toàn không có chất béo (fat)"]],a:1},
 {q:["Which two nutrients give you most of your energy?","Hai chất dinh dưỡng (nutrients) nào cho con phần lớn năng lượng (energy)?"],o:[["Carbohydrate and fat","Cacbohydrat (carbohydrate) và chất béo (fat)"],["Vitamins and minerals","Vitamin và chất khoáng (minerals)"],["Protein and fibre","Đạm (protein) và chất xơ (fibre)"]],a:0},
 {q:["Why should you eat fibre, if you cannot digest it?","Vì sao con nên ăn chất xơ (fibre), nếu con không tiêu hóa được nó?"],o:[["Because it gives you lots of energy","Vì nó cho con nhiều năng lượng (energy)"],["Because it builds new cells","Vì nó xây tế bào mới"],["Because it keeps the digestive system healthy and helps prevent constipation","Vì nó giữ hệ tiêu hóa (digestive system) khỏe mạnh và giúp ngăn táo bón (constipation)"]],a:2},
 {q:["Why should you try not to eat too much sugar?","Vì sao con nên cố không ăn quá nhiều đường (sugar)?"],o:[["Because sugar stops you growing","Vì đường làm con ngừng lớn"],["Because too much sugar can decay your teeth and increases the risk of diabetes","Vì quá nhiều đường có thể làm sâu răng và làm tăng nguy cơ bệnh tiểu đường (diabetes)"],["Because sugar contains no energy","Vì đường không chứa năng lượng (energy)"]],a:1},
 {q:["What happens as a person grows, to make their body get bigger?","Điều gì xảy ra khi một người tăng trưởng (grow), khiến cơ thể họ lớn lên?"],o:[["Cells disappear and are replaced by air","Tế bào biến mất và được thay bằng không khí"],["Cells divide, and each new cell grows, again and again","Tế bào phân chia, và mỗi tế bào mới lớn lên, lặp đi lặp lại"],["Each cell stretches like a balloon and never divides","Mỗi tế bào giãn ra như quả bóng và không bao giờ phân chia"]],a:1},
 {q:["What is development?","Phát triển (development) là gì?"],o:[["The changes that form tissues and organs and bring new abilities, such as walking and talking","Các thay đổi tạo thành mô và cơ quan và mang lại khả năng mới, như đi và nói"],["Only getting taller","Chỉ là cao lên"],["Eating more protein","Ăn nhiều chất đạm (protein) hơn"]],a:0},
 {q:["Why may young children who get too little protein or energy not grow very tall?","Vì sao trẻ nhỏ nhận quá ít chất đạm (protein) hoặc năng lượng có thể không cao lớn được?"],o:[["Protein makes children sleep too much","Chất đạm làm trẻ ngủ quá nhiều"],["Energy stops cells dividing","Năng lượng ngăn tế bào phân chia"],["New cells are built from protein, and dividing needs energy — without enough of either, cells cannot keep dividing and growing","Tế bào mới được xây từ chất đạm (protein), và phân chia cần năng lượng (energy) — thiếu một trong hai, tế bào không thể tiếp tục phân chia và lớn lên"]],a:2},
 {q:["How does carbon monoxide from smoking harm the body?","Carbon monoxide từ hút thuốc làm hại cơ thể thế nào?"],o:[["It helps haemoglobin carry extra oxygen","Nó giúp haemoglobin mang thêm oxy (oxygen)"],["It combines with haemoglobin in red blood cells, so less oxygen reaches the body cells and they have less energy","Nó kết hợp với haemoglobin trong tế bào máu đỏ, nên ít oxy tới được tế bào cơ thể hơn và chúng có ít năng lượng hơn"],["It makes red blood cells divide faster","Nó làm tế bào máu đỏ phân chia nhanh hơn"]],a:1},
 {q:["What is a joint?","Khớp (joint) là gì?"],o:[["A tough cord that joins a muscle to a bone","Một dây dai nối cơ với xương"],["A place where two bones meet","Nơi hai xương gặp nhau"],["A muscle that can push bones apart","Một cơ có thể đẩy các xương ra xa nhau"]],a:1},
 {q:["Which of these is a hinge joint?","Khớp nào sau đây là khớp bản lề (hinge joint)?"],o:[["The elbow","Khuỷu (elbow)"],["The shoulder","Vai (shoulder)"],["The hip","Hông (hip)"]],a:0},
 {q:["To bend the arm at the elbow…","Để gập cánh tay tại khuỷu…"],o:[["The triceps contracts and the biceps relaxes","Cơ tam đầu (triceps) co lại và cơ nhị đầu (biceps) giãn ra"],["Both muscles push together","Cả hai cơ cùng đẩy"],["The biceps contracts and the triceps relaxes","Cơ nhị đầu (biceps) co lại và cơ tam đầu (triceps) giãn ra"]],a:2},
 {q:["Why are two muscles needed to move a bone at a joint and then back again?","Vì sao cần hai cơ để làm một xương chuyển động tại một khớp rồi quay trở lại?"],o:[["Because one muscle is not strong enough on its own","Vì một cơ tự nó không đủ mạnh"],["Because muscles can only pull — they cannot push","Vì cơ chỉ có thể kéo — chúng không thể đẩy"],["Because tendons stretch too easily","Vì gân (tendons) co giãn quá dễ dàng"]],a:1}
],
"sci8-u8":[
 {q:["What is an exothermic reaction?","Phản ứng tỏa nhiệt (exothermic reaction) là gì?"],o:[["A reaction that takes in thermal energy from the surroundings","Một phản ứng thu năng lượng nhiệt từ môi trường xung quanh"],["A chemical reaction in which thermal energy is given out","Một phản ứng hóa học mà trong đó năng lượng nhiệt được tỏa ra"],["A reaction that makes a new metal","Một phản ứng tạo ra một kim loại mới"]],a:1},
 {q:["What is needed for combustion (burning) to take place?","Cần có những gì để sự cháy (combustion) diễn ra?"],o:[["A fuel, oxygen, and heat to start it","Một nhiên liệu (fuel), oxi (oxygen), và nhiệt để bắt đầu"],["Only water and a fuel","Chỉ nước và một nhiên liệu"],["Carbon dioxide and a fuel","Carbon dioxide và một nhiên liệu"]],a:0},
 {q:["Sofia’s acid started at 18 °C and ended at 42 °C. Marcus’s started at 21 °C and ended at 45 °C. Whose reaction changed more chemical energy into thermal energy?","Axit của Sofia bắt đầu ở 18 °C và kết thúc ở 42 °C. Của Marcus bắt đầu ở 21 °C và kết thúc ở 45 °C. Phản ứng của ai chuyển nhiều năng lượng hóa học thành năng lượng nhiệt hơn?"],o:[["Marcus, because his end temperature was higher","Marcus, vì nhiệt độ cuối của cậu ấy cao hơn"],["Sofia, because her start temperature was lower","Sofia, vì nhiệt độ đầu của cô ấy thấp hơn"],["Neither — both rose by 24 °C, so both changed the same amount of energy","Không ai hơn — cả hai đều tăng 24 °C, nên cả hai chuyển cùng một lượng năng lượng"]],a:2},
 {q:["Sofia and Marcus test whether a longer magnesium ribbon gives a bigger temperature rise. What is the independent variable?","Sofia và Marcus kiểm tra xem một dải magie (magnesium ribbon) dài hơn có cho độ tăng nhiệt độ lớn hơn không. Biến độc lập (independent variable) là gì?"],o:[["The temperature change","Độ thay đổi nhiệt độ"],["The length of the magnesium ribbon","Chiều dài của dải magie (magnesium ribbon)"],["The volume of acid, 10 cm³","Thể tích axit, 10 cm³"]],a:1},
 {q:["What is an endothermic reaction?","Phản ứng thu nhiệt (endothermic reaction) là gì?"],o:[["A reaction that gives out thermal energy to the surroundings","Một phản ứng cho nhiệt năng (thermal energy) ra môi trường xung quanh"],["A reaction that absorbs thermal energy from the surroundings and stores it in chemical bonds, so the temperature falls","Một phản ứng hấp thụ nhiệt năng từ môi trường xung quanh và dự trữ nó trong các liên kết hóa học, nên nhiệt độ giảm"],["Any change in which a solid melts","Bất kỳ thay đổi nào mà một chất rắn tan chảy"]],a:1},
 {q:["Citric acid reacts with sodium hydrogen carbonate in a test tube. What happens to the temperature, and why does the mixture fizz?","Axit citric phản ứng với sodium hydrogen carbonate trong một ống nghiệm (test tube). Nhiệt độ thay đổi thế nào, và vì sao hỗn hợp sủi bọt?"],o:[["It falls — the reaction takes in thermal energy, and carbon dioxide gas is formed","Nó giảm — phản ứng thu nhiệt năng (thermal energy) vào, và khí carbon dioxide được tạo thành"],["It rises — the reaction gives out energy, and steam is formed","Nó tăng — phản ứng cho năng lượng ra, và hơi nước (steam) được tạo thành"],["It stays the same — the fizz is just air escaping","Nó giữ nguyên — tiếng sủi bọt chỉ là không khí thoát ra"]],a:0},
 {q:["Why is ice melting called an endothermic process and NOT an endothermic reaction?","Vì sao đá tan chảy được gọi là một quá trình thu nhiệt (endothermic process) mà KHÔNG phải phản ứng thu nhiệt (endothermic reaction)?"],o:[["Because ice is always cold","Vì đá luôn lạnh"],["Because it happens too slowly to be a reaction","Vì nó xảy ra quá chậm để là một phản ứng"],["Because thermal energy is taken in, but no new substances are formed — the water is still water","Vì nhiệt năng (thermal energy) được thu vào, nhưng không có chất mới nào được tạo thành — nước vẫn là nước (water)"]],a:2},
 {q:["A chemical ice pack holds ammonium nitrate and water in two separate compartments. Why does the pack turn cold when you squeeze it?","Một túi đá hóa học (ice pack) giữ ammonium nitrate và nước (water) trong hai ngăn riêng. Vì sao túi trở nên lạnh khi con bóp nó?"],o:[["The ammonium nitrate reacts with the water and forms ice","Ammonium nitrate phản ứng với nước và tạo thành đá (ice)"],["The ammonium nitrate dissolves in the water, taking in thermal energy from the surroundings — an endothermic process","Ammonium nitrate hòa tan trong nước, thu nhiệt năng (thermal energy) vào từ môi trường xung quanh — một quá trình thu nhiệt (endothermic process)"],["The water in the pack freezes solid","Nước trong túi đóng băng thành rắn"]],a:1},
 {q:["Four metals are heated in air. Which one is the most reactive with oxygen?","Bốn kim loại được đun trong không khí. Kim loại nào phản ứng (reactive) mạnh nhất với oxygen?"],o:[["Copper — it slowly turns black","Đồng (copper) — nó chậm rãi đen đi"],["Magnesium — it burns with a very bright flame","Magie (magnesium) — nó cháy với ngọn lửa rất sáng"],["Iron — it glows dull red","Sắt (iron) — nó rực đỏ mờ"]],a:1},
 {q:["What is the general word equation for a metal reacting with oxygen?","Phương trình chữ tổng quát cho một kim loại phản ứng với oxygen là gì?"],o:[["metal + oxygen → metal oxide","kim loại + oxygen → metal oxide (oxide kim loại)"],["metal + oxygen → metal + rust","kim loại + oxygen → kim loại + gỉ"],["oxygen + water → metal oxide","oxygen + nước → metal oxide (oxide kim loại)"]],a:0},
 {q:["Why are sodium and potassium stored under oil?","Vì sao natri (sodium) và kali (potassium) được cất dưới dầu?"],o:[["To keep them warm","Để giữ ấm cho chúng"],["To make them softer","Để làm chúng mềm hơn"],["To prevent them reacting with oxygen in the air and with water vapour","Để ngăn ngừa (prevent) chúng phản ứng với oxygen trong không khí và với hơi nước"]],a:2},
 {q:["In the four-tube investigation, which conditions made the iron nail rust most?","Trong thí nghiệm bốn ống, những điều kiện nào làm cây đinh sắt gỉ nhiều nhất?"],o:[["Dry air, dried by calcium chloride","Không khí khô, được làm khô bởi calcium chloride"],["Water and air together — the nail half in water, the tube open to the air","Nước và không khí cùng lúc — đinh ngập một nửa trong nước, ống mở với không khí"],["Boiled water covered with oil, with no air","Nước đã đun sôi phủ dầu, không có không khí"]],a:1},
 {q:["What is the word equation for sodium reacting with water?","Phương trình chữ cho natri (sodium) phản ứng với nước là gì?"],o:[["sodium + water → sodium oxide + oxygen","natri + nước → natri oxide + oxygen"],["sodium + water → sodium hydroxide + hydrogen","natri + nước → natri hydroxide + hydro (hydrogen)"],["sodium + water → sodium hydroxide + oxygen","natri + nước → natri hydroxide + oxygen"]],a:1},
 {q:["Which metal reacts most vigorously with water?","Kim loại nào phản ứng mãnh liệt nhất với nước?"],o:[["Potassium — it bursts into flames","Kali (potassium) — nó bốc cháy"],["Magnesium — it reacts slowly","Magie (magnesium) — nó phản ứng chậm"],["Copper — it does not react","Đồng (copper) — nó không phản ứng"]],a:0},
 {q:["How do you test for the gas given off when calcium reacts with water?","Con thử khí thoát ra khi canxi (calcium) phản ứng với nước bằng cách nào?"],o:[["It relights a glowing splint","Nó làm bùng cháy lại một que đóm còn tàn"],["It turns limewater cloudy","Nó làm nước vôi trong bị đục"],["A lit splint gives a squeaky pop — the gas is hydrogen","Một que đóm đang cháy tạo tiếng nổ lép bép — khí đó là hydro (hydrogen)"]],a:2},
 {q:["What is the word equation for magnesium reacting with steam?","Phương trình chữ cho magie (magnesium) phản ứng với hơi nước (steam) là gì?"],o:[["magnesium + water (g) → magnesium hydroxide + hydrogen","magie + nước (g) → magie hydroxide + hydro (hydrogen)"],["magnesium + water (g) → magnesium oxide + hydrogen","magie + nước (g) → magie oxide + hydro (hydrogen)"],["magnesium + water (g) → magnesium oxide + oxygen","magie + nước (g) → magie oxide + oxygen"]],a:1},
 {q:["What is made when a metal reacts with a dilute acid?","Điều gì được tạo ra khi một kim loại phản ứng với một acid loãng (dilute acid)?"],o:[["A salt and oxygen","Một muối (salt) và oxygen"],["A salt and hydrogen","Một muối (salt) và hydrogen (hydrogen)"],["Only water","Chỉ có nước"]],a:1},
 {q:["What is the word equation for the reaction between magnesium and sulfuric acid?","Phương trình chữ cho phản ứng giữa magnesium (magnesium) và acid sulfuric là gì?"],o:[["magnesium + sulfuric acid → magnesium sulfate + hydrogen","magnesium (magnesium) + acid sulfuric → magnesium sulfate + hydrogen (hydrogen)"],["magnesium + sulfuric acid → magnesium chloride + hydrogen","magnesium (magnesium) + acid sulfuric → magnesium chloride + hydrogen (hydrogen)"],["magnesium + sulfuric acid → magnesium sulfate + oxygen","magnesium (magnesium) + acid sulfuric → magnesium sulfate + oxygen"]],a:0},
 {q:["In a fair test with dilute hydrochloric acid, which metal fizzes fastest and which one does not react at all?","Trong một phép thử công bằng với acid hydrochloric loãng (dilute hydrochloric acid), kim loại nào sủi bọt nhanh nhất và kim loại nào không phản ứng chút nào?"],o:[["Iron fizzes fastest; zinc does not react","Sắt (iron) sủi bọt nhanh nhất; kẽm (zinc) không phản ứng"],["Zinc fizzes fastest; iron does not react","Kẽm (zinc) sủi bọt nhanh nhất; sắt (iron) không phản ứng"],["Magnesium fizzes fastest; copper does not react","Magnesium (magnesium) sủi bọt nhanh nhất; đồng (copper) không phản ứng"]],a:2},
 {q:["Why must sodium and potassium NOT be used in the acid investigation?","Vì sao KHÔNG được dùng sodium (sodium) và potassium (potassium) trong khảo sát với acid?"],o:[["They are too expensive","Chúng quá đắt"],["They are so reactive that the reaction would be dangerously violent","Chúng hoạt động mạnh tới mức phản ứng sẽ nguy hiểm và dữ dội"],["They dissolve in water before the test starts","Chúng tan trong nước trước khi phép thử bắt đầu"]],a:1}
],
"sci8-u9":[
 {q:["What is meant by the term “magnetic field”?","Thuật ngữ “từ trường (magnetic field)” nghĩa là gì?"],o:[["The metal a magnet is made from","Kim loại làm nên nam châm"],["The area around a magnet where the effects of the magnet can be detected","Vùng xung quanh một nam châm, nơi có thể phát hiện được tác dụng của nam châm"],["The line drawn down the middle of a magnet","Đường vẽ dọc giữa một nam châm"]],a:1},
 {q:["Where is the magnetic field around a bar magnet strongest?","Từ trường xung quanh một nam châm thanh mạnh nhất ở đâu?"],o:[["At the poles, where the field lines are closest together","Ở các cực (poles), nơi các đường sức từ (field lines) gần nhau nhất"],["In the middle of the magnet","Ở giữa nam châm"],["Far away from the magnet","Ở xa nam châm"]],a:0},
 {q:["The magnetic field of magnet A extends further from the magnet than the field of magnet B. What can be concluded?","Từ trường của nam châm A vươn xa khỏi nam châm hơn từ trường của nam châm B. Có thể kết luận điều gì?"],o:[["Magnet B is stronger than magnet A","Nam châm B mạnh hơn nam châm A"],["The two magnets are equally strong","Hai nam châm mạnh như nhau"],["Magnet A is stronger than magnet B","Nam châm A mạnh hơn nam châm B"]],a:2},
 {q:["Between two poles, the magnetic field lines all point in the same direction. What force acts between the poles?","Giữa hai cực, các đường sức từ (magnetic field lines) đều chỉ cùng một hướng. Lực nào tác dụng giữa hai cực?"],o:[["No force at all","Không có lực nào cả"],["Attraction — the poles pull together","Lực hút (attraction) — hai cực hút lại với nhau"],["Repulsion — the poles push apart","Lực đẩy (repulsion) — hai cực đẩy nhau ra"]],a:1},
 {q:["Which piece of equipment is used for navigation and uses the Earth’s magnetic field?","Dụng cụ nào được dùng để định hướng (navigation) và sử dụng từ trường của Trái Đất?"],o:[["A satellite navigation system (satnav)","Một hệ thống định vị vệ tinh (satnav)"],["A magnetic compass","Một la bàn từ (magnetic compass)"],["A thermometer","Một nhiệt kế"]],a:1},
 {q:["A bar magnet is allowed to rotate freely. Which pole of the bar magnet will point to geographic north?","Một nam châm thanh (bar magnet) được để quay tự do. Cực nào của nam châm thanh sẽ chỉ về bắc địa lý (geographic north)?"],o:[["Its north pole — because the magnetic pole near geographic north is a magnetic south pole, and opposite poles attract","Cực bắc của nó — vì cực từ gần bắc địa lý là một cực nam từ (magnetic south pole), và các cực khác dấu hút nhau"],["Its south pole — like poles always attract","Cực nam của nó — các cực cùng dấu luôn hút nhau"],["Neither pole — it spins forever","Không cực nào — nó quay mãi mãi"]],a:0},
 {q:["Which part of the Earth causes the Earth’s magnetic field, and what is it mostly made of?","Phần nào của Trái Đất gây ra từ trường của Trái Đất, và nó chủ yếu làm bằng gì?"],o:[["The crust, mostly made of lodestone rock","Vỏ (crust), chủ yếu làm bằng đá lodestone"],["The oceans, mostly made of salt water","Các đại dương, chủ yếu làm bằng nước muối"],["The core, mostly made of iron","Lõi (core), chủ yếu làm bằng sắt (iron)"]],a:2},
 {q:["Magnetic north moves at about 60 km per year. Why can it still be used for navigation on a 12-hour journey?","Bắc từ (magnetic north) di chuyển khoảng 60 km mỗi năm. Vì sao nó vẫn dùng được để định hướng (navigation) trong một chuyến đi 12 giờ?"],o:[["Because magnetic north stops moving during journeys","Vì bắc từ ngừng di chuyển trong các chuyến đi"],["Because in 12 hours it moves only a tiny distance — less than 100 metres — far too little to notice","Vì trong 12 giờ nó chỉ di chuyển một khoảng rất nhỏ — dưới 100 mét — quá ít để nhận thấy"],["Because compasses ignore magnetic north completely","Vì la bàn hoàn toàn bỏ qua bắc từ"]],a:1},
 {q:["Which two of these metals can be magnetised?","Hai kim loại nào trong số này có thể bị nhiễm từ (magnetised)?"],o:[["Copper and aluminium","Đồng (copper) và nhôm (aluminium)"],["Iron and steel","Sắt (iron) và thép (steel)"],["Gold and silver","Vàng (gold) và bạc (silver)"]],a:1},
 {q:["What is the main difference between an electromagnet and a permanent magnet?","Điểm khác biệt chính giữa nam châm điện (electromagnet) và nam châm vĩnh cửu (permanent magnet) là gì?"],o:[["An electromagnet can be switched on and off; a permanent magnet’s field is always there","Nam châm điện (electromagnet) có thể bật và tắt; từ trường của nam châm vĩnh cửu (permanent magnet) luôn có mặt"],["An electromagnet is always stronger than any other magnet","Nam châm điện luôn mạnh hơn mọi nam châm khác"],["A permanent magnet needs a cell to work","Nam châm vĩnh cửu cần một pin (cell) mới hoạt động"]],a:0},
 {q:["Elsa has a cell, connectors and a switch. What else does she need to make an electromagnet?","Elsa có một pin (cell), các đầu nối và một công tắc (switch). Bạn ấy còn cần gì nữa để làm một nam châm điện (electromagnet)?"],o:[["A bar magnet and a compass","Một nam châm thanh (bar magnet) và một la bàn (compass)"],["A wooden ruler and paperclips","Một thước gỗ và kẹp giấy"],["A coil of wire and an iron nail to be the core","Một cuộn dây (coil) và một chiếc đinh sắt làm lõi (core)"]],a:2},
 {q:["How can the poles of an electromagnet be reversed?","Làm thế nào để đảo ngược các cực của một nam châm điện (electromagnet)?"],o:[["By heating the nail until it glows","Bằng cách nung chiếc đinh cho tới khi nó đỏ rực"],["By reversing the connections on the cell, so the current flows the other way","Bằng cách đảo ngược các đầu nối trên pin (cell), để dòng điện chạy theo chiều ngược lại"],["By picking up more paperclips","Bằng cách nhấc nhiều kẹp giấy hơn"]],a:1},
 {q:["Which three factors affect the strength of an electromagnet?","Ba yếu tố (factors) nào ảnh hưởng tới sức mạnh của một nam châm điện (electromagnet)?"],o:[["The colour of the wire, the size of the bench and the switch","Màu của dây, kích thước của bàn và công tắc"],["The number of turns in the coil, the material of the core and the current in the coil","Số vòng dây (turns) trong cuộn, vật liệu của lõi (core) và dòng điện (current) trong cuộn"],["The size of the paperclips, the room temperature and the nail","Kích thước ghim giấy, nhiệt độ phòng và cây đinh"]],a:1},
 {q:["Four electromagnets have the same current and the same number of turns. Their cores are: A nickel, B wood, C rubber, D aluminium. Which makes the strongest electromagnet?","Bốn nam châm điện có cùng dòng điện (current) và cùng số vòng dây (turns). Lõi của chúng là: A niken (nickel), B gỗ (wood), C cao su (rubber), D nhôm (aluminium). Cái nào tạo nam châm điện mạnh nhất?"],o:[["A — the nickel core","A — lõi niken (nickel)"],["B — the wooden core","B — lõi gỗ (wood)"],["D — the aluminium core","D — lõi nhôm (aluminium)"],["C — the rubber core","C — lõi cao su (rubber)"]],a:0},
 {q:["Marcus tests 5, 10, 15, 20, 25, 30 and 35 turns; the clips lifted are 1, 2, 4, 5, 10, 12 and 16. The 25-turn result does not fit the pattern. What should Marcus do?","Marcus thử 5, 10, 15, 20, 25, 30 và 35 vòng dây (turns); số ghim nâng được là 1, 2, 4, 5, 10, 12 và 16. Kết quả ở 25 vòng không khớp với xu hướng. Marcus nên làm gì?"],o:[["Delete it and forget it","Xóa nó đi và quên nó"],["Change all the other results to match it","Sửa mọi kết quả còn lại cho khớp với nó"],["Repeat that measurement to check it","Lặp lại phép đo đó để kiểm tra nó"]],a:2},
 {q:["The CERN laboratory in Switzerland uses very strong electromagnets, and as much electricity as a small city. Why?","Phòng thí nghiệm CERN ở Thụy Sĩ dùng các nam châm điện (electromagnets) rất mạnh, và lượng điện bằng cả một thành phố nhỏ. Vì sao?"],o:[["Its scientists leave the lights on all night","Các nhà khoa học ở đó để đèn sáng cả đêm"],["Making an electromagnet stronger takes a greater current, and CERN’s magnets need enormous currents","Muốn một nam châm điện mạnh hơn cần dòng điện (current) lớn hơn, và các nam châm của CERN cần dòng điện khổng lồ"],["Strong electromagnets heat the whole building like a toaster","Các nam châm điện mạnh sưởi ấm cả tòa nhà như một máy nướng bánh"]],a:1}
],
"sci9-u1":[
 {q:["What are the reactants in photosynthesis?","Các chất phản ứng (reactants) trong quang hợp (photosynthesis) là gì?"],o:[["Glucose and oxygen","Glucose và oxygen"],["Water and carbon dioxide","Nước (water) và carbon dioxide"],["Chlorophyll and sunlight","Chlorophyll (diệp lục) và ánh sáng Mặt Trời"]],a:1},
 {q:["A glowing splint is put into the gas collected from pondweed, and it relights. What is the gas?","Một que đóm còn than hồng được đưa vào khí thu từ rong (pondweed) và nó bùng cháy lại. Đó là khí gì?"],o:[["Oxygen","Oxygen"],["Carbon dioxide","Carbon dioxide"],["Hydrogen","Hydrogen"]],a:0},
 {q:["A lamp is moved further away from a pondweed plant. What happens?","Một chiếc đèn được đưa ra xa cây rong (pondweed) hơn. Điều gì xảy ra?"],o:[["The light intensity increases, so bubbles form faster","Cường độ ánh sáng (light intensity) tăng, nên bọt khí hình thành nhanh hơn"],["Nothing changes","Không có gì thay đổi"],["The light intensity decreases, so the rate of photosynthesis decreases","Cường độ ánh sáng (light intensity) giảm, nên tốc độ quang hợp (rate of photosynthesis) giảm"]],a:2},
 {q:["What does chlorophyll do in photosynthesis?","Chlorophyll (diệp lục) làm gì trong quang hợp (photosynthesis)?"],o:[["It carries water up from the soil","Nó đưa nước (water) từ đất lên"],["It captures the energy in sunlight","Nó thu giữ năng lượng trong ánh sáng Mặt Trời"],["It turns glucose into oxygen","Nó biến glucose thành oxygen"]],a:1},
 {q:["Where does photosynthesis actually happen?","Quang hợp (photosynthesis) thực sự diễn ra ở đâu?"],o:[["In the nucleus of every plant cell","Trong nhân (nucleus) của mọi tế bào thực vật"],["In chloroplasts, inside some leaf cells","Trong lục lạp (chloroplasts), bên trong một số tế bào lá"],["In the roots, underground","Trong rễ, dưới đất"]],a:1},
 {q:["A leaf is tested with iodine solution and part of it turns blue-black. What does that part contain?","Một lá được thử bằng dung dịch iodine và một phần chuyển xanh đen. Phần đó chứa gì?"],o:[["Magnesium","Magiê (magnesium)"],["Oxygen gas","Khí oxygen"],["Starch","Tinh bột (starch)"]],a:2},
 {q:["Why do plants need magnesium?","Vì sao cây cần magiê (magnesium)?"],o:[["To make chlorophyll","Để tạo diệp lục (chlorophyll)"],["To make proteins from carbohydrates","Để tạo protein (proteins) từ carbohydrate"],["To hold the leaf up","Để giữ lá đứng thẳng"]],a:0},
 {q:["Why do plants need nitrate?","Vì sao cây cần nitrat (nitrate)?"],o:[["It colours the flowers","Nó tạo màu cho hoa"],["Its nitrogen is used to make proteins for growth","Nitrogen của nó được dùng để tạo protein (proteins) cho sinh trưởng"],["It replaces water in the leaf","Nó thay thế nước trong lá"]],a:1},
 {q:["A carbon atom in carbon dioxide is taken in by a plant. After photosynthesis, where is that atom?","Một nguyên tử cacbon (carbon) trong khí cacbonic được cây lấy vào. Sau quang hợp (photosynthesis), nguyên tử đó ở đâu?"],o:[["It has changed into an oxygen atom","Nó đã biến thành nguyên tử oxy"],["It is part of a carbohydrate in the plant","Nó nằm trong một chất bột đường (carbohydrate) trong cây"],["It has disappeared","Nó đã biến mất"],["It is part of a diamond in the soil","Nó nằm trong một viên kim cương trong đất"]],a:1},
 {q:["At night, a green plant…","Vào ban đêm, một cây xanh…"],o:[["only photosynthesises","chỉ quang hợp (photosynthesis)"],["stops respiring","ngừng hô hấp (respiration)"],["respires and gives out carbon dioxide","hô hấp (respiration) và thải khí cacbonic (carbon dioxide)"],["takes in carbon dioxide faster than in the day","lấy khí cacbonic nhanh hơn ban ngày"]],a:2},
 {q:["In the indicator test, a tube with only a water plant in the light turned purple. Why?","Trong thí nghiệm chỉ thị (indicator), một ống chỉ có cây thủy sinh ngoài sáng chuyển màu tím. Vì sao?"],o:[["The plant used up carbon dioxide by photosynthesising faster than it respired","Cây đã dùng hết khí cacbonic vì quang hợp (photosynthesis) nhanh hơn hô hấp (respiration)"],["The plant released extra carbon dioxide","Cây đã thải thêm khí cacbonic"],["The maggots respired","Giòi đã hô hấp"],["The indicator evaporated","Dung dịch chỉ thị đã bốc hơi"]],a:0},
 {q:["Why are fossil fuels described as non-renewable?","Vì sao nhiên liệu hóa thạch (fossil fuels) được gọi là không tái tạo được (non-renewable)?"],o:[["They are rocks shaped like organisms","Chúng là đá có hình sinh vật"],["They burn too quickly to be used","Chúng cháy quá nhanh nên không dùng được"],["They are found only in one country","Chúng chỉ có ở một quốc gia"],["They took hundreds of millions of years to form","Chúng mất hàng trăm triệu năm để hình thành"]],a:3},
 {q:["What does carbon dioxide do in the atmosphere?","Khí cacbonic (carbon dioxide) làm gì trong khí quyển (atmosphere)?"],o:[["It lets all reflected heat escape to space at once","Nó để mọi nhiệt phản xạ thoát ra không gian cùng lúc"],["It traps heat energy and helps to keep the Earth warm","Nó giữ lại năng lượng nhiệt (heat energy) và giúp giữ Trái Đất ấm"],["It blocks all sunlight so no light reaches the ground","Nó chặn mọi ánh sáng Mặt Trời nên không ánh sáng nào tới mặt đất"]],a:1},
 {q:["Why did the asteroid impact 67 million years ago cause a mass extinction?","Vì sao vụ va chạm tiểu hành tinh (asteroid) 67 triệu năm trước gây ra tuyệt chủng hàng loạt (mass extinction)?"],o:[["Dust blocked sunlight, plants could not photosynthesise, food chains broke down and the Earth cooled","Bụi chặn ánh sáng Mặt Trời, cây không thể quang hợp (photosynthesise), các chuỗi thức ăn sụp đổ và Trái Đất lạnh đi"],["The oceans boiled away in a single day","Các đại dương sôi cạn trong một ngày"],["The impact pushed the Earth closer to the Sun","Vụ va chạm đẩy Trái Đất lại gần Mặt Trời hơn"]],a:0},
 {q:["A piece of a meteoroid that reaches the surface of the Earth is called a…","Một mảnh của meteoroid chạm tới bề mặt Trái Đất được gọi là…"],o:[["meteor","sao băng (meteor)"],["shooting star","ngôi sao băng (shooting star)"],["meteorite","meteorite"]],a:2},
 {q:["Sea level rises at about 3 mm per year. Roughly how much rise is that by the end of the century, about 80 years from now?","Mực nước biển dâng khoảng 3 mm mỗi năm. Tới cuối thế kỉ, khoảng 80 năm nữa, mực nước sẽ dâng chừng bao nhiêu?"],o:[["About 2.4 cm","Khoảng 2,4 cm"],["About 24 cm","Khoảng 24 cm"],["About 24 m","Khoảng 24 m"]],a:1}
],
"sci9-u2":[
 {q:["How many electrons are there in an atom of carbon?","Một nguyên tử cacbon (carbon) có bao nhiêu electron?"],o:[["4","4"],["8","8"],["6","6"]],a:2},
 {q:["Lithium has atomic number 3 and mass number 7. How many neutrons does a lithium atom have?","Liti (lithium) có số hiệu nguyên tử (atomic number) 3 và số khối (mass number) 7. Một nguyên tử liti có bao nhiêu neutron?"],o:[["4","4"],["3","3"],["7","7"]],a:0},
 {q:["Which element has the electronic structure 2,8,3?","Nguyên tố nào có cấu trúc electron (electronic structure) 2,8,3?"],o:[["Magnesium","Magie (magnesium)"],["Aluminium","Nhôm (aluminium)"],["Sodium","Natri (sodium)"]],a:1},
 {q:["How many electrons can the FIRST electron shell hold at most?","Vỏ electron (electron shell) THỨ NHẤT chứa tối đa bao nhiêu electron?"],o:[["8 electrons","8 electron"],["18 electrons","18 electron"],["2 electrons","2 electron"]],a:2},
 {q:["As you go down Group 1, what happens to the melting points?","Khi đi xuống Nhóm 1, nhiệt độ nóng chảy (melting points) thay đổi thế nào?"],o:[["They increase","Chúng tăng lên"],["They decrease — 180 °C, 98 °C, 63 °C","Chúng giảm xuống — 180 °C, 98 °C, 63 °C"],["They stay the same","Chúng giữ nguyên"]],a:1},
 {q:["Why do the elements in one group have similar properties?","Vì sao các nguyên tố trong cùng một nhóm (group) có tính chất giống nhau?"],o:[["They all have the same number of electrons in their outer shell","Tất cả đều có cùng số electron ở lớp vỏ ngoài cùng"],["They all have the same mass number","Tất cả đều có cùng số khối (mass number)"],["They all have the same colour","Tất cả đều có cùng màu"]],a:0},
 {q:["As you go down Group 7 (the halogens), what happens?","Khi đi xuống Nhóm 7 (các halogen), điều gì xảy ra?"],o:[["Melting points decrease and reactivity increases","Nhiệt độ nóng chảy giảm và khả năng phản ứng tăng"],["The colour gets paler","Màu sắc nhạt dần"],["Melting and boiling points increase, and reactivity decreases","Nhiệt độ nóng chảy và sôi tăng lên, và khả năng phản ứng (reactivity) giảm xuống"]],a:2},
 {q:["Why are the noble gases (Group 8) so unreactive?","Vì sao các khí hiếm (noble gases) (Nhóm 8) rất khó phản ứng?"],o:[["They have no electrons at all","Chúng không có electron nào cả"],["Their outer electron shell is full","Lớp vỏ electron ngoài cùng của chúng đã đầy"],["They have seven electrons in the outer shell","Chúng có bảy electron ở lớp vỏ ngoài cùng"]],a:1},
 {q:["Why do most atoms react to form compounds?","Vì sao hầu hết các nguyên tử phản ứng để tạo hợp chất?"],o:[["To gain more protons","Để có thêm proton"],["To fill their outermost electron shell","Để làm đầy vỏ electron ngoài cùng (outermost electron shell)"],["To empty every electron shell","Để làm trống mọi vỏ electron"]],a:1},
 {q:["A sodium atom [2,8,1] becomes a sodium ion. What happens?","Một nguyên tử natri [2,8,1] trở thành ion natri. Điều gì xảy ra?"],o:[["It loses its outer electron and becomes Na⁺ [2,8]⁺","Nó mất electron ngoài cùng và thành Na⁺ [2,8]⁺"],["It gains an electron and becomes Na⁻","Nó nhận một electron và thành Na⁻"],["It shares an electron and becomes a molecule","Nó dùng chung một electron và thành phân tử (molecule)"]],a:0},
 {q:["Which of these is a covalent molecule?","Chất nào sau đây là một phân tử (molecule) cộng hóa trị?"],o:[["Sodium chloride, NaCl","Natri clorua, NaCl"],["Magnesium oxide, MgO","Magie oxit, MgO"],["Ammonia, NH₃","Amoniac, NH₃"]],a:2},
 {q:["What is the formula of magnesium chloride?","Công thức của magie clorua là gì?"],o:[["MgCl","MgCl"],["MgCl₂","MgCl₂"],["Mg₂Cl","Mg₂Cl"]],a:1},
 {q:["What holds the ions together in a sodium chloride lattice?","Điều gì giữ các ion (ions) lại với nhau trong mạng lưới (lattice) sodium chloride?"],o:[["Weak forces between separate molecules","Lực yếu giữa các phân tử riêng lẻ"],["Strong electrostatic forces between oppositely charged ions, acting in all directions","Lực tĩnh điện (electrostatic forces) mạnh giữa các ion mang điện tích trái dấu, tác dụng theo mọi hướng"],["Shared electrons between each pair of ions","Electron dùng chung giữa mỗi cặp ion"]],a:1},
 {q:["Why is graphite soft, even though the bonds inside its layers are strong covalent bonds?","Vì sao graphite mềm, dù các liên kết bên trong các lớp (layers) của nó là liên kết cộng hóa trị (covalent bonds) mạnh?"],o:[["The forces between the layers are weak, so the layers slide over each other","Lực giữa các lớp (layers) yếu, nên các lớp trượt lên nhau"],["Graphite atoms have no bonds at all","Các nguyên tử graphite không có liên kết nào cả"],["Graphite melts at room temperature","Graphite nóng chảy ở nhiệt độ phòng"]],a:0},
 {q:["A substance has a melting point of 3078 °C and a boiling point of 4300 °C. What does this suggest about it?","Một chất có nhiệt độ nóng chảy (melting point) 3078 °C và nhiệt độ sôi (boiling point) 4300 °C. Điều này gợi ý gì về nó?"],o:[["It is made of simple molecules","Nó được làm từ các phân tử đơn giản"],["It is a gas at room temperature","Nó là chất khí ở nhiệt độ phòng"],["It has a giant structure held together by very strong forces","Nó có cấu trúc khổng lồ (giant structure) được giữ bằng các lực rất mạnh"]],a:2},
 {q:["When can an ionic compound conduct electricity?","Khi nào một hợp chất ion (ionic compound) có thể dẫn điện (conduct electricity)?"],o:[["Only when it is a solid crystal","Chỉ khi nó là tinh thể rắn"],["When it is molten or dissolved in water, because its ions are free to move","Khi nóng chảy hoặc hòa tan trong nước, vì các ion (ions) của nó được tự do chuyển động"],["Never — ions cannot carry a charge","Không bao giờ — các ion không thể mang điện tích"]],a:1}
],
"sci9-u3":[
 {q:["Which equation gives density?","Phương trình nào cho khối lượng riêng (density)?"],o:[["density = volume ÷ mass","khối lượng riêng = thể tích (volume) ÷ khối lượng (mass)"],["density = mass ÷ volume","khối lượng riêng = khối lượng (mass) ÷ thể tích (volume)"],["density = mass × volume","khối lượng riêng = khối lượng (mass) × thể tích (volume)"]],a:1},
 {q:["A block of aluminium has a volume of 5.0 cm³ and a mass of 13.5 g. What is its density — and will it float in water?","Một khối aluminium (nhôm) có thể tích (volume) 5,0 cm³ và khối lượng (mass) 13,5 g. Khối lượng riêng của nó là bao nhiêu — và nó sẽ nổi (float) trong nước không?"],o:[["2.7 g/cm³ — it will sink, because 2.7 is more than water’s 1.0","2,7 g/cm³ — nó sẽ chìm (sink), vì 2,7 lớn hơn 1,0 của nước"],["0.37 g/cm³ — it will float","0,37 g/cm³ — nó sẽ nổi (float)"],["18.5 g/cm³ — it will sink","18,5 g/cm³ — nó sẽ chìm (sink)"]],a:0},
 {q:["A toy car is lowered into a measuring cylinder. The water rises from 40 cm³ to 64 cm³. Its mass is 84 g. What is the car’s density?","Một ô tô đồ chơi được thả vào ống đong (measuring cylinder). Nước dâng từ 40 cm³ lên 64 cm³. Khối lượng (mass) của nó là 84 g. Khối lượng riêng của ô tô là bao nhiêu?"],o:[["1.3 g/cm³","1,3 g/cm³"],["2.1 g/cm³","2,1 g/cm³"],["3.5 g/cm³","3,5 g/cm³"]],a:2},
 {q:["Three liquids are poured into a cylinder and settle into layers: honey at the bottom, water in the middle, vegetable oil on top. What does the order tell you?","Ba chất lỏng được rót vào một ống và lắng thành các lớp: mật ong ở đáy, nước ở giữa, dầu thực vật ở trên. Thứ tự này cho ta biết điều gì?"],o:[["Honey is the least dense and oil the most dense","Mật ong nhẹ nhất (least dense) và dầu nặng nhất (most dense)"],["Honey is the most dense and oil the least dense","Mật ong nặng nhất (most dense) và dầu nhẹ nhất (least dense)"],["All three liquids have the same density","Cả ba chất lỏng có cùng khối lượng riêng (density)"]],a:1},
 {q:["Which of these is the unit of heat?","Đâu là đơn vị của nhiệt (heat)?"],o:[["degree Celsius (°C)","độ C (°C)"],["joule (J)","joule (J)"],["newton (N)","newton (N)"]],a:1},
 {q:["Block A is 10 g of copper at 25 °C. Block B is 80 g of copper at 25 °C. Which comparison is correct?","Khối A là 10 g đồng ở 25 °C. Khối B là 80 g đồng ở 25 °C. So sánh nào đúng?"],o:[["Their temperatures are the same, but block B has more heat","Nhiệt độ (temperature) của chúng như nhau, nhưng khối B có nhiều nhiệt (heat) hơn"],["Block B has a higher temperature and more heat","Khối B có nhiệt độ cao hơn và nhiều nhiệt hơn"],["Their temperatures and their heat are both the same","Cả nhiệt độ lẫn nhiệt của chúng đều như nhau"]],a:0},
 {q:["Three objects touch each other: A is at 10 °C, B at 20 °C and C at 30 °C. Which way does thermal energy transfer?","Ba vật chạm vào nhau: A ở 10 °C, B ở 20 °C và C ở 30 °C. Năng lượng nhiệt (thermal energy) truyền theo hướng nào?"],o:[["A → B only","Chỉ A → B"],["A → B and A → C only","Chỉ A → B và A → C"],["C → B, C → A and B → A","C → B, C → A và B → A"]],a:2},
 {q:["Zara says: “If object X has a higher temperature than object Y, then X must always have more heat than Y.” Is she right?","Zara nói: “Nếu vật X có nhiệt độ cao hơn vật Y, thì X phải luôn có nhiều nhiệt hơn Y.” Bạn ấy đúng không?"],o:[["Yes — a higher temperature always means more heat","Đúng — nhiệt độ cao hơn luôn nghĩa là nhiều nhiệt (heat) hơn"],["No — a very small hot object can hold less heat in total than a large cooler object","Không — một vật nóng rất nhỏ có thể chứa ít nhiệt (heat) tổng cộng hơn một vật lớn mát hơn"],["Yes — heat and temperature are the same thing","Đúng — nhiệt và nhiệt độ là cùng một thứ"]],a:1},
 {q:["What does the law of conservation of energy state?","Định luật bảo toàn năng lượng (law of conservation of energy) phát biểu điều gì?"],o:[["Energy can be created, but never destroyed","Năng lượng có thể được tạo ra (created), nhưng không bao giờ bị phá hủy"],["Energy cannot be created or destroyed, only changed from one form to another","Năng lượng không thể được tạo ra (created) hay bị phá hủy (destroyed), chỉ biến đổi từ dạng này sang dạng khác"],["Energy slowly disappears whenever it is used","Năng lượng từ từ biến mất mỗi khi được sử dụng"]],a:1},
 {q:["An electric lamp is supplied with 100 J of electrical energy and changes 10 J of it to light energy. How much becomes thermal energy?","Một đèn điện được cung cấp 100 J năng lượng điện và biến đổi 10 J trong đó thành năng lượng ánh sáng. Bao nhiêu trở thành năng lượng nhiệt (thermal energy)?"],o:[["90 J","90 J"],["110 J","110 J"],["10 J","10 J"]],a:0},
 {q:["An electric motor takes in 1000 J of electrical energy and gives out 500 J of kinetic energy. How much thermal energy does it give out?","Một mô tơ điện nhận vào 1000 J năng lượng điện và cho ra 500 J động năng (kinetic energy). Nó cho ra bao nhiêu năng lượng nhiệt (thermal energy)?"],o:[["1500 J","1500 J"],["0 J — motors waste no energy","0 J — mô tơ không hao phí năng lượng nào"],["500 J","500 J"]],a:2},
 {q:["Two swinging bottles gradually come to a stop. What has happened to their energy?","Hai chai đung đưa dần dần dừng lại. Năng lượng của chúng đã ra sao?"],o:[["It has been destroyed by the swinging","Nó đã bị phá hủy (destroyed) bởi chuyển động đung đưa"],["It has been dissipated to the surroundings, mostly as thermal energy","Nó đã bị phân tán (dissipated) ra môi trường xung quanh, chủ yếu dưới dạng năng lượng nhiệt (thermal energy)"],["It has been created again inside the string","Nó đã được tạo ra (created) lại bên trong sợi dây"]],a:1},
 {q:["Thermal energy always transfers from…","Năng lượng nhiệt (thermal energy) luôn truyền từ…"],o:[["hotter places to colder places","nơi nóng hơn (hotter) sang nơi lạnh hơn (colder)"],["colder places to hotter places","nơi lạnh hơn (colder) sang nơi nóng hơn (hotter)"],["cold objects into hot objects","vật lạnh vào vật nóng"]],a:0},
 {q:["You hold a piece of ice and your hand feels cold. What is really happening?","Bạn cầm một viên đá và tay bạn cảm thấy lạnh. Điều gì thực sự đang xảy ra?"],o:[["Cold flows from the ice into your hand","Cái lạnh truyền từ viên đá vào tay bạn"],["Thermal energy transfers from your hand into the ice","Năng lượng nhiệt (thermal energy) truyền từ tay bạn vào viên đá"],["The ice makes thermal energy disappear","Viên đá làm năng lượng nhiệt biến mất"]],a:1},
 {q:["In the coffee thought experiment, which method keeps the coffee hottest after five minutes?","Trong thí nghiệm tưởng tượng về cà phê, phương án nào giữ cà phê nóng nhất sau năm phút?"],o:[["Method A — leave the coffee, add the cold milk after five minutes","Phương án A — để cà phê, cho sữa lạnh vào sau năm phút"],["Both methods give exactly the same temperature","Cả hai phương án cho nhiệt độ giống hệt nhau"],["Method B — add the cold milk straight away, then leave it","Phương án B — cho sữa lạnh vào ngay, rồi để yên"]],a:2},
 {q:["In the lamp investigation, the water temperature rises and then stops rising. Why does it stop?","Trong khảo sát với bóng đèn (lamp), nhiệt độ nước tăng lên rồi ngừng tăng. Vì sao nó ngừng?"],o:[["The lamp has used up all its energy","Bóng đèn đã dùng hết năng lượng của nó"],["The water dissipates thermal energy as fast as the lamp adds it","Nước tỏa năng lượng nhiệt (thermal energy) nhanh bằng tốc độ bóng đèn thêm vào"],["The thermometer cannot measure any higher","Nhiệt kế (thermometer) không đo cao hơn được nữa"]],a:1},
 {q:["How is thermal energy transferred by conduction through a solid?","Nhiệt năng được truyền bằng dẫn nhiệt (conduction) qua một chất rắn như thế nào?"],o:[["Particles flow from the hot end to the cold end","Các hạt chảy từ đầu nóng tới đầu lạnh"],["Particles vibrate more vigorously and collide with their neighbours, passing the vibrations on","Các hạt rung mạnh mẽ hơn (vigorously) và va vào các hạt kề bên, truyền rung động đi tiếp"],["A wave travels through the solid without any particles","Một sóng di chuyển qua chất rắn mà không cần hạt nào"]],a:1},
 {q:["Which two ways of transferring thermal energy CANNOT happen in a vacuum?","Hai cách truyền nhiệt năng nào KHÔNG THỂ xảy ra trong chân không (vacuum)?"],o:[["Conduction and convection","Dẫn nhiệt (conduction) và đối lưu (convection)"],["Conduction and radiation","Dẫn nhiệt (conduction) và bức xạ (radiation)"],["Convection and radiation","Đối lưu (convection) và bức xạ (radiation)"]],a:0},
 {q:["Why does warm water rise through colder water?","Vì sao nước ấm nổi lên qua nước lạnh hơn?"],o:[["Its mass increases when it is heated","Khối lượng của nó tăng khi được đun nóng"],["Its particles vibrate in fixed positions only","Các hạt của nó chỉ rung ở vị trí cố định"],["It expands, so its volume increases while its mass stays the same — its density decreases","Nó giãn nở (expand), nên thể tích tăng trong khi khối lượng giữ nguyên — khối lượng riêng (density) của nó giảm"]],a:2},
 {q:["Which surface is the BEST emitter and absorber of radiation?","Bề mặt nào phát xạ và hấp thụ bức xạ (radiation) TỐT NHẤT?"],o:[["Shiny, silver and smooth","Sáng bóng, bạc và nhẵn"],["Dull, black, with a large surface area","Xỉn, đen, với diện tích bề mặt lớn"],["White, with a small surface area","Trắng, với diện tích bề mặt nhỏ"]],a:1},
 {q:["A liquid is evaporating and is not being heated. What happens to its temperature, and why?","Một chất lỏng đang bay hơi (evaporating) và không được đun nóng. Nhiệt độ của nó thay đổi thế nào, và vì sao?"],o:[["It rises, because the slow particles leave","Nó tăng, vì các hạt chậm rời đi"],["It falls, because the highest-energy particles escape and the average energy of the rest drops","Nó giảm, vì các hạt có năng lượng cao nhất thoát ra và năng lượng trung bình (average energy) của các hạt còn lại giảm"],["It stays the same, because evaporation changes nothing","Nó giữ nguyên, vì bay hơi không thay đổi gì"]],a:1},
 {q:["Sofia puts equal volumes of perfume and water, at the same temperature, on her skin. Which feels colder, and why?","Sofia đặt các lượng bằng nhau của nước hoa (perfume) và nước, ở cùng nhiệt độ, lên da. Cái nào thấy lạnh hơn, và vì sao?"],o:[["The perfume — it evaporates faster, so it removes thermal energy from the skin faster","Nước hoa — nó bay hơi (evaporates) nhanh hơn, nên nó lấy nhiệt năng (thermal energy) khỏi da nhanh hơn"],["The water — it evaporates faster than perfume","Nước — nó bay hơi nhanh hơn nước hoa"],["Neither — both feel the same","Không cái nào — cả hai thấy như nhau"]],a:0},
 {q:["Why does sweat fail to cool the skin in very humid conditions?","Vì sao mồ hôi (sweat) không làm mát được da trong điều kiện rất ẩm?"],o:[["The skin stops making sweat","Da ngừng tạo mồ hôi"],["The sweat turns into ice","Mồ hôi biến thành băng"],["The sweat cannot evaporate, so no thermal energy is carried away from the skin","Mồ hôi không bay hơi (evaporate) được, nên không có nhiệt năng (thermal energy) nào bị mang khỏi da"]],a:2},
 {q:["How does a porous clay water cooler keep the water inside it cool?","Bình nước đất sét xốp (porous clay) giữ nước bên trong mát bằng cách nào?"],o:[["The clay is a good thermal insulator, like a flask","Đất sét cách nhiệt tốt, như một bình giữ nhiệt"],["Water soaks through the porous clay and evaporates from the outside, taking thermal energy away","Nước thấm qua đất sét xốp (porous) và bay hơi (evaporates) ở mặt ngoài, mang nhiệt năng (thermal energy) đi"],["The clay slowly freezes the water","Đất sét từ từ làm đóng băng nước"]],a:1}
],
"sci9-u4":[
 {q:["Why are root hairs so good at absorbing water from the soil?","Vì sao lông hút (root hairs) hấp thụ nước (water) từ đất giỏi đến vậy?"],o:[["They are bright green and catch the light","Chúng xanh sáng và đón ánh sáng"],["Together they give the root a really big surface for taking in water","Cùng nhau chúng cho rễ một bề mặt thật lớn để lấy nước vào"],["They push the soil particles far apart","Chúng đẩy các hạt đất ra xa nhau"]],a:1},
 {q:["Which mineral ions travel into a root hair along with the water?","Những ion khoáng (mineral ions) nào đi vào lông hút (root hair) cùng với nước?"],o:[["Nitrate ions and magnesium ions, dissolved in the soil water","Ion nitrate (nitrate ions) và ion magnesium (magnesium ions), hòa tan trong nước đất"],["Only oxygen ions from the air spaces","Chỉ ion oxygen từ các khoảng không khí"],["No ions at all — only pure water enters","Không ion nào cả — chỉ nước tinh khiết đi vào"]],a:0},
 {q:["What is a xylem vessel like inside?","Bên trong một mạch gỗ (xylem vessel) trông như thế nào?"],o:[["A living cell full of cytoplasm and a nucleus","Một tế bào sống đầy chất tế bào (cytoplasm) và một nhân (nucleus)"],["A solid rod of wood with no space inside","Một thanh gỗ đặc không có khoảng trống bên trong"],["An empty tube — the cell is dead, its contents and end walls have gone","Một ống rỗng — tế bào đã chết, chất bên trong và vách cuối của nó đã biến mất"]],a:2},
 {q:["In the celery experiment, the cut stalk showed blue spots. What are the blue spots?","Trong thí nghiệm cần tây, cuống đã cắt cho thấy các đốm xanh. Các đốm xanh là gì?"],o:[["Root hair cells","Tế bào lông hút (root hair cells)"],["The xylem vessels that carried the coloured water up","Các mạch gỗ (xylem vessels) đã đưa nước màu lên"],["Palisade cells","Tế bào mô giậu (palisade cells)"]],a:1},
 {q:["What is transpiration?","Sự thoát hơi nước (transpiration) là gì?"],o:[["Water moving up the xylem from the roots","Nước di chuyển lên mạch gỗ (xylem) từ rễ"],["The loss of water vapour from the leaves of a plant","Sự mất hơi nước (water vapour) khỏi lá của cây"],["A plant wilting on a hot day","Một cây héo vào ngày nóng"]],a:1},
 {q:["Inside a leaf, where does liquid water change into water vapour?","Bên trong một chiếc lá, nước lỏng biến thành hơi nước (water vapour) ở đâu?"],o:[["In the cellulose cell walls of the leaf cells, where it evaporates into the air spaces","Trong thành tế bào cellulose của các tế bào lá, nơi nó bốc hơi (evaporates) vào các khoang khí (air spaces)"],["Inside the xylem vessels","Bên trong các mạch gỗ (xylem vessels)"],["On the top surface of the leaf","Trên mặt trên của lá"]],a:0},
 {q:["In Sofia’s experiment, plant C at 30 °C fell from 842 g to 618 g in 7 days. What was its mean loss of mass per day?","Trong thí nghiệm của Sofia, cây C ở 30 °C giảm từ 842 g xuống 618 g trong 7 ngày. Khối lượng mất trung bình (mean) mỗi ngày của nó là bao nhiêu?"],o:[["8 g per day","8 g mỗi ngày"],["224 g per day","224 g mỗi ngày"],["32 g per day","32 g mỗi ngày"]],a:2},
 {q:["Why does a plant wilt when it does not get enough water?","Vì sao một cây héo (wilt) khi không nhận đủ nước?"],o:[["Its xylem vessels collapse and snap","Các mạch gỗ (xylem vessels) của nó sụp và gãy"],["Its cells lose water, become soft and floppy, and no longer press on each other to hold the plant up","Các tế bào của nó mất nước, trở nên mềm và rũ, và không còn ép lên nhau để giữ cây đứng"],["Its stomata open too wide","Các khí khổng (stomata) của nó mở quá rộng"]],a:1},
 {q:["What does excretion mean?","Bài tiết (excretion) nghĩa là gì?"],o:[["Passing faeces out of the gut","Đưa phân ra khỏi ống tiêu hóa (gut)"],["Getting rid of waste substances that have truly been inside the body","Loại bỏ các chất thải đã thật sự ở bên trong cơ thể"],["Breaking food down in the stomach","Phân giải thức ăn trong dạ dày"]],a:1},
 {q:["What is another name for the excretory system?","Tên gọi khác của hệ bài tiết (excretory system) là gì?"],o:[["The renal system","Hệ renal (renal system)"],["The breathing system","Hệ hô hấp (breathing system)"],["The digestive system","Hệ tiêu hóa (digestive system)"]],a:0},
 {q:["Where is urea made, and where is it removed from the blood?","Urea được tạo ra ở đâu, và nó được loại bỏ khỏi máu ở đâu?"],o:[["Made in the kidneys, removed in the liver","Tạo ra ở thận (kidneys), loại bỏ ở gan (liver)"],["Made in the bladder, removed in the lungs","Tạo ra ở bàng quang (bladder), loại bỏ ở phổi"],["Made in the liver, removed by the kidneys","Tạo ra ở gan (liver), loại bỏ bởi thận (kidneys)"]],a:2},
 {q:["Which journey does urine take after it is made in a kidney?","Nước tiểu (urine) đi theo hành trình nào sau khi được tạo ra trong thận?"],o:[["Kidney → urethra → bladder → outside","Thận → urethra → bàng quang (bladder) → ra ngoài"],["Kidney → ureter → bladder → urethra → outside","Thận → ureter → bàng quang (bladder) → urethra → ra ngoài"],["Kidney → artery → bladder → ureter → outside","Thận → động mạch (artery) → bàng quang (bladder) → ureter → ra ngoài"]],a:1},
 {q:["Which substances diffuse from the mother’s blood into the fetus’s blood?","Những chất nào khuếch tán (diffuse) từ máu của mẹ vào máu của thai nhi (fetus)?"],o:[["Only carbon dioxide and urea","Chỉ carbon dioxide và urea"],["Oxygen, glucose and other substances the fetus needs","Oxygen, glucose và các chất khác mà thai nhi cần"],["The mother’s blood itself — the two bloods mix","Chính máu của mẹ — hai dòng máu trộn lẫn với nhau"]],a:1},
 {q:["Why does a pregnant woman need to eat much more iron than usual?","Vì sao phụ nữ mang thai cần ăn nhiều sắt (iron) hơn thường lệ rất nhiều?"],o:[["Iron is needed to make haemoglobin, and she must make extra haemoglobin to carry oxygen to herself and her fetus","Sắt (iron) cần để tạo haemoglobin, và cô ấy phải tạo thêm haemoglobin để mang oxygen cho chính mình và cho thai nhi"],["Iron makes the baby’s bones grow strong","Sắt làm xương của em bé chắc khỏe"],["Iron gives her extra energy for respiration","Sắt cho cô ấy thêm năng lượng để hô hấp"]],a:0},
 {q:["What does the carbon monoxide from cigarette smoke do inside the blood?","Carbon monoxide từ khói thuốc lá làm gì bên trong máu?"],o:[["It kills bacteria in the blood, like an antibiotic","Nó diệt vi khuẩn trong máu, như một kháng sinh (antibiotic)"],["It helps haemoglobin carry extra oxygen","Nó giúp haemoglobin mang thêm oxygen"],["It reduces how much oxygen haemoglobin can transport, so the fetus’s cells receive less oxygen for respiration","Nó làm giảm lượng oxygen haemoglobin có thể vận chuyển, nên tế bào của thai nhi nhận ít oxygen hơn để hô hấp (respiration)"]],a:2},
 {q:["A pregnant woman has a headache and wants to take aspirin. What should she do first?","Một phụ nữ mang thai bị đau đầu và muốn dùng aspirin. Cô ấy nên làm gì trước?"],o:[["Take twice the usual dose, so it works faster","Dùng gấp đôi liều thường lệ, để thuốc nhanh có tác dụng"],["Check with a doctor or pharmacist that it is safe to take during pregnancy","Hỏi bác sĩ hoặc dược sĩ (pharmacist) xem dùng khi mang thai có an toàn không"],["Never mind — shop-bought drugs cannot reach the fetus","Không cần lo — thuốc mua ở hiệu không thể tới được thai nhi"]],a:1}
],
"sci9-u5":[
 {q:["Which list shows the metals in the correct reactivity order, most reactive first?","Danh sách nào cho thấy các kim loại theo đúng thứ tự tính phản ứng (reactivity), hoạt động nhất trước?"],o:[["Copper, zinc, magnesium, potassium","Copper, zinc, magnesium, potassium"],["Potassium, magnesium, zinc, copper","Potassium, magnesium, zinc, copper"],["Magnesium, potassium, copper, zinc","Magnesium, potassium, copper, zinc"]],a:1},
 {q:["An iron nail is left in copper sulfate solution. What do you see?","Một chiếc đinh sắt (iron) được để trong dung dịch copper sulfate. Con thấy gì?"],o:[["Nothing at all — iron cannot react with a salt","Không có gì cả — iron không thể phản ứng với một muối (salt)"],["The nail dissolves completely in a few seconds","Chiếc đinh tan hoàn toàn trong vài giây"],["The nail becomes copper-coloured and the blue solution gets paler","Chiếc đinh chuyển màu copper và dung dịch xanh trở nên nhạt hơn"]],a:2},
 {q:["Can silver displace magnesium from magnesium sulfate?","Silver có thế (displace) được magnesium khỏi magnesium sulfate không?"],o:[["No — silver is far below magnesium in the series","Không — silver nằm thấp hơn magnesium rất nhiều trong dãy"],["Yes — silver is a precious metal, so it is stronger","Có — silver là kim loại quý, nên nó mạnh hơn"],["Yes — every metal displaces every other metal","Có — mọi kim loại đều thế được mọi kim loại khác"]],a:0},
 {q:["Why are displacement reactions never carried out with potassium in the school laboratory?","Vì sao các phản ứng thế (displacement reactions) không bao giờ được thực hiện với potassium trong phòng thí nghiệm của trường?"],o:[["Potassium is not a metal","Potassium không phải là kim loại"],["Potassium is so reactive that it reacts violently with water — it would be far too dangerous","Potassium hoạt động đến mức phản ứng dữ dội với nước (water) — sẽ quá nguy hiểm"],["Potassium is too expensive to buy","Potassium quá đắt để mua"]],a:1},
 {q:["Can iron displace aluminium from aluminium oxide?","Sắt (iron) có đẩy được nhôm (aluminium) khỏi aluminium oxide không?"],o:[["Yes — iron is more reactive than aluminium","Có — sắt hoạt động hơn nhôm"],["No — aluminium is more reactive than iron, so iron cannot displace it","Không — nhôm (aluminium) hoạt động hơn sắt (iron), nên sắt không đẩy được nó"],["Yes — if the mixture is heated strongly enough","Có — nếu hỗn hợp được đun đủ mạnh"]],a:1},
 {q:["Why is the thermite reaction useful for welding railway rails?","Vì sao phản ứng nhiệt nhôm (thermite reaction) hữu ích cho việc hàn đường ray?"],o:[["It makes molten iron that joins the rails where they lie — no workshop welding equipment is needed","Nó tạo sắt nóng chảy (molten iron) nối các thanh ray ngay tại chỗ — không cần thiết bị hàn của xưởng"],["It makes aluminium oxide, which glues the rails together","Nó tạo aluminium oxide, chất này dán các thanh ray lại với nhau"],["It cools the rails down so they can be handled safely","Nó làm nguội đường ray để có thể cầm nắm an toàn"]],a:0},
 {q:["What is the word equation for the reaction inside a blast furnace?","Phương trình chữ cho phản ứng bên trong lò cao (blast furnace) là gì?"],o:[["iron oxide + carbon → iron oxide + carbon dioxide","iron oxide + carbon → iron oxide + carbon dioxide"],["iron + carbon → iron oxide + carbon dioxide","iron + carbon → iron oxide + carbon dioxide"],["iron oxide + carbon → iron + carbon dioxide","iron oxide + carbon → iron + carbon dioxide"]],a:2},
 {q:["Where does carbon fit in the reactivity series?","Carbon nằm ở đâu trong dãy hoạt động (reactivity series)?"],o:[["Right at the top, above potassium — carbon displaces every metal","Ngay trên cùng, trên cả potassium — carbon đẩy được mọi kim loại"],["Above zinc, iron, tin, lead and copper, but below aluminium — so it can displace the first group, never aluminium","Trên zinc, iron, tin, lead và copper, nhưng dưới aluminium — nên nó đẩy được nhóm đầu, không bao giờ đẩy được aluminium"],["At the very bottom, below gold — carbon displaces nothing","Ở dưới cùng, dưới cả gold — carbon không đẩy được gì"]],a:1},
 {q:["What is a salt?","Muối (salt) là gì?"],o:[["Any white crystal you find in the kitchen","Bất kỳ tinh thể trắng nào con tìm thấy trong bếp"],["A compound made from an acid, when the hydrogen of the acid is replaced by a metal","Một hợp chất (compound) tạo ra từ một acid, khi hydrogen của acid được thay bằng một kim loại (metal)"],["A weak acid used to flavour food","Một acid yếu dùng để nêm thức ăn"]],a:1},
 {q:["Which family of salts does sulfuric acid (H2SO4) make?","Sulfuric acid (H2SO4) tạo ra họ muối (salt) nào?"],o:[["Sulfates","Sulfates (sunfat)"],["Chlorides","Chlorides (clorua)"],["Nitrates","Nitrates (nitrat)"]],a:0},
 {q:["Zinc reacts with hydrochloric acid. Which salt is made?","Zinc phản ứng với hydrochloric acid. Muối (salt) nào được tạo ra?"],o:[["Zinc sulfate","Zinc sulfate"],["Zinc nitrate","Zinc nitrate"],["Zinc chloride — and hydrogen gas","Zinc chloride — và khí hydrogen"]],a:2},
 {q:["Why is copper sulfate made from copper oxide instead of from copper metal?","Vì sao copper sulfate được làm từ copper oxide thay vì từ kim loại copper?"],o:[["Copper metal is too expensive to use","Kim loại copper quá đắt để dùng"],["Copper is too unreactive — it cannot displace hydrogen from the acid","Copper quá kém hoạt động (unreactive) — nó không đẩy (displace) được hydrogen ra khỏi acid"],["Copper metal dissolves too quickly and boils the acid","Kim loại copper tan quá nhanh và làm sôi acid"]],a:1},
 {q:["What does an acid + a carbonate always produce?","Một acid + một carbonate luôn tạo ra những gì?"],o:[["A salt and hydrogen only","Một muối và hydrogen mà thôi"],["A salt, water and carbon dioxide","Một muối, nước và carbon dioxide"],["A salt and oxygen only","Một muối và oxygen mà thôi"]],a:1},
 {q:["A gas from an acid and a carbonate is bubbled through limewater, and the limewater turns milky. What is the gas?","Một khí từ acid và carbonate được sục qua nước vôi trong (limewater), và nước vôi trong hóa đục. Khí đó là gì?"],o:[["Carbon dioxide","Carbon dioxide"],["Hydrogen","Hydrogen"],["Oxygen","Oxygen"]],a:0},
 {q:["When making copper chloride, why is copper carbonate added until a little of it is left unreacted in the beaker?","Khi làm copper chloride, vì sao copper carbonate được thêm cho đến khi một ít của nó còn chưa phản ứng trong cốc?"],o:[["The leftover solid makes the crystals bigger","Chất rắn còn thừa làm tinh thể to hơn"],["The leftover solid colours the salt green","Chất rắn còn thừa làm muối có màu xanh lá"],["Adding it in excess makes sure all the acid has reacted","Cho nó vào dư (excess) bảo đảm mọi acid đã phản ứng hết"]],a:2},
 {q:["What is the difference between a base and an alkali?","Sự khác nhau giữa một base (base) và một alkali (alkali) là gì?"],o:[["A base is a liquid and an alkali is a solid","Một base là chất lỏng và một alkali là chất rắn"],["A base is a metal oxide; an alkali is a base that has dissolved in water to form an alkaline solution","Một base là một oxide kim loại; một alkali là một base đã tan trong nước để tạo dung dịch kiềm"],["There is no difference at all","Không có khác biệt nào cả"]],a:1},
 {q:["In a chemical reaction, what happens to the atoms?","Trong một phản ứng hóa học, điều gì xảy ra với các nguyên tử (atoms)?"],o:[["Some atoms are destroyed and others are created","Một số nguyên tử bị phá hủy và số khác được tạo ra"],["No atoms are lost or made — they are rearranged into new combinations","Không nguyên tử nào mất đi hay được tạo ra — chúng được sắp xếp lại (rearranged) thành các kết hợp mới"],["All the atoms join into one big atom","Tất cả nguyên tử nhập thành một nguyên tử lớn"]],a:1},
 {q:["A student reacts 37 g of magnesium with 150 g of sulfuric acid. What is the total mass of the products?","Một học sinh cho 37 g magnesium phản ứng với 150 g axit sulfuric. Tổng khối lượng của các sản phẩm (products) là bao nhiêu?"],o:[["187 g","187 g"],["150 g","150 g"],["113 g","113 g"]],a:0},
 {q:["Arun’s open flask falls from 250 g to 207 g during the calcium carbonate + hydrochloric acid reaction. Why?","Bình mở của Arun giảm từ 250 g xuống 207 g trong phản ứng calcium carbonate + axit clohydric. Vì sao?"],o:[["The atoms were destroyed by the acid","Các nguyên tử bị axit phá hủy"],["The law of conservation of mass does not work for gases","Định luật bảo toàn khối lượng không đúng với chất khí"],["Carbon dioxide gas escaped into the air, so its mass was not measured","Khí carbon dioxide thoát vào không khí, nên khối lượng của nó không được đo"]],a:2},
 {q:["A sherbet sweet fizzes in your mouth and feels cool. What kind of reaction is happening?","Một viên kẹo sherbet sủi bọt trong miệng và có cảm giác mát. Loại phản ứng nào đang xảy ra?"],o:[["An exothermic reaction — it releases energy to your mouth","Một phản ứng tỏa nhiệt (exothermic) — nó giải phóng năng lượng vào miệng"],["An endothermic reaction — it takes in energy from your mouth","Một phản ứng thu nhiệt (endothermic) — nó thu năng lượng từ miệng con"],["No reaction — fizzing is not chemistry","Không có phản ứng — sủi bọt không phải hóa học"]],a:1}
],
"sci9-u6":[
 {q:["Which of these describes the amplitude of a sound wave?","Câu nào mô tả biên độ (amplitude) của sóng âm?"],o:[["The number of times particles vibrate backwards and forwards every second","Số lần các hạt dao động qua lại mỗi giây"],["The maximum distance that particles move from their position when there is no wave","Khoảng cách lớn nhất các hạt di chuyển khỏi vị trí của chúng khi không có sóng"],["The total distance particles move forwards and backwards added together","Tổng khoảng cách các hạt di chuyển về phía trước và phía sau cộng lại"]],a:1},
 {q:["Which of these describes the frequency of a sound wave?","Câu nào mô tả tần số (frequency) của sóng âm?"],o:[["The number of times particles vibrate backwards and forwards every second","Số lần các hạt dao động qua lại mỗi giây"],["The maximum distance that particles move from rest","Khoảng cách lớn nhất các hạt di chuyển khỏi vị trí cân bằng"],["The direction particles move compared with when there is no wave","Hướng các hạt di chuyển so với khi không có sóng"]],a:0},
